version: 1.1.0
artifact: joint_simulation_layer_rules
as_of: '2026-09-23'
status: proposed_normative
depends_on:
  joint_layer_spec: '1.0'
  company_mc: 2.3.0
  conditional_mc_spec: 1.1.1
MC-G5-013:
  name: aggregate_target_shift_sigma
  severity: error
  purpose: Prevent correlated driver mappings from stacking into economically impossible target shifts.
  validation_paths: 20000
  validation_seed: use calibration.simulation.seed
  scenario: BASE
  measurement:
    growth_targets:
      evaluation_quarter: 20
      unit: absolute annual growth-rate shift
      sigma_max: 0.15
    margin_targets:
      evaluation_quarter_rule: Y3->q12; Y5->q20; Y8->q32; rolling/direct growth-independent node uses its engine evaluation quarter
      unit: absolute margin shift
      sigma_max: 0.05
    valuation_multiple_targets:
      evaluation_quarter_rule: Y3->q12; Y5->q20; Y8->q32
      unit: log multiple shift ln(M_shocked/M_base)
      sigma_max: 0.15
  procedure:
  - Collect all stochastic_targets mapping to the same target path.
  - Generate the Joint Layer driver paths using the exact root-factor correlations, driver loadings, persistence, lag and half-life logic used by company_mc.
  - Apply every mapping exactly as the engine does and sum effects at the target.
  - Measure cross-path standard deviation of the aggregate effective target perturbation.
  - Reject calibration if sigma exceeds the applicable hard cap.
  - Individual driver effects are marginal contributions inside this joint budget; do not size them as if other mapped drivers were absent.
  design_headroom:
    mature_positive_margin:
      growth_sigma_target: 0.1
      margin_sigma_target: 0.035
      log_multiple_sigma_target: 0.1
    capital_intensive_transition:
      growth_sigma_target: 0.12
      margin_sigma_target: 0.04
      log_multiple_sigma_target: 0.12
    pre_service_or_milestone_driven:
      growth_sigma_target: 0.12
      margin_sigma_target: 0.04
      log_multiple_sigma_target: 0.12
      note: Milestone probability/timing dimension caps deferred until first live archetype-C calibration.
dispersion_plausibility:
  status: diagnostic_warning_not_hard_gate_v1.1.1
  intrinsic_run: Run company_mc with driver_parameter_mapping disabled; retain calibrated company distributions, latent factors and idiosyncratic shocks.
  full_run: Normal run with Joint driver mappings enabled.
  metric: W = q95(CAGR_5Y_equity) - q5(CAGR_5Y_equity)
  reference_bands:
    mature_positive_margin:
      intrinsic_W:
      - 0.25
      - 0.5
      full_W:
      - 0.3
      - 0.6
      full_to_intrinsic_width_ratio_max: 1.5
    capital_intensive_transition:
      intrinsic_W:
      - 0.4
      - 0.85
      full_W:
      - 0.45
      - 1.0
      full_to_intrinsic_width_ratio_max: 1.5
    pre_service_or_milestone_driven:
      intrinsic_W:
      - 0.6
      - 1.3
      full_W:
      - 0.7
      - 1.5
      full_to_intrinsic_width_ratio_max: 1.6
  interpretation:
  - 'Below intrinsic band: company-specific parameter distributions are probably too narrow.'
  - 'Above full band: inspect double counting, impossible tails, milestone/failure branches or excessive terminal-value uncertainty.'
  - If full/intrinsic width ratio exceeds archetype limit, Joint Layer is dominating uncertainty rather than adding common co-movement.
  - These are plausibility diagnostics, not targets to optimize calibration against.
