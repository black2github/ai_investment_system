# Реестр триггеров: SpaceX (SPCX)
# Единственный нормативный дом того, ЧТО отслеживаем. Автоматизации OpenClaw ссылаются на id отсюда.
# Источник стратегии: Notion «инвестиции в SpaceX. Стратегия.» (июль 2026), копия — thesis.md.
#
# Классы: price (порог цены, скрипт без модели) | calendar (дата/окно) | event (новости, отчёты) | digest (сводка)
# Статусы: active (заведена автоматизация) | planned (в реестре, автоматизации ещё нет) | due (срок наступил,
#          нужно действие владельца) | done | dropped
# Даты: стратегия датирована июлем 2026, реестр составлен 2026-09-17 — часть окон уже наступила, см. notes.

meta:
  ticker: SPCX
  company: SpaceX
  strategy_source: https://app.notion.com/p/SpaceX-3a26fd56c6908032a7c8cf5331d10733
  strategy_date: 2026-07
  registry_updated: 2026-09-20  # 17.09: E-04 done, E-01 done, E-02 dropped; 20.09: вектор состояний E-10..E-33, axis у legacy; 20.09 (вечер): kpis у E-10..E-33 (патч v1.1-kpis); E-34..E-38 recalibration-триггеры D3 (Rules v1.1)
  price_source: "https://query1.finance.yahoo.com/v8/finance/chart/SPCX?range=1d&interval=1d (поле meta.regularMarketPrice)"
  reference_price_in_strategy: 124        # «НЕ входить lump-sum на $124»
  price_at_registry: 150.88               # закрытие 2026-09-16; 52 недели: 104.83–225.64
  target_average_price: "95–110 к марту 2027"
  position_plan:
    opening_2026: "5–8% портфеля"
    mittelspiel_2027: "15–20% портфеля"
    endspiel_2028: "10–15% портфеля после фиксации"

automations:
  spacex-report-check:  { covers: "E-10..E-19, E-25..E-29 (переходы по квартальным отчётам)", cadence: "после квартального отчёта SpaceX" }
  spacex-flight14-check: { covers: [SPCX-E-21], cadence: "one-shot 23.09.2026 09:00 МСК" }
  spacex-price-watch:   { pilot: true, covers: [SPCX-P-01, SPCX-P-02], cadence: "каждые 30 мин, скрипт без модели" }
  spacex-dca-reminder:  { pilot: true, covers: [SPCX-C-02],            cadence: "каждые 21 день" }
  spacex-news-watch:    { pilot: true, covers: [SPCX-E-03, SPCX-E-05, SPCX-E-06, SPCX-E-07, SPCX-E-08, SPCX-E-09], cadence: "ежедневно 09:00 Europe/Moscow" }

route:
  # Маршрут компании (степпер). current ведёт state.json → route.current; kind: stage | scenario.
  steps:
    - { id: opening, kind: stage, name: "Фаза 1 «Opening»: защита капитала, первый транш, DCA, пут-опционы (июль–декабрь 2026)" }
    - { id: mittelspiel, kind: stage, name: "Фаза 2 «Mittelspiel»: ставка на Starlink + AI, накопление на просадках (2027)" }
    - { id: endspiel, kind: stage, name: "Фаза 3 «Endspiel»: S&P 500 inclusion, конечная позиция (2028–2029)" }
    - { id: vector, kind: axis, name: "Вектор состояний по осям AI / Starlink / Starship / капиталоёмкость / valuation (states.yaml) — независим от фазы" }

triggers:

  # ---------- price: пороги цены ----------
  - id: SPCX-P-01
    class: price
    step: opening
    condition: "цена < $100 на фоне локапов (окно DCA август 2026 – март 2027)"
    action: "Удвоить транш"
    strategy_ref: "Фаза 1, ход 1.3; ход 2.2"
    probability_in_strategy: "40%"
    window: { from: 2026-08-01, to: 2027-03-31 }
    automation: spacex-price-watch
    status: active
    fired: []

  - id: SPCX-P-02
    class: price
    step: opening
    condition: "цена < $80"
    action: "Утроить транш. Пут-опционы (страйк $90–100, экспирация январь 2027) защищают от каскада <$80"
    strategy_ref: "Ход 1.2; ход 2.2"
    window: { from: 2026-08-01, to: 2027-03-31 }
    automation: spacex-price-watch
    status: active
    fired: []

  - id: SPCX-P-03
    class: price
    step: endspiel
    condition: "цена < $120 к концу 2028 (сценарий C, медвежий)"
    action: "Полный выход, thesis broken"
    strategy_ref: "Ход 3.3"
    window: { from: 2028-07-01, to: 2028-12-31 }
    automation: null
    status: planned
    notes: "Добавить в price-watch не раньше 2028-07: до этого порог $120 — зона накопления, а не выхода"

  - id: SPCX-P-04
    class: price
    step: endspiel
    condition: "цена $200–250 к концу 2028 (сценарий B, базовый)"
    action: "Фиксация 30%, держать ядро"
    strategy_ref: "Ход 3.3"
    window: { from: 2028-07-01, to: 2028-12-31 }
    automation: null
    status: planned

  - id: SPCX-P-05
    class: price
    step: endspiel
    condition: "цена $350–400 к концу 2028 (сценарий A, бычий)"
    action: "Фиксация 50%, остальное — на Марс"
    strategy_ref: "Ход 3.3"
    window: { from: 2028-07-01, to: 2028-12-31 }
    automation: null
    status: planned

  # ---------- calendar: даты и окна ----------
  - id: SPCX-C-01
    class: calendar
    step: opening
    condition: "30–45 дней после первого локап-истечения (20% инсайдерских акций, август 2026)"
    action: "Первый транш (8–12% выделенного капитала). НЕ входить lump-sum (то есть не всей суммой сразу)"
    strategy_ref: "Ход 1.1"
    window: { from: 2026-09-01, to: 2026-10-15 }
    automation: null
    status: done          # владелец 21.09.2026: закрыт покупкой 17.09 (8 акций), см. state.json
    notes: "Первый транш сделан 17.09.2026 (8 акций). Точную дату первого локапа уточнить"

  - id: SPCX-C-02
    class: calendar
    step: mittelspiel
    condition: "каждые 3–4 недели с августа 2026 по март 2027, независимо от цены (DCA — покупка равными частями по графику)"
    action: "Очередной транш 8–12%. Корректировка: цена <$100 — удвоить, <$80 — утроить"
    strategy_ref: "Ход 2.2"
    window: { from: 2026-08-01, to: 2027-03-31 }
    automation: spacex-dca-reminder
    status: active
    fired: []

  - id: SPCX-C-03
    class: calendar
    step: opening
    condition: "локап-истечение ещё 7% акций (сентябрь–октябрь 2026)"
    action: "Ожидать давление на цену; это зона для увеличенных траншей, не для паники"
    strategy_ref: "Ход 1.1"
    window: { from: 2026-09-01, to: 2026-10-31 }
    automation: null
    status: planned
    notes: "Информационный; отдельного напоминания не требует, покрывается price-watch"

  - id: SPCX-C-04
    class: calendar
    step: opening
    condition: "приближение экспирации пут-опционов (январь 2027)"
    action: "В декабре 2026 решить: ролл пута или дать истечь — в зависимости от статуса Raptor 3 и Q2/Q3 отчётов"
    strategy_ref: "Ход 1.2"
    window: { from: 2026-12-01, to: 2026-12-20 }
    automation: null
    status: planned
    notes: "Заводить one-shot напоминание на 2026-12-01"

  - id: SPCX-C-05
    class: calendar
    step: mittelspiel
    condition: "дедлайн Raptor 3: декабрь 2026"
    action: "Если Raptor 3 не заработал — NASA HLS под угрозой; НЕ ставить на Starship как катализатор 2027, ставить на Starlink + AI"
    strategy_ref: "Ход 2.3"
    window: { from: 2026-12-15, to: 2026-12-31 }
    automation: null
    status: planned
    notes: "Сверить с SPCX-E-03 / SPCX-E-09 к моменту срабатывания"

  - id: SPCX-C-06
    class: calendar
    step: endspiel
    condition: "2–3 месяца до возможного включения в S&P 500 (декабрь 2027 – январь 2028)"
    action: "Максимально нарастить позицию перед forced buying"
    strategy_ref: "Ход 3.1"
    window: { from: 2027-12-01, to: 2028-01-31 }
    automation: null
    status: planned
    notes: "Предпосылка — SPCX-E-07 (4 квартала GAAP-прибыли)"

  - id: SPCX-C-07
    class: calendar
    step: endspiel
    condition: "конец 2028 — конечная позиция"
    action: "Выбрать сценарий A/B/C по цене (SPCX-P-03..05)"
    strategy_ref: "Ход 3.3"
    window: { from: 2028-10-01, to: 2028-12-31 }
    automation: null
    status: planned

  # ---------- event: новости и отчёты ----------
  - id: SPCX-E-01
    class: event
    axis: Capital_Intensity
    step: opening
    condition: "отчёт за Q2 2026: GAAP-убыток < $3 млрд"
    action: "Подтверждение тренда — держать план"
    strategy_ref: "Ход 1.3"
    probability_in_strategy: "50%"
    automation: null
    status: done
    fired: [2026-08-04]
    notes: "Подтверждено первоисточником 17.09.2026: 10-Q от 04.08.2026, Exhibit 99.1 — GAAP net loss за Q2 2026 $541 млн (за полугодие $4,817 млн), выручка $7,814 млн. https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm"

  - id: SPCX-E-02
    class: event
    axis: Capital_Intensity
    step: opening
    condition: "отчёт за Q2 2026: GAAP-убыток > $5 млрд"
    action: "Сократить позицию на 50%, активировать пут"
    strategy_ref: "Ход 1.3"
    probability_in_strategy: "20%"
    automation: null
    status: dropped
    notes: "Не наступил: Q2 2026 GAAP-убыток $541 млн (см. SPCX-E-01). Закрыт 17.09.2026"

  - id: SPCX-E-03
    class: event
    axis: Starship
    step: opening
    condition: "Raptor 3 исправлен И тестовый полёт успешен"
    action: "Увеличить темп закупки"
    strategy_ref: "Ход 1.3"
    probability_in_strategy: "35%"
    automation: spacex-news-watch
    status: active

  - id: SPCX-E-04
    class: event
    axis: Starship
    step: mittelspiel
    condition: "IFT-13 (Starship V3) успешен"
    action: "Добавить Starship-опцион через колл-опционы"
    strategy_ref: "Ход 2.3"
    automation: null
    status: done
    fired: [2026-07-24]
    notes: "Полёт состоялся 24.07.2026 (spacex.com, Reuters), уведомлено 17.09.2026 плановым прогоном news-watch. Закрыт решением владельца 17.09.2026; действие (коллы) — на усмотрение владельца. Следующий полёт Flight 14 назначен на 22.09.2026 — отдельного триггера в стратегии нет"

  - id: SPCX-E-05
    class: event
    axis: AI
    step: mittelspiel
    condition: "Q3 или Q4 2026: AI-контракты (Alphabet ~$920M/мес + Anthropic ~$1.25B/мес ≈ $26B/год) покрывают > 60% burn rate xAI"
    action: "Перевести позицию из «спекулятивной» в «основную» (до 15–20% портфеля)"
    strategy_ref: "Ход 2.1"
    automation: spacex-news-watch
    status: active

  - id: SPCX-E-06
    class: event
    axis: Valuation
    step: mittelspiel
    condition: "объявление включения в Nasdaq-100 / Russell 1000"
    action: "Ожидать притоки $22–27 млрд — пол цены; план DCA не менять"
    strategy_ref: "Ход 2.2"
    automation: spacex-news-watch
    status: active

  - id: SPCX-E-07
    class: event
    axis: Capital_Intensity
    step: endspiel
    condition: "квартальная GAAP-прибыль (счётчик: нужны 4 квартала подряд, ожидаемо с Q2 2027)"
    action: "Отметить квартал в state.json; после 4-го — готовиться к S&P 500 inclusion (SPCX-C-06)"
    strategy_ref: "Ход 3.1"
    automation: spacex-news-watch
    status: active

  - id: SPCX-E-08
    class: event
    axis: Valuation
    step: endspiel
    condition: "официальное объявление включения в S&P 500"
    action: "Forced buying $8–12 млрд; позиция должна быть набрана заранее (SPCX-C-06)"
    strategy_ref: "Ход 3.1"
    automation: spacex-news-watch
    status: active

  - id: SPCX-E-09
    class: event
    axis: Starship
    step: opening
    condition: "Raptor 3 требует фундаментального редизайна (риск 25%)"
    action: "Ожидать зону $80–90; пут защищает; не догонять падение, ждать SPCX-P-01/02"
    strategy_ref: "Ход 1.2"
    automation: spacex-news-watch
    status: active

  # ---------- digest: фон ----------
  - id: SPCX-D-01
    class: digest
    step: endspiel
    condition: "еженедельно: Starlink (подписчики, выручка, op income), Starship, xAI/Terafab, общий новостной фон"
    action: "Сводка без рекомендаций; ориентиры стратегии: Starlink 20–25 млн подписчиков и $20B+ выручки к 2028"
    strategy_ref: "Ход 3.2"
    automation: null
    status: planned

