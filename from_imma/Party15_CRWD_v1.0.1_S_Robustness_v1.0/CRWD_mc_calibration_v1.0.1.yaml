schema_version: 1.0.2
artifact: company_mc_calibration
ticker: CRWD
as_of: '2026-10-02'
archetype: mature_positive_margin
calculation_engine_version: company_mc 2.3.1
state_vector:
  ARR_Momentum: A2
  Net_New_ARR: N2
  Platform_Adoption: P2
  Profitability_Cash: M3
  Retention_Quality: R2
  M&A_Integration: I2
simulation:
  paths: 500000
  paths_meta:
    provenance: model_assumption
    rationale: Normative production path count.
  seed: 20260920
  seed_meta:
    provenance: model_assumption
    rationale: Fixed reproducibility seed.
  antithetic_variates: true
  store_summary_quantiles:
  - 0.01
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  - 0.99
  store_summary_quantiles_meta:
    provenance: model_assumption
    rationale: Standard system summary grid.
  horizons_years:
  - 3
  - 5
  - 8
  horizons_years_meta:
    provenance: model_assumption
    rationale: Current Thesis / Primary Optimization / Persistence horizons.
revenue_model:
  segments:
    Subscription:
      base_revenue_quarterly: 1400291000.0
      base_revenue_quarterly_meta:
        provenance: verified_fact
        source_ref: 2026-07-31 | https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm
      initial_growth:
        distribution: triangular
        min: -0.05
        mode: 0.25
        max: 0.55
        provenance: model_assumption
        rationale: Q2 subscription revenue grew 27% YoY; mode 25% is anchored to disclosed Q2 growth and ARR +25%, while tails
          capture retention, Flex conversion and competitive dispersion. v1.0.1 widens downside/upside tails for platform-consolidation
          slowdown versus Flex/platform upside; mode 25% unchanged.
      long_run_growth_y8:
        distribution: triangular
        min: -0.02
        mode: 0.13
        max: 0.28
        provenance: model_assumption
        rationale: Long-run recurring-security growth mean-reverts while preserving platform consolidation upside. v1.0.1
          widens long-run normalization tails; mode 13% unchanged.
      growth_half_life_years: 2.5
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Growth normalizes over a multi-year operating cycle.
      latent_loading:
        growth: 0.68
      latent_loading_meta:
        provenance: model_assumption
        rationale: Shared demand exposure remains material alongside company-specific execution.
    Services:
      base_revenue_quarterly: 70606000.0
      base_revenue_quarterly_meta:
        provenance: verified_fact
        source_ref: 2026-07-31 | https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm
      initial_growth:
        distribution: triangular
        min: -0.16
        mode: 0.14
        max: 0.44
        provenance: model_assumption
        rationale: Services are a small, more volatile component; center is deliberately below subscription growth. v1.0.1
          widens the small services segment for contraction/implementation-cycle upside; mode 14% unchanged.
      long_run_growth_y8:
        distribution: triangular
        min: -0.07
        mode: 0.08
        max: 0.23
        provenance: model_assumption
        rationale: Long-run services growth converges to lower rates than subscription platform revenue. v1.0.1 widens long-run
          services tails; mode 8% unchanged.
      growth_half_life_years: 2.0
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Growth normalizes over a multi-year operating cycle.
      latent_loading:
        growth: 0.55
      latent_loading_meta:
        provenance: model_assumption
        rationale: Shared demand exposure remains material alongside company-specific execution.
margin_model:
  method: mean_reverting_positive_margin
  current_margin: 0.2565781288560654
  current_margin_meta:
    provenance: derived_fact
    formula: 'Q2 FY2027 FCF 377.4M / revenue 1.470897B = 25.6578%. Source: 2026-07-31 | SEC Exhibit 99.1.'
  terminal_margin_Y5:
    distribution: triangular
    min: 0.1
    mode: 0.28
    max: 0.46
    provenance: model_assumption
    rationale: Cash margin can expand with subscription scale but the range explicitly retains SBC dilution and M&A/integration
      burden as risks rather than value adjustments. v1.0.1 widens tails for SBC/M&A integration drag and scaled-platform
      cash-conversion upside; mode 28% unchanged.
  terminal_margin_Y8:
    distribution: triangular
    min: 0.12
    mode: 0.3
    max: 0.48
    provenance: model_assumption
    rationale: Long-run upside is capped below an unconstrained software case; acquisitions must earn their economics rather
      than being treated as automatic margin accretion. v1.0.1 widens long-run tails while keeping the 30% center unchanged.
  half_life_years: 2.0
  half_life_years_meta:
    provenance: model_assumption
    rationale: Cash-margin convergence horizon.
  shock_sigma: 0.04
  shock_sigma_meta:
    provenance: model_assumption
    rationale: Quarterly company-specific cash-margin noise, separate from Joint Layer drivers.
  shock_persistence: 0.5
  shock_persistence_meta:
    provenance: model_assumption
    rationale: Operating and working-capital shocks persist across adjacent quarters but mean-revert.
  lower_bound: 0.04
  lower_bound_meta:
    provenance: model_assumption
    rationale: Severe operating downside bound; discrete thesis breaks remain failure/recalibration events. v1.0.1 lowers
      the hard clipping floor so the widened downside terminal-margin tail is not mechanically truncated.
  upper_bound: 0.5
  upper_bound_meta:
    provenance: model_assumption
    rationale: Caps extrapolation beyond economically plausible mature cash conversion. v1.0.1 raises the clipping ceiling
      only to preserve the widened upside tail; no central margin assumption changes.
valuation:
  Y3:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 12.0
      mode: 32.0
      max: 56.0
      provenance: model_assumption
      rationale: Near-term recurring growth can support a premium, with broad downside for duration compression. v1.0.1 widens
        duration-compression and premium-platform tails; mode 32x unchanged.
  Y5:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 8.0
      mode: 26.0
      max: 46.0
      provenance: model_assumption
      rationale: Mature cybersecurity FCF multiple; not reverse-fitted to current market price. v1.0.1 adds a substantially
        lower compression tail for growth deceleration and a wider upside tail; mode 26x unchanged.
  Y8:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 8.0
      mode: 22.0
      max: 40.0
      provenance: model_assumption
      rationale: Further duration compression as growth normalizes. v1.0.1 widens mature-duration tails; mode 22x unchanged.
  negative_fcf_fallback:
    basis: revenue_bridge
    multiple:
      distribution: triangular
      min: 3.5
      mode: 7.0
      max: 11.0
      provenance: model_assumption
      rationale: 'Parity bridge: 7.0x revenue / 26x FCF implies 26.9% margin, close to the independently selected Y5 cash-margin
        center.'
dependencies:
  latent_factors:
  - growth
  - margin
  - valuation
  factor_correlations:
    growth__margin: 0.4
    growth__valuation: 0.35
    margin__valuation: 0.4
  factor_correlations_meta:
    provenance: model_assumption
    rationale: Enterprise demand, cash leverage and duration valuation co-move materially.
  default_loading: 0.68
  default_loading_meta:
    provenance: model_assumption
    rationale: Common-factor loading leaves material idiosyncratic execution risk.
market_path_model:
  quarterly_log_price_noise:
    annualized_sigma: 0.45
    annualized_sigma_meta:
      provenance: model_assumption
      rationale: Path-volatility calibration for drawdown diagnostics only; does not set terminal value.
  valuation_mean_reversion_half_life_years: 1.5
  valuation_mean_reversion_half_life_years_meta:
    provenance: model_assumption
    rationale: Liquid listed-equity valuation dislocations mean-revert over several quarters.
reverse_valuation_ref:
  run_ref: PENDING_HOST_BIND:CRWD_RV_v1.0_host_suffix_83e31c
  implied_revenue_cagr_5y: 0.6053225899420847
  implied_revenue_cagr_5y_meta:
    provenance: derived_fact
    formula: 'Host-accepted Reverse Valuation v1.0 suffix -83e31c: implied 5Y revenue CAGR 60.5323%; CRWD v1.0.1 does not
      change RV inputs.'
  discount_rate: 0.1
  discount_rate_meta:
    provenance: model_assumption
    rationale: Inherited from CRWD RV base calibration.
robustness_tests:
  Scenario_Robustness:
    perturbations:
      growth_modes_pp:
      - -0.03257359312880715
      - 0.03257359312880715
      margin_nodes_pp:
      - -0.019544155877284287
      - 0.019544155877284287
      terminal_multiple_pct:
      - -0.07675553226796095
      - 0.08313673674808131
      correlation_rho:
      - -0.15
      - 0.15
    perturbations_meta:
      provenance: derived_fact
      formula: 'v1.1.2 local preflight recomputed for CRWD v1.0.1 after tail widening: sigma_eq from triangular nodes; growth
        is base-revenue-weighted RMS of segment initial-growth sigma; margin is Y5 triangular sigma; multiple is Y5 log-space
        triangular sigma; perturbation = 0.25*sigma; correlation +/-0.15. Modes unchanged.'
    delta_tolerance: 0.1
    delta_tolerance_meta:
      provenance: model_assumption
      rationale: Accepted v1.1.2 tolerance for |Delta P(2x,5Y)| and |Delta P(loss>30%,5Y)|.
joint_simulation:
  layer_version: '1.0'
  active_drivers:
  - CLOUD_SOFTWARE_DEMAND
  - ACQUISITION_INTEGRATION
  - INTEREST_RATES
  - AI_COMPUTE_DEMAND
  company_idiosyncratic_factors:
  - id: CRWD_EXECUTION
    distribution: standard_normal
    persistence: 0.55
    persistence_meta:
      provenance: model_assumption
      rationale: Company-specific execution shocks persist across adjacent quarters but mean-revert.
  path_alignment:
    use_global_path_id: true
driver_parameter_mapping:
- driver_id: CLOUD_SOFTWARE_DEMAND
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Subscription.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.03
    lag_quarters: 0
    decay_half_life_quarters: 6
    meta:
      provenance: model_assumption
      rationale: Enterprise security/cloud demand primarily shifts subscription growth.
  structural_support:
  - path: revenue_model.segments.Subscription.initial_growth.mode
    contribution: 0.01
    meta:
      provenance: model_assumption
      rationale: A2/P2 central case includes continued platform consolidation demand.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Primary demand linkage.
- driver_id: ACQUISITION_INTEGRATION
  material: true
  stochastic_targets:
  - path: margin_model.terminal_margin_Y5
    transform: additive_pp
    effect_per_plus_1sigma: 0.015
    lag_quarters: 1
    decay_half_life_quarters: 8
    meta:
      provenance: model_assumption
      rationale: Integration quality affects acquired-product economics and cash margin; goodwill growth is a risk signal,
        not a valuation uplift.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: CRWD-FM-03 integration failure. Goodwill rose materially in H1; no price-fitting adjustment. SBC is monitored separately
    as dilution/cash-economics risk because no canonical SBC root driver exists.
- driver_id: INTEREST_RATES
  material: true
  stochastic_targets:
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: -0.02
    lag_quarters: 0
    decay_half_life_quarters: 6
    meta:
      provenance: model_assumption
      rationale: Higher rates compress duration valuation; operating model is not changed.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: 1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Valuation-only rate channel.
- driver_id: AI_COMPUTE_DEMAND
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Subscription.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.012
    lag_quarters: 1
    decay_half_life_quarters: 8
    meta:
      provenance: model_assumption
      rationale: AI workload proliferation modestly increases endpoint/cloud security demand but is not the primary thesis
        driver.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Secondary demand linkage; kept small to avoid synthetic AI dependence.
