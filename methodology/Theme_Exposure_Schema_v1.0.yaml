$schema: https://json-schema.org/draft/2020-12/schema
$id: Theme_Exposure_Schema_v1.0
title: Company Theme Exposure v1.0
type: object
additionalProperties: false
required:
- schema_version
- artifact
- version
- ticker
- exchange
- as_of
- base_period
- theme_taxonomy_ref
- primary_theme_id
- owner_policy_binding_basis
- source_registry
- basis_allocations
- driver_consistency
- notes
properties:
  schema_version:
    const: '1.0'
  artifact:
    const: theme_exposure
  version:
    const: '1.0'
  ticker:
    type: string
  exchange:
    type: string
  as_of:
    type: string
    format: date
  base_period:
    type: object
    additionalProperties: false
    required:
    - period_end
    - period_type
    properties:
      period_end:
        type: string
        format: date
      period_type:
        enum:
        - quarter
        - fiscal_quarter
        - semiannual
  theme_taxonomy_ref:
    type: string
  primary_theme_id:
    type: string
  owner_policy_binding_basis:
    const: revenue
  source_registry:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required:
      - url
      - source_class
      - document_date
      - period_end
      properties:
        url:
          type: string
          format: uri
        source_class:
          enum:
          - SEC_filing
          - issuer_primary
        document_date:
          type: string
          format: date
        period_end:
          type: string
          format: date
  basis_allocations:
    type: object
    additionalProperties: false
    required:
    - revenue
    - operating_income_abs
    - capex
    properties:
      revenue: &id001
        type: object
        additionalProperties: false
        required:
        - disclosure_status
        - share_method
        - total_raw_value
        - total_allocation_value
        - unit
        - rows
        - basis_provenance
        - fallback_reason
        properties:
          disclosure_status:
            enum:
            - disclosed
            - partially_disclosed
            - not_separately_disclosed
          share_method:
            enum:
            - reported_value_share
            - absolute_operating_income_share
            - fallback_100pct_primary_theme
          total_raw_value:
            type:
            - number
            - 'null'
          total_allocation_value:
            type: number
            minimum: 0
          unit:
            type: string
          rows:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
              - segment_id
              - theme_id
              - raw_value
              - allocation_value
              - share
              - unit
              - provenance
              - source_ref
              - formula
              - fallback
              - number_provenance
              properties:
                segment_id:
                  type: string
                theme_id:
                  type: string
                raw_value:
                  type: number
                allocation_value:
                  type: number
                  minimum: 0
                share:
                  type: number
                  minimum: 0
                  maximum: 1
                unit:
                  type: string
                provenance:
                  enum:
                  - verified_fact
                  - derived_fact
                  - model_assumption
                source_ref:
                  type:
                  - string
                  - 'null'
                formula:
                  type:
                  - string
                  - 'null'
                fallback:
                  enum:
                  - none
                  - fallback_100pct_primary_theme
                number_provenance:
                  type: object
                  additionalProperties: false
                  required:
                  - raw_value
                  - allocation_value
                  - share
                  properties:
                    raw_value:
                      type: object
                      additionalProperties: false
                      required:
                      - provenance
                      - source_ref
                      properties:
                        provenance:
                          enum:
                          - verified_fact
                          - derived_fact
                          - model_assumption
                        source_ref:
                          type:
                          - string
                          - 'null'
                    allocation_value:
                      type: object
                      additionalProperties: false
                      required:
                      - provenance
                      - formula
                      properties:
                        provenance:
                          enum:
                          - verified_fact
                          - derived_fact
                          - model_assumption
                        formula:
                          type:
                          - string
                          - 'null'
                    share:
                      type: object
                      additionalProperties: false
                      required:
                      - provenance
                      - formula
                      properties:
                        provenance:
                          enum:
                          - derived_fact
                          - model_assumption
                        formula:
                          type:
                          - string
                          - 'null'
          basis_provenance:
            enum:
            - verified_fact
            - derived_fact
            - model_assumption
          fallback_reason:
            type:
            - string
            - 'null'
      operating_income_abs: *id001
      capex: *id001
  driver_consistency:
    type: object
    additionalProperties: false
    required:
    - mpc_driver_taxonomy_ref
    - canonical_mpc_inputs_ref
    - strong_driver_abs_score
    - minimum_materiality_share
    - share_measure
    - fallback_share_can_satisfy
    - exceptions
    - minimum_materiality_share_meta
    properties:
      mpc_driver_taxonomy_ref:
        type: string
      canonical_mpc_inputs_ref:
        type: string
      strong_driver_abs_score:
        const: 2
      minimum_materiality_share:
        type: number
        minimum: 0
        maximum: 1
      share_measure:
        const: max_non_fallback_revenue_or_capex_share
      fallback_share_can_satisfy:
        const: false
      exceptions:
        type: array
        items:
          type: object
      minimum_materiality_share_meta:
        type: object
        additionalProperties: false
        required:
        - provenance
        - status
        properties:
          provenance:
            const: model_assumption
          status:
            const: pending_owner_judgment
  notes:
    type: array
    items:
      type: string
