schema_package_version: 1.0.5
artifact: Company Artifact Schema
json_schema_dialect: https://json-schema.org/draft/2020-12/schema
as_of: '2026-09-22'
status: accepted_schema_consolidated_republication
source_policy_ref: Source_Policy_v1.0 (Party 2; source-class enum provisionally frozen here)
provenance_schema_ref: Provenance_Schema_v1.0
files:
  states.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: states.yaml canonical artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - version
    - artifact
    - as_of
    - ticker
    - purpose
    - semantics
    - sources
    - axes
    properties:
      schema_version:
        const: 1.0.5
      version:
        type: string
      artifact:
        type: string
      as_of:
        type: string
        format: date
      ticker:
        type: string
      source_artifact:
        type:
        - string
        - 'null'
      purpose:
        type: string
      semantics:
        type: object
        additionalProperties: false
        required:
        - evidence_required
        - pending_verification_blocks_transition
        - trigger_not_decision
        - numeric_thresholds_provenance
        properties:
          evidence_required:
            type: boolean
          pending_verification_blocks_transition:
            type: boolean
          trigger_not_decision:
            const: true
          numeric_thresholds_provenance:
            const: model_assumption
          primary_only:
            type:
            - boolean
            - 'null'
          thresholds_provenance:
            type:
            - string
            - 'null'
            enum:
            - model_assumption
            - null
            deprecated: true
            description: Deprecated legacy name; migrate to numeric_thresholds_provenance.
          existing_trigger_policy:
            type:
            - string
            - 'null'
          accounting_note:
            type:
            - string
            - 'null'
      sources:
        type: object
        minProperties: 1
        additionalProperties:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - source_class
            - url
            - as_of
            properties:
              source_class:
                type: string
                enum: &id001
                - regulatory_filing
                - issuer_ir_release
                - issuer_investor_presentation
                - issuer_transcript
                - first_tier_media
                - market_data_provider
                - other_primary
              url:
                type: string
                format: uri
              as_of:
                type: string
                format: date
              title:
                type:
                - string
                - 'null'
              document_type:
                type:
                - string
                - 'null'
                deprecated: true
                description: Legacy/candidate alias; prefer type for document label.
              type:
                type:
                - string
                - 'null'
              note:
                type:
                - string
                - 'null'
              access_note:
                type:
                - string
                - 'null'
              recorded_at:
                type:
                - string
                - 'null'
                format: date-time
                description: Timestamp when the source record/link was recorded in workspace; distinct from document as_of.
          - type: string
            format: uri
            deprecated: true
            description: Deprecated scalar URL source. Deterministic migration must wrap it into source object and add source_class/as_of.
      axes:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          additionalProperties: false
          required:
          - name
          - states
          - current
          - current_evidence
          - source_refs
          properties:
            name:
              type: string
            name_ru:
              type:
              - string
              - 'null'
            states:
              type: object
              minProperties: 2
              additionalProperties:
                type: object
                additionalProperties: false
                required:
                - name
                - criteria
                properties:
                  name:
                    type: string
                  criteria:
                    type: string
            current:
              type: string
            current_evidence:
              type: array
              items:
                type:
                - string
                - object
            source_refs:
              type: array
              items:
                type: string
            prior_snapshot:
              type:
              - string
              - 'null'
            current_note:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
            evidence_type:
              type:
              - string
              - 'null'
              enum:
              - quantitative
              - qualitative_primary_source
              - mixed
              - derived_binary
              - null
            verification_rule:
              type:
              - string
              - 'null'
      changelog:
        type: array
        items:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
  kpis.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: kpis.yaml canonical artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - version
    - artifact
    - as_of
    - ticker
    - max_critical_kpis
    - zone_semantics
    - critical_kpis
    properties:
      schema_version:
        const: 1.0.5
      version:
        type: string
      artifact:
        type: string
      as_of:
        type: string
        format: date
      ticker:
        type: string
      max_critical_kpis:
        type: integer
        minimum: 1
      source_artifact:
        type:
        - string
        - 'null'
      zone_semantics:
        type: object
        additionalProperties: false
        required:
        - thresholds_provenance
        properties:
          thresholds_provenance:
            const: model_assumption
          green:
            type:
            - string
            - 'null'
          yellow:
            type:
            - string
            - 'null'
          red:
            type:
            - string
            - 'null'
      source_policy:
        type: object
        deprecated: true
        description: Legacy embedded policy. Source Policy v1.0 becomes the normative external document in Party 2.
        additionalProperties: false
        properties:
          primary:
            type: array
            items:
              type: string
          secondary:
            type: array
            items:
              type: string
          rule:
            type: string
      critical_kpis:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - unit
          - period
          - thresholds
          - last_value
          - value_type
          - source_class
          - source_url
          - verified
          - provenance
          properties:
            id:
              type: string
            name:
              type: string
            unit:
              type: string
            period:
              type: string
            source:
              type:
              - string
              - 'null'
              deprecated: true
              description: Legacy shorthand source class; use source_class.
            source_class:
              type: string
              enum: *id001
            source_ref:
              type:
              - string
              - 'null'
            thresholds:
              type: object
              additionalProperties: false
              required:
              - green
              - red
              properties:
                green:
                  type: string
                yellow:
                  type: string
                red:
                  type: string
                binary:
                  type: boolean
              allOf:
              - if:
                  required:
                  - binary
                  properties:
                    binary:
                      const: true
                then: {}
                else:
                  required:
                  - yellow
            last_value:
              type:
              - number
              - 'null'
            observation_qualifier:
              type: string
              enum:
              - exact
              - approximate
              - lower_bound
              - upper_bound
              - range
              - not_separately_disclosed
              - pending_verification
            value_range:
              type: object
              additionalProperties: false
              required:
              - min
              - max
              properties:
                min:
                  type: number
                max:
                  type: number
            last_date:
              type:
              - string
              - 'null'
              format: date
            source_url:
              type:
              - string
              - 'null'
              format: uri
            verified:
              type:
              - boolean
              - 'null'
            provenance:
              type: string
              enum: &id002
              - verified_fact
              - derived_fact
              - model_assumption
              - owner_judgment
              - normative_rule
              - external_methodology
            formula:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
            value_type:
              type: string
              enum:
              - actual
              - company_guidance
              - analyst_estimate
            target_date:
              type:
              - string
              - 'null'
              format: date
            verified_note:
              type:
              - string
              - 'null'
            verification_status:
              type:
              - string
              - 'null'
              enum:
              - pending_verification
              - not_separately_disclosed
              - null
            disclosure_status:
              type:
              - string
              - 'null'
            source_channel:
              type:
              - string
              - 'null'
            sec_mirror:
              type:
              - string
              - 'null'
              format: uri
            ir_document:
              type:
              - string
              - 'null'
              format: uri
            ir_landing_page:
              type:
              - string
              - 'null'
              format: uri
            observation_window_days:
              type:
              - integer
              - 'null'
              minimum: 1
          allOf:
          - if:
              properties:
                provenance:
                  const: derived_fact
              required:
              - provenance
            then:
              required:
              - formula
          - if:
              properties:
                observation_qualifier:
                  const: range
              required:
              - observation_qualifier
            then:
              required:
              - value_range
              properties:
                last_value:
                  type: 'null'
          - if:
              properties:
                observation_qualifier:
                  enum:
                  - not_separately_disclosed
                  - pending_verification
              required:
              - observation_qualifier
            then:
              properties:
                last_value:
                  type: 'null'
      changelog:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - date
          - change
          properties:
            version:
              type:
              - string
              - 'null'
            date:
              type: string
              format: date
            change:
              type: string
  triggers.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: triggers.yaml canonical registry artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - profile
    - meta
    - route
    - triggers
    properties:
      schema_version:
        const: 1.0.5
      meta:
        type: object
        additionalProperties: false
        required:
        - ticker
        - company
        - exchange
        - yahoo_symbol
        - registry_updated
        properties:
          ticker:
            type: string
          company:
            type: string
          exchange:
            type: string
          yahoo_symbol:
            type: string
          registry_updated:
            type: string
          source_artifact:
            type:
            - string
            - 'null'
          price_source:
            type:
            - string
            - 'null'
          price_at_registry:
            type:
            - number
            - 'null'
          position:
            type:
            - string
            - 'null'
          currency:
            type:
            - string
            - 'null'
          fiscal_year:
            type:
            - integer
            - string
            - 'null'
          horizon:
            type:
            - string
            - 'null'
          price_at_strategy:
            type:
            - number
            - 'null'
          scenario:
            type:
            - string
            - 'null'
          status_in_basket:
            type:
            - string
            - 'null'
          strategy_date:
            type:
            - string
            - 'null'
            format: date
          strategy_source:
            type:
            - string
            - 'null'
          target_weight:
            type:
            - string
            - 'null'
            description: Owner strategy target-weight expression preserved verbatim, e.g. '5%' or '0% (при подтверждении — до 5% + добавления)'. Not a normalized optimizer target.
          lot:
            type:
            - integer
            - 'null'
            minimum: 1
            description: Owner registry market-lot size, primarily for instruments with board-lot constraints.
      automations:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            covers:
              type: array
              items:
                type: string
            cadence:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
        properties:
          _note:
            type: string
            deprecated: true
            description: Deprecated legacy note; migrate to root automations_note.
      route:
        type: object
        additionalProperties: false
        required:
        - steps
        properties:
          steps:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - kind
              - name
              properties:
                id:
                  type: string
                kind:
                  type: string
                name:
                  type: string
                ref:
                  type:
                  - string
                  - 'null'
      rules:
        type: object
        additionalProperties: false
        required:
        - evidence_required
        - pending_verification_blocks_transition
        - trigger_not_decision
        properties:
          evidence_required:
            type: boolean
          pending_verification_blocks_transition:
            type: boolean
          trigger_not_decision:
            const: true
          all_numeric_thresholds_provenance:
            type:
            - string
            - 'null'
            enum:
            - model_assumption
            - null
      triggers:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - class
          - step
          - status
          properties:
            id:
              type: string
            class:
              type: string
              enum:
              - event
              - price
              - calendar
              - digest
            step:
              type: string
            axis:
              type:
              - string
              - 'null'
            transition:
              type: object
              additionalProperties: false
              required:
              - from
              - to
              properties:
                from:
                  type: string
                to:
                  type: string
            level:
              type:
              - string
              - 'null'
              enum:
              - E1
              - E2
              - E3
              - null
            kpis:
              type: array
              items:
                type: string
            condition:
              type:
              - string
              - 'null'
            condition_provenance:
              type:
              - string
              - 'null'
              enum:
              - model_assumption
              - normative_rule
              - null
            period:
              type:
              - string
              - 'null'
            source:
              type:
              - string
              - 'null'
            action:
              type:
              - string
              - 'null'
            automation:
              type:
              - string
              - 'null'
            status:
              type: string
              enum: &id004
              - active
              - planned
              - due
              - paused
              - done
              - dropped
              description: active=armed; planned=defined but not yet armed; due=condition/time window due; paused=condition remains monitored/logged but action notification/execution
                is suppressed by owner decision; done=completed/closed; dropped=permanently retired.
            fired:
              type: array
              items: {}
            note:
              type:
              - string
              - 'null'
            notes:
              type:
              - string
              - 'null'
            window:
              type:
              - string
              - object
              - 'null'
              description: Legacy registry timing/window semantics. Object form may contain provider-specific structured window data.
            priority:
              type:
              - string
              - 'null'
              description: Owner-defined qualitative registry priority preserved verbatim.
          allOf:
          - if:
              required:
              - transition
            then:
              required:
              - axis
              - level
              - kpis
              - condition
              - condition_provenance
      profile:
        type: string
        enum:
        - full_model
        - registry_only
      automations_note:
        type:
        - string
        - 'null'
    allOf:
    - if:
        properties:
          profile:
            const: full_model
        required:
        - profile
      then:
        required:
        - rules
        properties:
          meta:
            required:
            - source_artifact
            - price_source
            - price_at_registry
            - position
          triggers:
            items:
              required:
              - fired
    - if:
        properties:
          profile:
            const: registry_only
        required:
        - profile
      then:
        properties:
          rules: {}
  mpc_inputs.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: mpc_inputs.yaml canonical artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - version
    - ticker
    - artifact
    - as_of
    - driver_exposure_vector
    - driver_vector_provenance
    - failure_modes
    - driver_taxonomy_version
    properties:
      schema_version:
        const: 1.0.5
      version:
        type: string
      ticker:
        type: string
      artifact:
        const: mpc_inputs
      as_of:
        type: string
        format: date
      source_artifact:
        type:
        - string
        - 'null'
      driver_exposure_vector:
        type: object
        additionalProperties:
          type: integer
          minimum: -2
          maximum: 2
        minProperties: 1
      driver_vector_provenance:
        const: model_assumption
      driver_interpretation:
        type: object
        additionalProperties: true
      failure_modes:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - failure_id
          - common_cause_id
          - severity
          - name
          properties:
            failure_id:
              type: string
            common_cause_id:
              type: string
              pattern: ^[A-Z0-9_]+$
            severity:
              type: string
              enum:
              - low
              - medium
              - high
              - critical
            name:
              type: string
            axis_refs:
              type: array
              items:
                type: string
            shared_with:
              type: array
              items:
                type: string
            rationale:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
      failure_modes_provenance:
        type:
        - string
        - 'null'
        enum:
        - model_assumption
        - null
      cross_portfolio_common_causes:
        type: object
        additionalProperties: true
      benchmark:
        type: object
        additionalProperties: false
        properties:
          sector_id:
            type: string
          recommendation:
            type:
            - string
            - 'null'
          reason:
            type:
            - string
            - 'null'
          benchmark_id:
            type:
            - string
            - 'null'
          methodology_ref:
            type:
            - string
            - 'null'
      driver_taxonomy_version:
        type: string
      taxonomy_gap:
        type: array
        items:
          type: string
      taxonomy_gap_note:
        type:
        - string
        - 'null'
      changelog:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - date
          - change
          properties:
            date:
              type: string
              format: date
            change:
              type: string
      driver_exposure_semantics:
        type: object
        additionalProperties: false
        properties:
          scale:
            type: object
            additionalProperties:
              type: string
          provenance:
            type: string
            enum:
            - model_assumption
            - normative_rule
          direction_rule:
            type:
            - string
            - 'null'
  state.json:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: state.json canonical runtime artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - updated
    - price
    - fired
    - events_reported
    - pending_verification
    - route
    - info_log
    - scenario_state
    - state_transitions
    - kpi_observations
    - calc_runs
    properties:
      schema_version:
        const: 1.0.5
      updated:
        type: string
        format: date-time
      price:
        type: object
        additionalProperties: false
        required:
        - last
        - last_at
        - zone
        properties:
          last:
            type:
            - number
            - 'null'
          last_at:
            type:
            - string
            - 'null'
            format: date
          zone:
            type:
            - string
            - 'null'
          source_url:
            type:
            - string
            - 'null'
            format: uri
          provenance:
            type:
            - string
            - 'null'
            enum:
            - verified_fact
            - null
          symbol:
            type:
            - string
            - 'null'
          note:
            type:
            - string
            - 'null'
      fired:
        type: array
        items:
          type: object
          additionalProperties: true
          properties:
            verification_run_id:
              type:
              - string
              - 'null'
              description: Dozor verification report run_id for the underlying verified event fact.
      events_reported:
        type: array
        items:
          type: object
          additionalProperties: true
          properties:
            verification_run_id:
              type:
              - string
              - 'null'
              description: Dozor verification report run_id for the underlying verified event fact.
      pending_verification:
        type: array
        items: {}
      notes:
        oneOf:
        - type: array
          items:
            type: string
        - type:
          - string
          - 'null'
          deprecated: true
          description: Deprecated scalar note; migrate to one-element string array.
      route:
        type: object
        additionalProperties: false
        required:
        - current
        - done_steps
        - changed_at
        - note
        properties:
          current:
            type: string
          done_steps:
            type: array
            items:
              type: string
          changed_at:
            type: string
            format: date
          note:
            type:
            - string
            - 'null'
      info_log:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - timestamp
          - kind
          - summary
          properties:
            timestamp:
              type: string
              format: date-time
            kind:
              type: string
            summary:
              type: string
      scenario_state:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          required:
          - state
          - since
          - evidence
          - source
          - verified
          properties:
            state:
              type: string
            since:
              type: string
              format: date
            evidence:
              type: array
              items: {}
            source:
              type:
              - string
              - 'null'
            verified:
              type: boolean
            verified_note:
              type:
              - string
              - 'null'
            prior_snapshot:
              type:
              - string
              - 'null'
            evidence_type:
              type:
              - string
              - 'null'
              enum:
              - quantitative
              - qualitative_primary_source
              - mixed
              - derived_binary
              - null
            verification_run_id:
              type:
              - string
              - 'null'
              description: Dozor v1.1+ report run_id that protocol-verified the current axis state.
      state_transitions:
        type: array
        items:
          type: object
          additionalProperties: true
        description: Item shape deferred in v1.0 because NBIS reference contains no entries; field itself is required.
      kpi_observations:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - kpi_id
          - name
          - period_end
          - value
          - unit
          - source_url
          - verified
          - provenance
          properties:
            kpi_id:
              type: string
            name:
              type: string
            period_end:
              type: string
              format: date
            value:
              type:
              - number
              - 'null'
            observation_qualifier:
              type: string
              enum:
              - exact
              - approximate
              - lower_bound
              - upper_bound
              - range
              - not_separately_disclosed
              - pending_verification
            value_range:
              type: object
              additionalProperties: false
              required:
              - min
              - max
              properties:
                min:
                  type: number
                max:
                  type: number
            value_raw:
              type:
              - string
              - 'null'
            unit:
              type: string
            source_url:
              type: string
              format: uri
            verified:
              type:
              - boolean
              - 'null'
              description: true=verified match; false=verified mismatch/negative result; null=not yet verified.
            verified_by:
              type:
              - string
              - 'null'
            value_type:
              type:
              - string
              - 'null'
              enum:
              - actual
              - company_guidance
              - analyst_estimate
              - null
            provenance:
              type: string
              enum:
              - verified_fact
              - derived_fact
            observation_window_days:
              type:
              - integer
              - 'null'
              minimum: 1
            why:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
            verification_run_id:
              type:
              - string
              - 'null'
              description: Links this runtime KPI observation to immutable Dozor verification report portfolio/<ticker>/_verify/<run_id>.json.
            verification_run_ids:
              type: array
              uniqueItems: true
              minItems: 1
              items:
                type: string
                minLength: 1
              description: Ordered history of immutable Dozor runs that verified/re-verified the same runtime observation.
      calc_runs:
        type: array
        items:
          type: object
          additionalProperties: true
        description: Calculation engine references; item shape deferred because NBIS reference contains no entries.
      conviction:
        type: object
        additionalProperties: false
        required:
        - status
        - since
        - journal_id
        - L_max
        - provenance
        properties:
          status:
            type: string
            enum:
            - active
            - suspended
            - revoked
            - expired
            - under_review
          since:
            type: string
            format: date
          journal_id:
            type: string
          L_max:
            type: number
            minimum: 0
            maximum: 1
          provenance:
            const: owner_judgment
          exception:
            type:
            - string
            - 'null'
      owner_decisions:
        type: array
        items:
          type: object
          additionalProperties: true
      source:
        type:
        - string
        - object
        - 'null'
      verification:
        type:
        - object
        - 'null'
        additionalProperties: false
        required:
        - run_id
        - as_of
        - overall_status
        properties:
          run_id:
            type: string
            minLength: 1
            description: Immutable Dozor verification report run_id.
          as_of:
            type: string
            format: date-time
            description: Verification run timestamp, not the source-document as_of date.
          overall_status:
            type: string
            enum: &id003
            - PASS
            - PASS_WITH_DECLARED_PENDING
            - PATCH_REQUIRED
            - BLOCKED_TECHNICAL
            - BLOCKED_SOURCE_CONFLICT
            description: Copied from Dozor Verification Protocol v1.0 summary.overall_status.
        description: Pointer/summary of the latest relevant immutable verification run. Full report lives outside state.json at portfolio/<ticker>/_verify/<run_id>.json.
integrity_rules:
- id: ART-REF-001
  severity: error
  rule: 'if triggers.profile == full_model: for each triggers.triggers[*] with axis != null: axis in states.axes'
  message: Trigger axis must exist.
- id: ART-REF-002
  severity: error
  rule: 'if triggers.profile == full_model: for each trigger with transition: transition.from and transition.to in states.axes[trigger.axis].states'
  message: Transition endpoints must exist.
- id: ART-REF-003
  severity: error
  rule: 'if triggers.profile == full_model: for each triggers.triggers[*].kpis[*]: id in kpis.critical_kpis[*].id'
  message: Trigger KPI references must resolve.
- id: ART-REF-004
  severity: error
  rule: 'for each states.axes[*].source_refs[*]: ref in states.sources keys'
  message: Axis source refs must resolve.
- id: ART-REF-005
  severity: error
  rule: 'for each kpis.critical_kpis[*]: source_class in SourcePolicyV1.source_classes'
  message: KPI source class must be allowed by Source Policy.
- id: ART-REF-006
  severity: error
  rule: 'for each material numeric field: provenance resolves to Provenance_Schema_v1.0 directly or via enclosing provenance field'
  message: Material numbers require provenance.
- id: ART-REF-007
  severity: error
  rule: 'for each kpis.critical_kpis[*]: last_value is number or null'
  message: No strings/ranges in last_value.
- id: ART-REF-008
  severity: error
  rule: 'for each kpis.critical_kpis[*]: value_type in {actual,company_guidance,analyst_estimate}'
  message: Guidance/actual typing is mandatory.
- id: ART-REF-009
  severity: error
  rule: 'for each state.json.scenario_state axis: axis in states.axes'
  message: Runtime scenario axis must exist.
- id: ART-REF-010
  severity: error
  rule: 'for each state.json.scenario_state[axis].state: state == pending_verification OR state in states.axes[axis].states'
  message: Runtime state must resolve.
- id: ART-REF-011
  severity: error
  rule: 'for each state.json.kpi_observations[*].kpi_id: id in kpis.critical_kpis[*].id'
  message: Observation KPI must resolve.
- id: ART-REF-012
  severity: error
  rule: unique(kpis.critical_kpis[*].id) and unique(triggers.triggers[*].id) and unique(mpc_inputs.failure_modes[*].failure_id)
  message: Canonical IDs must be unique.
- id: ART-REF-013
  severity: error
  rule: canonical KPI/trigger/failure IDs are assigned only by Integrator and existing canonical IDs are immutable
  message: LLM cannot overwrite canonical IDs.
- id: ART-REF-014
  severity: error
  rule: keys(mpc_inputs.driver_exposure_vector) == taxonomy(mpc_inputs.driver_taxonomy_version).driver_ids
  message: Driver vector must match declared taxonomy.
- id: ART-REF-015
  severity: error
  rule: 'if triggers.rules exists: triggers.rules.trigger_not_decision == true; for triggers with status in {active, planned, due}, action text must not encode an executable trade instruction.
    For status in {paused, dropped, done}, action-text trade-language validation is skipped because the trigger is non-executing/non-notifying; trigger_not_decision remains true globally.'
  message: Active/planned/due triggers must remain monitoring/Decision-Request semantics. Paused/dropped/done triggers are exempt from action-text validation but cannot execute.
- id: ART-REF-016
  severity: error
  rule: all present canonical company files schema_version == 1.0.5
  message: All canonical files in schema profile must declare schema version 1.0.5.
- id: ART-REF-017
  severity: error
  rule: ticker identity agrees across states.yaml, kpis.yaml, triggers.yaml.meta, mpc_inputs.yaml
  message: Ticker identity must be consistent.
- id: ART-REF-018
  severity: error
  rule: if KPI observation_qualifier == range then last_value == null and value_range.min/max are numeric
  message: Ranges are represented structurally.
- id: ART-REF-019
  severity: error
  rule: if KPI observation_qualifier == lower_bound or upper_bound then last_value is numeric and qualifier carries inequality
  message: Bounds are numeric, not string-prefixed.
- id: ART-REF-020
  severity: error
  rule: 'for each KPI with source_ref != null: source_ref in states.sources keys AND KPI.source_class == states.sources[source_ref].source_class'
  message: KPI source reference/class must resolve to canonical source object.
- id: ART-REF-021
  severity: error
  rule: 'for each KPI/observation: value_type in {actual,company_guidance,analyst_estimate}; observation qualifier carries approximate/bound/range semantics'
  message: Economic value type and observation qualifier must not be conflated.
- id: ART-REF-022
  severity: error
  rule: if thresholds.binary != true then thresholds.yellow must exist; if thresholds.binary == true, green/red are required and yellow is optional
  message: Binary KPI thresholds may use two zones; non-binary KPI requires three zones.
- id: ART-REF-023
  severity: error
  rule: if scenario_state.*.evidence_type == qualitative_primary_source then evidence/source must be populated and any binary KPI derivation must be declared in accepted KPI/formula
    or verification_rule
  message: Qualitative state evidence must remain explicitly typed and auditable.
- id: ART-REF-024
  severity: error
  rule: triggers.profile == registry_only does not require states.yaml/kpis.yaml/mpc_inputs.yaml and cross-file trigger axis/KPI integrity checks are skipped
  message: Registry-only trigger files are valid without a company model.
- id: ART-REF-025
  severity: error
  rule: if state.json.verification != null then state.json.verification.run_id identifies an immutable Dozor report at portfolio/<ticker>/_verify/<run_id>.json and overall_status equals
    that report summary.overall_status
  message: state.json verification summary must match its immutable Dozor report.
- id: ART-REF-026
  severity: error
  rule: if state.json.kpi_observations[*].verification_run_id != null then the referenced run_id must exist and contain an item for the same kpi_id
  message: KPI runtime verification link must resolve to a report that verified the same KPI.
- id: ART-REF-027
  severity: warning
  rule: scenario_state.*.verified == true AND verification_run_id is absent is legacy_unlinked and MUST NOT be treated as Dozor-protocol-verified
  message: Legacy axis verified flag without run_id is informational only until protocol verification.
- id: ART-REF-028
  severity: error
  rule: if scenario_state.*.verification_run_id != null then referenced immutable Dozor report contains axis_items entry for same axis_id
  message: Axis runtime verification link must resolve to same-axis item in Dozor report.
- id: ART-REF-029
  severity: error
  rule: if events_reported[*].verification_run_id or fired[*].verification_run_id != null then referenced Dozor report contains event_items entry for the same trigger_id/event fact
  message: Runtime event verification link must resolve to corresponding Dozor event item.
- id: ART-REF-030
  severity: error
  rule: if kpi_observations[*].verification_run_ids exists then verification_run_id != null AND verification_run_ids[-1] == verification_run_id
  message: Latest single verification_run_id must equal the last entry of verification_run_ids.
- id: ART-REF-031
  severity: error
  rule: Do not append a duplicate kpi_observation when kpi_id, period_end and normalized value/value_range are unchanged. Update observation_qualifier/note/source metadata if needed,
    append new run_id to verification_run_ids, and set verification_run_id to that latest run.
  message: Re-verification history belongs on the existing observation, not in a duplicate observation row.
