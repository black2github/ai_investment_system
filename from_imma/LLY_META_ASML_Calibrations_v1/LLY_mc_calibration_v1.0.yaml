schema_version: 1.0.2
artifact: company_mc_calibration
ticker: LLY
as_of: '2026-09-24'
archetype: mature_positive_margin
calculation_engine_version: company_mc 2.3.1
state_vector:
  Incretin_Demand: D4
  Pricing_Access: P3
  Manufacturing_Expansion: M2
  Pipeline_Diversification: R3
  Cash_Economics: F3
simulation:
  paths: 500000
  paths_meta:
    provenance: model_assumption
    rationale: Normative production path count.
  seed: 20260920
  seed_meta:
    provenance: model_assumption
    rationale: Fixed reproducibility seed.
  antithetic_variates: true
  store_summary_quantiles:
  - 0.01
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  - 0.99
  store_summary_quantiles_meta:
    provenance: model_assumption
    rationale: Standard system summary grid.
  horizons_years:
  - 3
  - 5
  - 8
  horizons_years_meta:
    provenance: model_assumption
    rationale: Current Thesis / Primary Optimization / Persistence horizons.
revenue_model:
  segments:
    Tirzepatide:
      base_revenue_quarterly: 14871000000.0
      base_revenue_quarterly_meta:
        provenance: derived_fact
        formula: Q2 Mounjaro 9.943B + Zepbound 4.928B = 14.871B.
        source_ref: 2026-08-05 | https://www.sec.gov/Archives/edgar/data/59478/000005947826000081/lly-20260630.htm
      initial_growth:
        distribution: triangular
        min: 0.05
        mode: 0.35
        max: 0.8
        provenance: model_assumption
        rationale: Q2 tirzepatide revenue grew 73.3% YoY, while consolidated realized-price contribution was -13% and volume +60%; the distribution explicitly mean-reverts volume-led
          hypergrowth and includes material pricing/reimbursement downside.
      long_run_growth_y8:
        distribution: triangular
        min: -0.05
        mode: 0.12
        max: 0.28
        provenance: model_assumption
        rationale: Long-run franchise growth decays materially from current hypergrowth; the lower tail includes competitive/pricing pressure and proximity to major 2036/2037 compound-patent
          expiries on the 8Y horizon.
      growth_half_life_years: 2.0
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Hypergrowth mean-reverts over several capacity/reimbursement cycles.
      latent_loading:
        growth: 0.68
      latent_loading_meta:
        provenance: model_assumption
        rationale: Demand, reimbursement and manufacturing are shared drivers, with large product-specific safety/competition idiosyncrasy.
    RestOfPortfolio:
      base_revenue_quarterly: 8103000000.0
      base_revenue_quarterly_meta:
        provenance: derived_fact
        formula: Q2 total revenue 22.974B - tirzepatide 14.871B = 8.103B.
        source_ref: 2026-08-05 | https://www.sec.gov/Archives/edgar/data/59478/000005947826000081/lly-20260630.htm
      initial_growth:
        distribution: triangular
        min: -0.1
        mode: 0.1
        max: 0.3
        provenance: model_assumption
        rationale: Non-tirzepatide portfolio grew much more slowly than the core franchise; tails include patent/product churn and upside from pipeline launches.
      long_run_growth_y8:
        distribution: triangular
        min: -0.05
        mode: 0.06
        max: 0.18
        provenance: model_assumption
        rationale: Diversified mature pharma growth plus pipeline replacement, without treating pipeline success as guaranteed.
      growth_half_life_years: 2.5
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Portfolio launches/patent losses normalize more slowly than one quarter.
      latent_loading:
        growth: 0.5
      latent_loading_meta:
        provenance: model_assumption
        rationale: Rest-of-portfolio growth has lower exposure to the tirzepatide demand factor.
margin_model:
  method: mean_reverting_positive_margin
  current_margin: 0.2516540808453931
  current_margin_meta:
    provenance: derived_fact
    formula: (16.023B OCF - 5.259B PP&E capex)/42.773B H1 revenue = 25.17%.
  terminal_margin_Y5:
    distribution: triangular
    min: 0.2
    mode: 0.31
    max: 0.4
    provenance: model_assumption
    rationale: Manufacturing capex currently equals 12.3% of revenue; Y5 center allows normalization while preserving reimbursement, R&D, litigation and launch costs.
  terminal_margin_Y8:
    distribution: triangular
    min: 0.18
    mode: 0.28
    max: 0.37
    provenance: model_assumption
    rationale: Longer-run cash margin allows increasing patent/exclusivity and portfolio-replacement pressure.
  half_life_years: 2.5
  half_life_years_meta:
    provenance: model_assumption
    rationale: Manufacturing normalization is multi-year.
  shock_sigma: 0.045
  shock_sigma_meta:
    provenance: model_assumption
    rationale: Quarterly pricing, channel/rebate, clinical/regulatory and manufacturing mix uncertainty.
  shock_persistence: 0.45
  shock_persistence_meta:
    provenance: model_assumption
    rationale: Pricing/reimbursement and supply conditions persist but mean-revert.
  lower_bound: 0.08
  lower_bound_meta:
    provenance: model_assumption
    rationale: Severe concentration/policy downside while remaining a scaled pharma franchise.
  upper_bound: 0.45
  upper_bound_meta:
    provenance: model_assumption
    rationale: Prevents temporary mix/capex normalization from becoming implausibly permanent cash economics.
valuation:
  Y3:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 18.0
      mode: 28.0
      max: 38.0
      provenance: model_assumption
      rationale: High-growth pharma valuation with explicit concentration/policy tails.
  Y5:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 16.0
      mode: 25.0
      max: 34.0
      provenance: model_assumption
      rationale: Aligned with LLY RV terminal range and patent/reimbursement risk.
  Y8:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 12.0
      mode: 20.0
      max: 28.0
      provenance: model_assumption
      rationale: Compression as the horizon approaches major tirzepatide compound-patent expiries.
  negative_fcf_fallback:
    basis: revenue_bridge
    multiple:
      distribution: triangular
      min: 3.0
      mode: 6.0
      max: 10.0
      provenance: model_assumption
      rationale: Schema>=1.0.2 revenue-bridge reference for stressed/crossover paths; not assumed to apply only to negative FCF.
dependencies:
  latent_factors:
  - growth
  - margin
  - valuation
  factor_correlations:
    growth__margin: 0.4
    growth__valuation: 0.3
    margin__valuation: 0.35
  factor_correlations_meta:
    provenance: model_assumption
    rationale: Volume-led growth supports margin, while policy/patent/valuation shocks retain substantial independence.
  default_loading: 0.62
  default_loading_meta:
    provenance: model_assumption
    rationale: Strong franchise/common healthcare factors with material product-specific uncertainty.
market_path_model:
  quarterly_log_price_noise:
    annualized_sigma: 0.34
    annualized_sigma_meta:
      provenance: model_assumption
      rationale: Large-cap pharma path noise; used only for drawdown layer.
  valuation_mean_reversion_half_life_years: 1.75
  valuation_mean_reversion_half_life_years_meta:
    provenance: model_assumption
    rationale: Pharma valuation dislocations can persist across trial/policy cycles.
reverse_valuation_ref:
  run_ref: PENDING_HOST_RUN:LLY_calibration_v1.0.yaml
  implied_revenue_cagr_5y: 0.2062662635
  implied_revenue_cagr_5y_meta:
    provenance: derived_fact
    formula: Local deterministic preflight of accepted Reverse Valuation equation; replace run_ref with authoritative sidecar run.
  discount_rate: 0.095
  discount_rate_meta:
    provenance: model_assumption
    rationale: Inherited from LLY RV base case.
robustness_tests:
  Scenario_Robustness:
    perturbations:
      growth_modes_pp:
      - -0.03540712
      - 0.03540712
      margin_nodes_pp:
      - -0.0108756
      - 0.0108756
      terminal_multiple_pct:
      - -0.03864506
      - 0.04019853
      correlation_rho:
      - -0.15
      - 0.15
    perturbations_meta:
      provenance: derived_fact
      formula: 'v1.1.2 local robustness: sigma_eq=(Q84-Q16)/2; growth=base-revenue-weighted RMS segment initial_growth sigma_eq; margin=Y5 terminal margin sigma_eq; multiple=Y5 log-space
        sigma_eq; perturbation=0.25*sigma with accepted absolute ceilings.'
    delta_tolerance: 0.1
    delta_tolerance_meta:
      provenance: model_assumption
      rationale: 'LLY: accepted v1.1.2 tolerance for |ΔP(2x,5Y)| and |ΔP(loss>30%,5Y)|.'
joint_simulation:
  layer_version: '1.0'
  active_drivers:
  - INTEREST_RATES
  - CHINA_REVENUE
  - ACQUISITION_INTEGRATION
  - HEALTHCARE_DEMAND
  - DRUG_PIPELINE
  - REIMBURSEMENT_PRICING
  - BIOPHARMA_MANUFACTURING_CAPACITY
  - PHARMA_REGULATION
  - PATENT_EXCLUSIVITY
  company_idiosyncratic_factors:
  - id: LLY_EXECUTION
    distribution: standard_normal
    persistence: 0.55
    persistence_meta:
      provenance: model_assumption
      rationale: Pricing/access, demand, manufacturing and pipeline conditions persist across adjacent quarters.
  path_alignment:
    use_global_path_id: true
driver_parameter_mapping:
- driver_id: INTEREST_RATES
  material: true
  stochastic_targets:
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: -0.008
    lag_quarters: 0
    decay_half_life_quarters: 6.0
    meta:
      provenance: model_assumption
      rationale: Higher rates compress mature pharma valuation.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: 1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: none direct; macro valuation channel.'
- driver_id: CHINA_REVENUE
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Tirzepatide.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.006
    lag_quarters: 1
    decay_half_life_quarters: 6.0
    meta:
      provenance: model_assumption
      rationale: China/international access contributes to tirzepatide volume growth.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: GLP1_PRICING_REIMBURSEMENT / geographic access channel.'
- driver_id: ACQUISITION_INTEGRATION
  material: true
  stochastic_targets:
  - path: revenue_model.segments.RestOfPortfolio.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.008
    lag_quarters: 1
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Integration/IPR&D execution affects non-core pipeline monetization.
  - path: margin_model.terminal_margin_Y5
    transform: additive_pp
    effect_per_plus_1sigma: 0.003
    lag_quarters: 1
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Integration quality affects long-run cash conversion.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: ACQUISITION_INTEGRATION_FAILURE; LLY-FM-06.'
- driver_id: HEALTHCARE_DEMAND
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Tirzepatide.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.015
    lag_quarters: 0
    decay_half_life_quarters: 6.0
    meta:
      provenance: model_assumption
      rationale: Obesity/diabetes treatment demand directly supports volume.
  structural_support:
  - path: revenue_model.segments.Tirzepatide.initial_growth.mode
    contribution: 0.015
    meta:
      provenance: model_assumption
      rationale: Central tirzepatide growth assumes continued high underlying metabolic-disease demand.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: PRODUCT_CONCENTRATION / GLP1_COMPETITIVE_INTENSITY; LLY-FM-04/05.'
- driver_id: DRUG_PIPELINE
  material: true
  stochastic_targets:
  - path: revenue_model.segments.RestOfPortfolio.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.015
    lag_quarters: 1
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Pipeline success supports replacement growth outside current tirzepatide sales.
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: 0.01
    lag_quarters: 1
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Pipeline breadth affects duration/value multiple.
  structural_support:
  - path: revenue_model.segments.RestOfPortfolio.initial_growth.mode
    contribution: 0.01
    meta:
      provenance: model_assumption
      rationale: Central rest-of-portfolio growth includes some pipeline conversion.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: CLINICAL_REGULATORY_FAILURE; LLY-FM-03.'
- driver_id: REIMBURSEMENT_PRICING
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Tirzepatide.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.015
    lag_quarters: 0
    decay_half_life_quarters: 6.0
    meta:
      provenance: model_assumption
      rationale: Access/price realization changes revenue growth around a volume-led franchise.
  - path: margin_model.terminal_margin_Y5
    transform: additive_pp
    effect_per_plus_1sigma: 0.006
    lag_quarters: 0
    decay_half_life_quarters: 6.0
    meta:
      provenance: model_assumption
      rationale: Net price/rebate economics affect cash margin.
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: 0.008
    lag_quarters: 0
    decay_half_life_quarters: 6.0
    meta:
      provenance: model_assumption
      rationale: Durable access supports valuation duration.
  structural_support:
  - path: revenue_model.segments.Tirzepatide.initial_growth.mode
    contribution: 0.004
    meta:
      provenance: model_assumption
      rationale: Base tirzepatide growth assumes reimbursement/access pressure remains manageable enough for volume-led growth.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: GLP1_PRICING_REIMBURSEMENT; LLY-FM-01.'
- driver_id: BIOPHARMA_MANUFACTURING_CAPACITY
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Tirzepatide.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.015
    lag_quarters: 1
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Capacity availability gates volume conversion.
  - path: margin_model.terminal_margin_Y5
    transform: additive_pp
    effect_per_plus_1sigma: 0.004
    lag_quarters: 2
    decay_half_life_quarters: 10.0
    meta:
      provenance: model_assumption
      rationale: Efficient utilization of new capacity supports normalized FCF margin.
  structural_support:
  - path: revenue_model.segments.Tirzepatide.initial_growth.mode
    contribution: 0.01
    meta:
      provenance: model_assumption
      rationale: Central growth assumes material manufacturing expansion arrives without major quality/supply disruption.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: PHARMA_MANUFACTURING_CAPACITY; LLY-FM-02.'
- driver_id: PHARMA_REGULATION
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Tirzepatide.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: -0.01
    lag_quarters: 0
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: A more restrictive regulatory environment can slow indications/access.
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: -0.01
    lag_quarters: 0
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Regulatory/litigation risk raises valuation discount.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: 1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: CLINICAL_REGULATORY_FAILURE / PHARMA_LITIGATION; LLY-FM-03/07.'
- driver_id: PATENT_EXCLUSIVITY
  material: true
  stochastic_targets:
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: 0.008
    lag_quarters: 1
    decay_half_life_quarters: 10.0
    meta:
      provenance: model_assumption
      rationale: Durable exclusivity supports terminal duration.
  - path: valuation.Y8.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: 0.015
    lag_quarters: 1
    decay_half_life_quarters: 12.0
    meta:
      provenance: model_assumption
      rationale: The 8Y horizon is more sensitive to approaching 2036/2037 tirzepatide compound-patent expiries.
  structural_support:
  - path: valuation.Y8.multiple.mode
    contribution: 0.01
    meta:
      provenance: model_assumption
      rationale: Long-run multiple assumes compound-patent protection remains broadly enforceable through most of the 8Y horizon.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: PRODUCT_CONCENTRATION; LLY-FM-04.'
