    source: "Yaskawa quarterly report (по регионам)"
    automation: aiinfra-report-check
    status: active

  # ---------- event: что ломает тезис ----------
  - id: 6506-X-01
    class: event
    step: confirm
    condition: "Robotics revenue < 0% г/г два квартала подряд"
    action: "При одновременном 6506-X-02 — выйти"
    source: "Yaskawa quarterly report"
    automation: aiinfra-report-check
    status: active
  - id: 6506-X-02
    class: event
    step: confirm
    condition: "Robotics orders < 0% г/г два квартала подряд"
    action: "При одновременном 6506-X-01 — выйти"
    source: "Yaskawa quarterly report"
    automation: aiinfra-report-check
    status: active
  - id: 6506-X-03
    class: event
    step: confirm
    condition: "Orders компании < +5% г/г два квартала подряд"
    action: "Сократить на 50%"
    source: "Yaskawa quarterly report"
    automation: aiinfra-report-check
    status: active

  # ---------- calendar ----------
  - id: 6506-C-01
    class: calendar
    step: confirm
    condition: "Q2 FY2027 report — 09.10.2026"
    action: "Проверить 6506-E-01..03, E-05, X-01..03"
