    lag_quarters: 0
    decay_half_life_quarters: 6.0
    meta:
      provenance: model_assumption
      rationale: Hyperscaler/AI-lab capex directly drives accelerator demand.
  - path: valuation.Y5.multiple
    transform: multiplicative_pct
    effect_per_plus_1sigma: 0.05
    lag_quarters: 0
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Capex cycle affects terminal valuation confidence.
  structural_support:
  - path: revenue_model.segments.DataCenter.initial_growth.mode
    contribution: 0.06
    meta:
      provenance: model_assumption
      rationale: Central Data Center growth assumes continued hyperscaler/AI-lab capex.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: One-sigma adverse direction under the accepted driver sign convention.
