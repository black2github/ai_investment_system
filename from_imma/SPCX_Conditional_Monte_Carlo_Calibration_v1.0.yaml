version: "1.0"
artifact: "SPCX Conditional Monte Carlo Calibration"
as_of: "2026-09-20"
ticker: SPCX
state_vector: {AI: A2, Starlink: B2, Starship: C1, Capital_Intensity: D3}

source_facts:
  q2_2026:
    Space_revenue_b: {value: 0.962, source: "SEC Q2 2026 earnings release"}
    Connectivity_revenue_b: {value: 4.291, source: "SEC Q2 2026 earnings release"}
    AI_revenue_b: {value: 2.561, source: "SEC Q2 2026 earnings release"}
    AI_adjusted_EBITDA_b: {value: 1.146, source: "SEC Q2 2026 earnings release"}
    total_capex_b: {value: 18.369, source: "SEC Q2 2026 earnings release"}
    AI_capex_b: {value: 15.828, source: "SEC Q2 2026 earnings release"}
    nameplate_compute_GW: {value: 1.4, source: "SEC Q2 2026 earnings release"}
    Starlink_subscribers_m: {value: 12.0, source: "SEC Q2 2026 earnings release"}
    Connectivity_operating_income_b: {value: 1.656, source: "SEC Q2 2026 earnings release"}
  links:
    SEC_Q2_2026: "https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm"

simulation:
  paths: 500000
  paths_provenance: model_assumption
  seed: 20260920
  seed_provenance: model_assumption
  timestep: quarterly
  horizons_years: [3, 5, 8]
  antithetic_variates: true
  store_full_paths: false
  store_summary_quantiles: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99]

revenue_model:
  method: "segment_growth_with_mean_reversion"
  segments:
    AI:
      state_driver: A2
      annual_growth_initial:
        distribution: triangular
        min: 0.35
        mode: 0.60
        max: 0.90
        provenance: model_assumption
        rationale: "A2: монетизация доказана, но 247% YoY Q2 не экстраполируется."
      long_run_growth_y8:
        distribution: triangular
        min: 0.12
        mode: 0.25
        max: 0.40
        provenance: model_assumption
      mean_reversion_half_life_years: 2.5
      provenance: model_assumption

    Connectivity:
      state_driver: B2
      annual_growth_initial:
        distribution: triangular
        min: 0.12
        mode: 0.25
        max: 0.40
        provenance: model_assumption
        rationale: "B2: масштабная экономика доказана; 66% YoY не экстраполируется."
      long_run_growth_y8:
        distribution: triangular
        min: 0.06
        mode: 0.12
        max: 0.20
        provenance: model_assumption
      mean_reversion_half_life_years: 2.0
      provenance: model_assumption

    Space:
      state_driver: C1
      annual_growth_initial:
        distribution: triangular
        min: 0.05
        mode: 0.18
        max: 0.35
        provenance: model_assumption
        rationale: "C1 не капитализирует C2-C5; рост до подтверждения orbital/reuse ограничен."
      long_run_growth_y8:
        distribution: triangular
        min: 0.05
        mode: 0.12
        max: 0.25
        provenance: model_assumption
      mean_reversion_half_life_years: 3.0
      provenance: model_assumption

margin_model:
  method: "two_phase_nodes_with_uncertainty"
  state_driver: D3
  nodes:
    Y1:
      distribution: triangular
      min: -1.10
      mode: -0.75
      max: -0.45
      provenance: model_assumption
    Y2:
      distribution: triangular
      min: -0.35
      mode: -0.15
      max: 0.05
      provenance: model_assumption
    Y3:
      distribution: triangular
      min: 0.00
      mode: 0.10
      max: 0.18
      provenance: model_assumption
    Y4_terminal_fraction:
      distribution: triangular
      min: 0.55
      mode: 0.70
      max: 0.85
      provenance: model_assumption
    Y5_terminal_margin:
      distribution: triangular
      min: 0.20
      mode: 0.27
      max: 0.34
      provenance: "normative calibration_v1.0"
    Y8_terminal_margin:
      formula: "clip(Y5_terminal_margin + Normal(0,0.03), 0.15, 0.40)"
      provenance: model_assumption
  constraints:
    - "Y2 >= Y1"
    - "Y3 >= Y2"
    - "Y4 = Y4_terminal_fraction * Y5"
    - "Y5 >= Y4"
  interpolation: linear_between_nodes

terminal_multiple:
  Y5:
    distribution: triangular
    min: 25.0
    mode: 32.0
    max: 40.0
    unit: "x FCF"
    provenance: "normative calibration_v1.0"
  Y8:
    distribution: triangular
    min: 20.0
    mode: 27.0
    max: 35.0
    unit: "x FCF"
    provenance: model_assumption
    rationale: "Дополнительное созревание бизнеса к 8Y."
  Y3:
    method: "revenue_multiple_bridge"
    distribution: triangular
    min: 8.0
    mode: 14.0
    max: 22.0
    unit: "x revenue"
    provenance: model_assumption
    rationale: "На Y3 FCF только выходит в плюс; FCF multiple нестабилен."

dependencies:
  latent_factors:
    demand:
      affects: [AI_growth, Connectivity_growth]
    execution:
      affects: [AI_growth, Space_growth, margin_nodes]
    capital_efficiency:
      affects: [margin_nodes, terminal_margin]
  rank_correlations:
    AI_growth__Connectivity_growth: {rho: 0.30, provenance: model_assumption}
    AI_growth__Space_growth: {rho: 0.15, provenance: model_assumption}
    AI_growth__margin_improvement: {rho: 0.45, provenance: model_assumption}
    Connectivity_growth__margin_improvement: {rho: 0.35, provenance: model_assumption}
    Space_growth__margin_improvement: {rho: 0.15, provenance: model_assumption}
    terminal_margin__terminal_multiple: {rho: 0.35, provenance: model_assumption}

state_transition_effects:
  rule: "Это условные эффекты при подтверждённом переходе; текущий прогон остаётся A2+B2+C1+D3."
  C1_to_C2:
    AI_growth_shift_pp: {min: 0.0, mode: 0.0, max: 0.03, provenance: model_assumption}
    Space_growth_shift_pp: {min: 0.02, mode: 0.05, max: 0.10, provenance: model_assumption}
    note: "C2 сам по себе не даёт margin/multiple premium."
  C2_to_C3:
    Space_growth_shift_pp: {min: 0.03, mode: 0.07, max: 0.12, provenance: model_assumption}
    margin_shift_pp_from_Y3: {min: 0.00, mode: 0.02, max: 0.05, provenance: model_assumption}
  D3_to_D4:
    margin_node_shift_pp:
      Y2: {min: -0.25, mode: -0.15, max: -0.05, provenance: model_assumption}
      Y3: {min: -0.20, mode: -0.10, max: -0.05, provenance: model_assumption}
    terminal_margin_shift_pp: {min: -0.08, mode: -0.05, max: -0.02, provenance: model_assumption}

market_path_model:
  purpose: "Нужен только для max drawdown; фундаментальные terminal outcomes считаются отдельно."
  quarterly_log_price_noise:
    annualized_sigma: 0.55
    provenance: model_assumption
  valuation_mean_reversion_half_life_years: 2.0
  provenance: model_assumption
  rule: "Max drawdown маркируется model-dependent; он не является историческим прогнозом волатильности."

outputs:
  return:
    - median_CAGR_3Y
    - median_CAGR_5Y
    - median_CAGR_8Y
    - P_2x_3Y
    - P_2x_5Y
    - P_2x_8Y
    - P_5x_5Y
    - P_5x_8Y
  downside:
    - P_loss_gt_30pct
    - P_loss_gt_50pct
    - expected_shortfall_5pct
    - max_drawdown_distribution
  scenario:
    - variance_between_state_scenarios
    - variance_within_state_scenario
    - persistence_ratio
    - scenario_robustness
    - scenario_concentration

robustness_tests:
  Scenario_Robustness:
    perturbations:
      growth_modes_pp: [-0.10, 0.10]
      margin_nodes_pp: [-0.05, 0.05]
      terminal_multiple_pct: [-0.20, 0.20]
      correlation_rho: [-0.15, 0.15]
    provenance: model_assumption
    pass_rule: "Знак median_CAGR_5Y не меняется более чем в 25% perturbation runs."
    pass_rule_provenance: model_assumption

  Scenario_Concentration:
    metric: "share_of_expected_terminal_value_from_top_scenario_state"
    warning: 0.60
    fail: 0.80
    provenance: model_assumption

persistence_ratio:
  formula: "median_CAGR_8Y / median_CAGR_5Y"
  interpretation:
    strong: {condition: ">= 0.75", provenance: model_assumption}
    moderate: {condition: ">= 0.50 and < 0.75", provenance: model_assumption}
    weak: {condition: "< 0.50", provenance: model_assumption}
