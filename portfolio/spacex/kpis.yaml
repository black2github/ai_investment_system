- id: SPCX-KPI-10
  name: 'SPCX valuation multiple: market cap / TTM revenue'
  unit: x
  period: daily
  source: 'invest-calc: model valuation_multiple (цена — Yahoo chart; число акций — титульная страница 10-Q; TTM
    revenue — сумма 4 кварталов из отчётов)'
  formula: Market capitalization / trailing twelve-month revenue
  thresholds:
    green: < 30x
    yellow: 30x to <60x
    red: '>= 60x'
  last_value: 87.35
  last_date: '2026-09-18'
  last_value_raw: $152.71 × 13.1818 млрд / $23.044 млрд (invest-calc valuation_multiple)
  source_url: https://finance.yahoo.com/quote/SPCX/; https://stockanalysis.com/stocks/spcx/statistics/
  notes: Считается сайдкаром; прежние 70x/90x провайдеров различались базой выручки и числом акций. Расхождение
    с 89.9x v1.0 — из-за оценочного числа акций 13.55 млрд.
  inputs:
    price_source: https://query1.finance.yahoo.com/v8/finance/chart/SPCX
    shares_outstanding:
      value: 13181779945
      as_of: '2026-07-28'
      source: 'SEC 10-Q Q2 2026, титульная страница: Class A 7 696 293 669 + Class B 5 485 486 276'
      verified: true
      note: сумма классов A и B — для капитализации всей компании
    ttm_revenue_usd_b:
      value: 23.044
      formula: FY2025 18.674 + H1 2026 12.508 − H1 2025 8.138
      sources:
        fy_2025: SEC 10-K FY2025
        h1_2026: SEC 10-Q Q2 2026
        h1_2025: SEC 10-Q Q2 2026 (сравнительный период)
      verified: true
