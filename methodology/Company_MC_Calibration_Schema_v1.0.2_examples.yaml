schema_examples_version: 1.0.2
purpose: shape_only_with_current_engine_pin
robustness_expectation: Fixtures demonstrate schema/engine shape. Robustness pass is not asserted. Fixture C probability mapping was reduced so it no longer intentionally violates the
  accepted milestone_probability MC-G5-013 cap.
fixtures:
  A:
    fixture_role: shape_only
    robustness_pass_required: false
    calibration:
      schema_version: 1.0.2
      artifact: company_mc_calibration
      as_of: '2026-09-23'
      calculation_engine_version: company_mc 2.3.1
      simulation:
        paths: 500000
        paths_meta:
          provenance: model_assumption
          rationale: Normative production path count.
        seed: 20260920
        seed_meta:
          provenance: model_assumption
          rationale: Fixed reproducibility seed.
        antithetic_variates: true
        store_summary_quantiles:
        - 0.05
        - 0.5
        - 0.95
        store_summary_quantiles_meta:
          provenance: model_assumption
          rationale: Compact summary quantiles.
        horizons_years:
        - 3
        - 5
        - 8
        horizons_years_meta:
          provenance: model_assumption
          rationale: System horizon convention.
      dependencies:
        latent_factors:
        - growth
        - margin
        - valuation
        factor_correlations:
          growth__margin: 0.3
          growth__valuation: 0.2
          margin__valuation: 0.3
        factor_correlations_meta:
          provenance: model_assumption
          rationale: Illustrative factor correlations.
        default_loading: 0.7
        default_loading_meta:
          provenance: model_assumption
          rationale: Illustrative common-factor loading.
      market_path_model:
        quarterly_log_price_noise:
          annualized_sigma: 0.4
          annualized_sigma_meta:
            provenance: model_assumption
            rationale: Illustrative market-path noise.
        valuation_mean_reversion_half_life_years: 2.0
        valuation_mean_reversion_half_life_years_meta:
          provenance: model_assumption
          rationale: Illustrative valuation mean reversion.
      reverse_valuation_ref:
        run_ref: rv-example
        implied_revenue_cagr_5y: 0.25
        implied_revenue_cagr_5y_meta:
          provenance: derived_fact
          formula: reverse_valuation output
        discount_rate: 0.11
        discount_rate_meta:
          provenance: model_assumption
          rationale: Discount rate inherited from referenced RV calibration.
      robustness_tests:
        Scenario_Robustness:
          perturbations:
            growth_modes_pp:
            - -0.1
            - 0.1
            margin_nodes_pp:
            - -0.05
            - 0.05
            terminal_multiple_pct:
            - -0.2
            - 0.2
            correlation_rho:
            - -0.15
            - 0.15
          perturbations_meta:
            provenance: model_assumption
            rationale: v1.1 standard perturbations.
          delta_tolerance: 0.1
          delta_tolerance_meta:
            provenance: model_assumption
            rationale: v1.1 probability-delta tolerance.
      joint_simulation:
        layer_version: '1.0'
        active_drivers:
        - AI_COMPUTE_DEMAND
        company_idiosyncratic_factors:
        - id: EXECUTION
          distribution: standard_normal
          persistence: 0.5
          persistence_meta:
            provenance: model_assumption
            rationale: Illustrative execution persistence.
        path_alignment:
          use_global_path_id: true
      driver_parameter_mapping:
      - driver_id: AI_COMPUTE_DEMAND
        material: true
        stochastic_targets:
        - path: revenue_model.segments.Core.initial_growth
          transform: additive_pp
          effect_per_plus_1sigma: 0.05
          lag_quarters: 0
          decay_half_life_quarters: 4
          meta:
            provenance: model_assumption
            rationale: Illustrative sensitivity.
        structural_support:
        - path: revenue_model.segments.Core.initial_growth.mode
          contribution: 0.03
          meta:
            provenance: model_assumption
            rationale: Illustrative central support.
        stability:
          knockout:
            mode: remove_structural_support
          adverse_driver_stress:
            driver_sigma: -1.0
            meta:
              provenance: model_assumption
              rationale: Adverse demand shock.
      ticker: EXA
      archetype: mature_positive_margin
      state_vector:
        Core: A2
      revenue_model:
        segments:
          Core:
            base_revenue_quarterly: 1000000000
            base_revenue_quarterly_meta:
              provenance: verified_fact
              source_ref: TEST-Q
            initial_growth:
              distribution: triangular
              min: 0.1
              mode: 0.2
              max: 0.3
              provenance: model_assumption
              rationale: Illustrative growth.
            long_run_growth_y8:
              distribution: triangular
              min: 0.03
              mode: 0.07
              max: 0.12
              provenance: model_assumption
              rationale: Illustrative mature growth.
            growth_half_life_years: 2.0
            growth_half_life_years_meta:
              provenance: model_assumption
              rationale: Illustrative half-life.
            latent_loading:
              growth: 0.7
            latent_loading_meta:
              provenance: model_assumption
              rationale: Illustrative segment loading.
      margin_model:
        method: mean_reverting_positive_margin
        current_margin: 0.25
        current_margin_meta:
          provenance: verified_fact
          source_ref: TEST-Q
        terminal_margin_Y5:
          distribution: triangular
          min: 0.22
          mode: 0.27
          max: 0.32
          provenance: model_assumption
          rationale: Illustrative terminal margin.
        terminal_margin_Y8:
          rule: y5_plus_normal
          sigma: 0.02
          sigma_meta:
            provenance: model_assumption
            rationale: Illustrative Y8 uncertainty.
        half_life_years: 2.0
        half_life_years_meta:
          provenance: model_assumption
          rationale: Illustrative margin half-life.
        shock_sigma: 0.03
        shock_sigma_meta:
          provenance: model_assumption
          rationale: Illustrative margin shock.
        shock_persistence: 0.5
        shock_persistence_meta:
          provenance: model_assumption
          rationale: Illustrative persistence.
        lower_bound: 0.05
        lower_bound_meta:
          provenance: model_assumption
          rationale: Illustrative bound.
        upper_bound: 0.5
        upper_bound_meta:
          provenance: model_assumption
          rationale: Illustrative bound.
      valuation:
        Y3:
          basis: FCF_multiple
          multiple:
            distribution: triangular
            min: 20
            mode: 25
            max: 30
            provenance: model_assumption
            rationale: Illustrative multiple.
        Y5:
          basis: FCF_multiple
          multiple:
            distribution: triangular
            min: 18
            mode: 23
            max: 28
            provenance: model_assumption
            rationale: Illustrative multiple.
        Y8:
          basis: FCF_multiple
          multiple:
            distribution: triangular
            min: 15
            mode: 20
            max: 25
            provenance: model_assumption
            rationale: Illustrative multiple.
        negative_fcf_fallback:
          basis: revenue_bridge
          multiple:
            distribution: triangular
            min: 4
            mode: 6
            max: 8
            provenance: model_assumption
            rationale: Fallback bridge.
