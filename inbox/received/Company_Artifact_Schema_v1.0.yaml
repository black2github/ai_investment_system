              - low
              - medium
              - high
              - critical
            name:
              type: string
            axis_refs:
              type: array
              items:
                type: string
            shared_with:
              type: array
              items:
                type: string
            rationale:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
      failure_modes_provenance:
        type:
        - string
        - 'null'
        enum:
        - model_assumption
        - null
      cross_portfolio_common_causes:
        type: object
        additionalProperties: true
      benchmark:
        type: object
        additionalProperties: false
        properties:
          sector_id:
            type: string
          recommendation:
            type:
            - string
            - 'null'
          reason:
            type:
            - string
            - 'null'
          benchmark_id:
            type:
            - string
            - 'null'
      driver_taxonomy_version:
        type: string
      taxonomy_gap:
        type: array
        items:
          type: string
      taxonomy_gap_note:
        type:
        - string
        - 'null'
      changelog:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - date
          - change
          properties:
            date:
              type: string
              format: date
            change:
              type: string
  state.json:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: state.json canonical runtime artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - updated
    - price
    - fired
    - events_reported
    - pending_verification
    - route
    - info_log
    - scenario_state
    - state_transitions
    - kpi_observations
    - calc_runs
    properties:
      schema_version:
        const: '1.0'
      updated:
        type: string
        format: date-time
      price:
        type: object
        additionalProperties: false
        required:
        - last
        - last_at
        - zone
        properties:
          last:
            type:
            - number
            - 'null'
          last_at:
            type:
            - string
            - 'null'
            format: date
          zone:
            type:
            - string
            - 'null'
          source_url:
            type:
            - string
            - 'null'
            format: uri
          provenance:
            type:
            - string
            - 'null'
            enum:
            - verified_fact
            - null
      fired:
        type: array
        items: {}
      events_reported:
        type: array
        items: {}
      pending_verification:
        type: array
        items: {}
      notes:
        type:
        - string
        - 'null'
      route:
        type: object
        additionalProperties: false
        required:
        - current
        - done_steps
        - changed_at
        - note
        properties:
          current:
            type: string
          done_steps:
            type: array
            items:
              type: string
          changed_at:
            type: string
            format: date
          note:
            type:
            - string
            - 'null'
      info_log:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - timestamp
          - kind
          - summary
          properties:
            timestamp:
              type: string
              format: date-time
            kind:
              type: string
            summary:
              type: string
      scenario_state:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          required:
          - state
          - since
          - evidence
          - source
          - verified
          properties:
            state:
              type: string
            since:
              type: string
              format: date
            evidence:
              type: array
              items: {}
            source:
              type:
              - string
              - 'null'
            verified:
              type: boolean
            verified_note:
              type:
              - string
              - 'null'
            prior_snapshot:
              type:
              - string
              - 'null'
      state_transitions:
        type: array
        items:
          type: object
          additionalProperties: true
        description: Item shape deferred in v1.0 because NBIS reference contains no entries; field itself is required.
      kpi_observations:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - kpi_id
          - name
          - period_end
          - value
          - unit
          - source_url
          - verified
          - provenance
          properties:
            kpi_id:
              type: string
            name:
              type: string
            period_end:
              type: string
              format: date
            value:
              type:
              - number
              - 'null'
            observation_qualifier:
              type: string
              enum:
              - exact
              - approximate
              - lower_bound
              - upper_bound
              - range
              - not_separately_disclosed
              - pending_verification
            value_range:
              type: object
              additionalProperties: false
              required:
              - min
              - max
              properties:
                min:
                  type: number
                max:
                  type: number
            value_raw:
              type:
              - string
              - 'null'
            unit:
              type: string
            source_url:
              type: string
              format: uri
            verified:
              type: boolean
            verified_by:
              type:
              - string
              - 'null'
            value_type:
              type:
              - string
              - 'null'
              enum:
              - actual
              - company_guidance
              - analyst_estimate
              - null
            provenance:
              type: string
              enum:
              - verified_fact
              - derived_fact
      calc_runs:
        type: array
        items:
          type: object
          additionalProperties: true
        description: Calculation engine references; item shape deferred because NBIS reference contains no entries.
      conviction:
        type: object
        additionalProperties: false
        required:
        - status
        - since
        - journal_id
        - L_max
        - provenance
        properties:
          status:
            type: string
            enum:
            - active
            - suspended
            - revoked
            - expired
            - under_review
          since:
            type: string
            format: date
          journal_id:
            type: string
          L_max:
            type: number
            minimum: 0
            maximum: 1
          provenance:
            const: owner_judgment
          exception:
            type:
            - string
            - 'null'
integrity_rules:
- id: ART-REF-001
  severity: error
  rule: 'for each triggers.triggers[*] with axis != null: axis in states.axes'
  message: Trigger axis must exist.
- id: ART-REF-002
  severity: error
  rule: 'for each trigger with transition: transition.from and transition.to in states.axes[trigger.axis].states'
  message: Transition endpoints must exist.
- id: ART-REF-003
  severity: error
  rule: 'for each triggers.triggers[*].kpis[*]: id in kpis.critical_kpis[*].id'
  message: Trigger KPI references must resolve.
- id: ART-REF-004
  severity: error
  rule: 'for each states.axes[*].source_refs[*]: ref in states.sources keys'
  message: Axis source refs must resolve.
- id: ART-REF-005
  severity: error
  rule: 'for each kpis.critical_kpis[*]: source_class in SourcePolicyV1.source_classes'
  message: KPI source class must be allowed by Source Policy.
- id: ART-REF-006
  severity: error
  rule: 'for each material numeric field: provenance resolves to Provenance_Schema_v1.0 directly or via enclosing provenance field'
  message: Material numbers require provenance.
- id: ART-REF-007
  severity: error
  rule: 'for each kpis.critical_kpis[*]: last_value is number or null'
  message: No strings/ranges in last_value.
- id: ART-REF-008
  severity: error
  rule: 'for each kpis.critical_kpis[*]: value_type in {actual,company_guidance,analyst_estimate}'
  message: Guidance/actual typing is mandatory.
- id: ART-REF-009
  severity: error
  rule: 'for each state.json.scenario_state axis: axis in states.axes'
  message: Runtime scenario axis must exist.
- id: ART-REF-010
  severity: error
  rule: 'for each state.json.scenario_state[axis].state: state == pending_verification OR state in states.axes[axis].states'
  message: Runtime state must resolve.
- id: ART-REF-011
  severity: error
  rule: 'for each state.json.kpi_observations[*].kpi_id: id in kpis.critical_kpis[*].id'
  message: Observation KPI must resolve.
- id: ART-REF-012
  severity: error
  rule: unique(kpis.critical_kpis[*].id) and unique(triggers.triggers[*].id) and unique(mpc_inputs.failure_modes[*].failure_id)
  message: Canonical IDs must be unique.
- id: ART-REF-013
  severity: error
  rule: canonical KPI/trigger/failure IDs are assigned only by Integrator and existing canonical IDs are immutable
  message: LLM cannot overwrite canonical IDs.
- id: ART-REF-014
  severity: error
  rule: keys(mpc_inputs.driver_exposure_vector) == taxonomy(mpc_inputs.driver_taxonomy_version).driver_ids
  message: Driver vector must match declared taxonomy.
- id: ART-REF-015
  severity: error
  rule: triggers.rules.trigger_not_decision == true and no trigger action encodes executable trade instruction
  message: Trigger must create monitoring/Decision Request, not trade.
- id: ART-REF-016
  severity: error
  rule: all files schema_version == 1.0
  message: All canonical files must declare schema version.
- id: ART-REF-017
  severity: error
  rule: ticker identity agrees across states.yaml, kpis.yaml, triggers.yaml.meta, mpc_inputs.yaml
  message: Ticker identity must be consistent.
- id: ART-REF-018
  severity: error
  rule: if KPI observation_qualifier == range then last_value == null and value_range.min/max are numeric
  message: Ranges are represented structurally.
- id: ART-REF-019
  severity: error
  rule: if KPI observation_qualifier == lower_bound or upper_bound then last_value is numeric and qualifier carries inequality
  message: Bounds are numeric, not string-prefixed.
