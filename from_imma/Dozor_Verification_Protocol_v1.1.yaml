version: 1.1.0
artifact: dozor_verification_protocol
id: Dozor_Verification_Protocol_v1.1
as_of: '2026-09-22'
status: proposed_normative
supersedes: Dozor_Verification_Protocol_v1.0
backward_compatibility: v1.0 reports remain valid; axis_items and event_items are optional.
gate: G8_SOURCE_VERIFICATION
source_policy_ref: Source_Policy_v1.0
artifact_schema_ref: Company_Artifact_Schema_v1.0.4
storage:
  report_path: portfolio/<ticker>/_verify/<run_id>.json
  immutable: true
  state_json_contains_only_summary_and_runtime_links: true
  report_as_of_semantics: date-time moment of verification run
  source_as_of_semantics: date of document publication/filing
  source_recorded_at_semantics: optional date-time when source record/link was written to workspace
principles:
  single_report_single_run_id_single_G8: true
  evidence_pack_is_hint_not_authority: true
  dozor_reopens_or_independently_retrieves_source: true
  trigger_not_decision: true
  event_verification_does_not_equal_trigger_firing: true
  technical_failure_is_not_evidence_failure: true
  no_estimation_of_undisclosed_values: true
status_registry:
  kpi:
    verified_match:
      label_ru: подтверждено
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
      semantics: Source supports value/type/qualifier/unit/period without material normalization.
    verified_match_with_normalization:
      label_ru: подтверждено с нормализацией
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
      semantics: Source supports the observation after allowed unit/scale/rounding or qualifier normalization.
    mismatch_value:
      label_ru: расхождение значения
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
      semantics: Verified source value differs beyond allowed tolerance.
    mismatch_period:
      label_ru: расхождение периода
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
      semantics: Value may match, but source period/window semantics differ from candidate.
    mismatch_semantics:
      label_ru: расхождение смысла (прогноз ≠ факт)
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
      semantics: Economic/source meaning differs, including company guidance recorded as actual.
    formula_mismatch:
      label_ru: формула не сходится
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
      semantics: Derived formula cannot be reproduced from verified inputs within tolerance.
    source_not_allowed:
      label_ru: источник не допускается
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
      semantics: Evidence source is not allowed for this fact under Source Policy v1.0.
    source_unavailable_technical:
      label_ru: источник недоступен технически
      runtime_verified: null
      gate_effect: BLOCKED_TECHNICAL
      default_patch_required: false
      semantics: Required evidence could not be checked due to technical access/fetch/tool failure after required retries.
    source_conflict:
      label_ru: источники противоречат
      runtime_verified: null
      gate_effect: BLOCKED_SOURCE_CONFLICT
      default_patch_required: false
      semantics: Allowed authoritative sources materially conflict and cannot be resolved by document/period identity.
    not_disclosed:
      label_ru: компания не раскрывает
      runtime_verified: true
      gate_effect: conditional_pass
      default_patch_required: false
      semantics: Non-disclosure is established. Pass only when candidate is null + not_separately_disclosed.
    not_found:
      label_ru: в источнике не найдено
      runtime_verified: null
      gate_effect: conditional_pending_or_patch
      default_patch_required: false
      semantics: Complete accessible reviewed source set does not contain the requested fact; this does not prove non-disclosure.
  axis:
    state_supported:
      label_ru: текущее состояние подтверждено
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
      semantics: Verified KPI/qualitative evidence supports the currently recorded axis state under its criterion.
    state_not_supported:
      label_ru: текущее состояние не подтверждается
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
      semantics: Verified evidence contradicts or fails the criterion for the recorded concrete current state.
    state_pending_verification:
      label_ru: состояние ожидает подтверждения
      runtime_verified: false
      gate_effect: conditional_pending_or_patch
      default_patch_required: false
      semantics: Evidence is insufficient to assign/confirm a concrete state. No technical source failure is implied.
    evidence_unavailable_technical:
      label_ru: свидетельство недоступно технически
      runtime_verified: null
      gate_effect: BLOCKED_TECHNICAL
      default_patch_required: false
      semantics: Axis evidence cannot be checked because required source is technically unavailable.
    evidence_conflict:
      label_ru: свидетельства по состоянию противоречат
      runtime_verified: null
      gate_effect: BLOCKED_SOURCE_CONFLICT
      default_patch_required: false
      semantics: Allowed evidence sources/KPI observations materially conflict, preventing state verification.
  event:
    event_confirmed_primary:
      label_ru: событие подтверждено первоисточником
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
      semantics: Event fact is confirmed by an allowed primary source.
    event_confirmed_two_media:
      label_ru: событие подтверждено двумя СМИ первого ряда
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
      semantics: No accessible primary source is available; event is independently confirmed by two approved first-tier media sources.
    event_unconfirmed:
      label_ru: событие не подтверждено
      runtime_verified: false
      gate_effect: conditional_pending_or_patch
      default_patch_required: false
      semantics: Available evidence is insufficient to confirm the claimed event.
    event_contradicted:
      label_ru: событие опровергнуто
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
      semantics: Authoritative evidence materially contradicts the claimed event.
    source_unavailable_technical:
      label_ru: источник недоступен технически
      runtime_verified: null
      gate_effect: BLOCKED_TECHNICAL
      default_patch_required: false
      semantics: Event evidence could not be checked due to technical failure after required retries/fallbacks.
  overall:
    PASS:
      label_ru: пройдено
    PASS_WITH_DECLARED_PENDING:
      label_ru: пройдено, есть заявленные ожидания
    PATCH_REQUIRED:
      label_ru: нужна правка
    BLOCKED_TECHNICAL:
      label_ru: заблокировано технически
    BLOCKED_SOURCE_CONFLICT:
      label_ru: 'заблокировано: источники противоречат'
kpi_rules:
  not_found_vs_not_disclosed:
    explicit_example:
      case: Company discloses 5 GW year-end guidance for contracted power but does not state actual contracted power as of reporting date.
      status: not_found
      reason: Guidance is a different value type and does not establish that current actual is intentionally/not separately disclosed.
    not_disclosed_requires:
    - explicit statement that metric is not separately disclosed; OR
    - a disclosure structure that affirmatively establishes the requested separate metric is not disclosed/derivable, not merely absent from reviewed text
  qualifier_difference:
    rule: If numeric value/value_type/unit/period match but source qualifier differs from candidate (e.g. approximate vs exact, lower_bound vs exact), use verified_match_with_normalization.
    normalization_step_format: 'qualifier: source=<source_qualifier>, candidate=<candidate_qualifier>'
    qualifier_patch_suggested: true
    patch_required: false
    integrator_action: May deterministically harmonize observation_qualifier to found.observation_qualifier without changing numeric value or value_type.
  range_from_single_phrase:
    rule: A single authoritative excerpt containing both range endpoints (e.g. 50–60%) is sufficient; endpoints must both match after normalization. Two separate citations are not required.
  consecutive_periods:
    rule: Dozor verifies each observation and its period_end only. It does not count N consecutive quarters/periods.
    owner: deterministic transition/state-history evaluator
    input_history: state.json.kpi_observations ordered by period_end
    axis_note: If a current-state criterion itself requires N periods, axis state_supported requires a deterministic history_evaluation_ref; otherwise state_pending_verification.
axis_verification:
  inputs:
  - states.yaml current state and its criteria/criteria_provenance
  - scenario_state runtime current state
  - KPI items verified in the same report
  - primary-source qualitative evidence where evidence_type=qualitative_primary_source
  - optional deterministic history_evaluation_ref for N-period criteria
  legacy_rule: scenario_state[axis].verified=true without verification_run_id is legacy_unlinked and is not protocol verification.
  runtime_write_rules:
    state_supported: write verified=true and verification_run_id=run_id
    state_not_supported: write verified=false and verification_run_id=run_id; PATCH_REQUIRED
    state_pending_verification: write verified=false and verification_run_id=run_id; no patch only when canonical state is already pending_verification, otherwise PATCH_REQUIRED
    evidence_unavailable_technical: do not overwrite verified; no verification_run_id write; BLOCKED_TECHNICAL
    evidence_conflict: do not overwrite verified; no verification_run_id write; BLOCKED_SOURCE_CONFLICT
event_verification:
  primary_rule: Allowed primary source confirmation -> event_confirmed_primary.
  two_media_rule: If no accessible primary source exists, two independent approved first-tier media source identities are required for event_confirmed_two_media.
  independence_rule: Syndicated copies, mirrors or articles relying on the same single report do not count as two independent media sources.
  runtime_write_rules:
    confirmed_event: May create/link events_reported runtime record with verification_run_id.
    fired: Dozor G8 never creates or executes fired. A separate trigger-condition evaluator/owner workflow may create fired, which may then carry the same verification_run_id for the
      underlying fact.
    event_unconfirmed: If no event had been canonically reported/fired, leave pending; if an existing runtime event is asserted as confirmed, request patch/review.
    event_contradicted: runtime_verified=false and PATCH_REQUIRED.
    source_unavailable_technical: runtime_verified=null and BLOCKED_TECHNICAL.
gate_aggregation:
  precedence:
  - BLOCKED_SOURCE_CONFLICT
  - BLOCKED_TECHNICAL
  - PATCH_REQUIRED
  - PASS_WITH_DECLARED_PENDING
  - PASS
  rules:
  - Any KPI source_conflict or axis evidence_conflict -> BLOCKED_SOURCE_CONFLICT.
  - Any required KPI/axis/event source_unavailable_technical -> BLOCKED_TECHNICAL unless the event is validly confirmed by two first-tier media under Source Policy.
  - Any patch_required=true item -> PATCH_REQUIRED.
  - Declared pending KPI/axis/event without patch -> PASS_WITH_DECLARED_PENDING.
  - Otherwise PASS.
output_report_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://ai-investment-system.local/schemas/dozor-verification-report/1.1
  title: Dozor Verification Report v1.1
  type: object
  additionalProperties: false
  required:
  - protocol_version
  - run_id
  - ticker
  - as_of
  - inputs
  - items
  - summary
  properties:
    protocol_version:
      type: string
      enum:
      - 1.0.0
      - 1.1.0
    run_id:
      type: string
      minLength: 1
    ticker:
      type: string
      minLength: 1
    as_of:
      type: string
      format: date-time
      description: Verification run timestamp; distinct from source document as_of date.
    inputs:
      type: object
      additionalProperties: false
      required:
      - kpis_ref
      - source_registry_ref
      - evidence_pack_ref
      properties:
        kpis_ref:
          type: string
        source_registry_ref:
          type: string
        evidence_pack_ref:
          type:
          - string
          - 'null'
        artifact_schema_version:
          type:
          - string
          - 'null'
        state_ref:
          type:
          - string
          - 'null'
        triggers_ref:
          type:
          - string
          - 'null'
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - kpi_id
        - status
        - candidate
        - source_check
        - found
        - normalization
        - runtime_verified
        - patch_required
        properties:
          kpi_id:
            type: string
          status:
            type: string
            enum:
            - verified_match
            - verified_match_with_normalization
            - mismatch_value
            - mismatch_period
            - mismatch_semantics
            - formula_mismatch
            - source_not_allowed
            - source_unavailable_technical
            - source_conflict
            - not_disclosed
            - not_found
          candidate:
            type: object
            additionalProperties: true
            required:
            - last_value
            - value_type
            - observation_qualifier
            - unit
            - period
          source_check:
            type: object
            additionalProperties: false
            required:
            - source_ref
            - source_class
            - url
            - allowed_by_policy
            - technical_status
            properties:
              source_ref:
                type:
                - string
                - 'null'
              source_class:
                type:
                - string
                - 'null'
              url:
                type:
                - string
                - 'null'
              allowed_by_policy:
                type:
                - boolean
                - 'null'
              technical_status:
                type: string
                enum:
                - accessible
                - unavailable_technical
                - not_attempted
              technical_error:
                type:
                - string
                - 'null'
              evidence_locator:
                type:
                - string
                - 'null'
              evidence_excerpt:
                type:
                - string
                - 'null'
                maxLength: 1600
          found:
            type: object
            additionalProperties: false
            required:
            - value
            - value_type
            - observation_qualifier
            - unit
            - period
            properties:
              value:
                type:
                - number
                - 'null'
              value_range:
                type:
                - object
                - 'null'
                additionalProperties: false
                properties:
                  min:
                    type:
                    - number
                    - 'null'
                  max:
                    type:
                    - number
                    - 'null'
              value_type:
                type:
                - string
                - 'null'
                enum:
                - actual
                - company_guidance
                - analyst_estimate
                - null
              observation_qualifier:
                type:
                - string
                - 'null'
                enum:
                - exact
                - approximate
                - lower_bound
                - upper_bound
                - range
                - not_separately_disclosed
                - pending_verification
                - null
              unit:
                type:
                - string
                - 'null'
              period:
                type:
                - string
                - 'null'
              formula_recomputed_value:
                type:
                - number
                - 'null'
          normalization:
            type: object
            additionalProperties: false
            required:
            - applied
            - steps
            properties:
              applied:
                type: boolean
              steps:
                type: array
                items:
                  type: string
              numeric_difference:
                type:
                - number
                - 'null'
              relative_difference:
                type:
                - number
                - 'null'
          qualifier_patch_suggested:
            type: boolean
            default: false
          mismatch_reason:
            type:
            - string
            - 'null'
          runtime_verified:
            type:
            - boolean
            - 'null'
          patch_required:
            type: boolean
          notes:
            type:
            - string
            - 'null'
    axis_items:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - axis_id
        - current_state
        - criteria
        - criteria_provenance
        - evidence_type
        - status
        - kpi_item_refs
        - source_evidence
        - criterion_checks
        - runtime_verified
        - patch_required
        properties:
          axis_id:
            type: string
          current_state:
            type: string
          prior_snapshot:
            type:
            - string
            - 'null'
          criteria:
            type:
            - string
            - 'null'
          criteria_provenance:
            type:
            - string
            - 'null'
          evidence_type:
            type:
            - string
            - 'null'
            enum:
            - quantitative
            - qualitative_primary_source
            - mixed
            - derived_binary
            - null
          status:
            type: string
            enum:
            - state_supported
            - state_not_supported
            - state_pending_verification
            - evidence_unavailable_technical
            - evidence_conflict
          kpi_item_refs:
            type: array
            items:
              type: string
          source_evidence:
            type: array
            items: &id001
              type: object
              additionalProperties: false
              required:
              - source_ref
              - source_class
              - url
              - technical_status
              properties:
                source_ref:
                  type:
                  - string
                  - 'null'
                source_class:
                  type:
                  - string
                  - 'null'
                url:
                  type:
                  - string
                  - 'null'
                technical_status:
                  type: string
                  enum:
                  - accessible
                  - unavailable_technical
                  - not_attempted
                evidence_locator:
                  type:
                  - string
                  - 'null'
                evidence_excerpt:
                  type:
                  - string
                  - 'null'
                  maxLength: 1600
                independent_source_identity:
                  type:
                  - string
                  - 'null'
                notes:
                  type:
                  - string
                  - 'null'
          criterion_checks:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - expression
              - result
              - evidence_kpi_refs
              properties:
                expression:
                  type: string
                result:
                  type:
                  - boolean
                  - 'null'
                evidence_kpi_refs:
                  type: array
                  items:
                    type: string
                calculation:
                  type:
                  - string
                  - 'null'
                notes:
                  type:
                  - string
                  - 'null'
          history_evaluation_ref:
            type:
            - string
            - 'null'
          runtime_verified:
            type:
            - boolean
            - 'null'
          patch_required:
            type: boolean
          notes:
            type:
            - string
            - 'null'
    event_items:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - trigger_id
        - trigger_family
        - event_claim
        - status
        - primary_sources
        - media_sources
        - fact_only
        - runtime_verified
        - patch_required
        - runtime_targets
        properties:
          trigger_id:
            type: string
          trigger_family:
            type: string
            enum:
            - E
            - X
          event_claim:
            type: string
          event_date:
            type:
            - string
            - 'null'
            format: date
          status:
            type: string
            enum:
            - event_confirmed_primary
            - event_confirmed_two_media
            - event_unconfirmed
            - event_contradicted
            - source_unavailable_technical
          primary_sources:
            type: array
            items: *id001
          media_sources:
            type: array
            items: *id001
          fact_only:
            const: true
          runtime_verified:
            type:
            - boolean
            - 'null'
          patch_required:
            type: boolean
          runtime_targets:
            type: array
            items:
              type: string
              enum:
              - events_reported
              - fired
          notes:
            type:
            - string
            - 'null'
    summary:
      type: object
      additionalProperties: false
      required:
      - overall_status
      - counts
      - patch_required_kpis
      - technical_blocked_kpis
      - pending_kpis
      properties:
        overall_status:
          type: string
          enum:
          - PASS
          - PASS_WITH_DECLARED_PENDING
          - PATCH_REQUIRED
          - BLOCKED_TECHNICAL
          - BLOCKED_SOURCE_CONFLICT
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        patch_required_kpis:
          type: array
          items:
            type: string
        technical_blocked_kpis:
          type: array
          items:
            type: string
        pending_kpis:
          type: array
          items:
            type: string
        qualifier_patch_suggested_kpis:
          type: array
          items:
            type: string
        axis_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        event_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        patch_required_axes:
          type: array
          items:
            type: string
        technical_blocked_axes:
          type: array
          items:
            type: string
        pending_axes:
          type: array
          items:
            type: string
        patch_required_events:
          type: array
          items:
            type: string
        technical_blocked_events:
          type: array
          items:
            type: string
        pending_events:
          type: array
          items:
            type: string
