# Сценарий «Тайвань»: общий для нескольких компаний пакет действий.
# Источник: финальный блок обсуждения «Инвестиции в ИИ-инфраструктуру» (ChatGPT, 17.09.2026), раздел E.
# Действия — уведомления владельцу; агент сделок не совершает. Вероятности намеренно не заданы.
# Позже сюда же ляжет сценарий из WAR-ECONOMY (другой набор позиций, свои действия).

scenario: TAIWAN
registry_updated: 2026-09-17
source: https://chatgpt.com/share/6aabd184-f904-83ed-bc0e-2ebd7172c89b
signal_sources: ["Taiwan MND (Министерство обороны Тайваня)", "Reuters", "официальные заявления КНР"]
confirmation_rule: "первоисточник (Taiwan MND / официальное заявление КНР) ИЛИ Reuters; одиночные СМИ второго ряда — не подтверждение"

stages:
  - id: TAIWAN-S1
    name: "Частичное ограничение судоходства / воздушного движения"
    signal: "официальное объявление КНР о зоне ограничений вокруг Тайваня ЛИБО подтверждённое Reuters фактическое ограничение коммерческого судоходства"
    actions:
      ETN:  "держать"
      SU:   "держать"
      NET:  "держать"
      6506: "продать 25% позиции"
      6324: "продать 40% позиции"
      cash_reallocation: "высвобожденное: 50% → Eaton, 30% → Schneider, 20% → кэш"
    automation: aiinfra-news-watch
    status: active

  - id: TAIWAN-S2
    name: "Фактическая морская блокада"
    signal: "Taiwan MND + Reuters подтверждают фактическое перекрытие основных морских маршрутов / запрет коммерческого судоходства"
    actions:
      ETN:  "держать, добавить 10% портфеля"
      SU:   "держать, добавить 5% портфеля"
      NET:  "держать"
      6506: "продать 50% позиции"
      6324: "продать 75% позиции"
    automation: aiinfra-news-watch
    status: active

  - id: TAIWAN-S3
    name: "Военный конфликт"
    signal: "Taiwan MND официально сообщает о применении силы / ракетных ударах ЛИБО Reuters подтверждает начало вооружённых столкновений"
    actions:
      ETN:  "держать"
      SU:   "держать"
      NET:  "продать 25% позиции"
      6506: "продать 75% позиции"
      6324: "продать 100% позиции"
      timing: "не покупать падение первые 5 торговых дней; после 5 дней, если guidance Eaton/Schneider не снижен >10% — вернуть половину проданного капитала в ETN/SU"
    automation: aiinfra-news-watch
    status: active

notes:
  - "Стадии упорядочены по тяжести; при переходе на более тяжёлую стадию действия суммируются не арифметически, а по целевому остатку позиции (S2 → остаток 6324 = 25%, S3 → 0%)."
  - "Компании WAR-ECONOMY (NVDA, ASML, AVGO, MSFT, META, PLTR…) в этот файл не входят — отдельный набор действий после онбординга той стратегии."
