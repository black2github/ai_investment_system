  rule: Last value без подтвержденного источника не используется для state transition.
critical_kpis:
- id: SPCX-KPI-01
  name: AI revenue YoY
  unit: '%'
  period: quarter
  source: SEC
  formula: (AI revenue_t / AI revenue_t-4 - 1) * 100
  thresholds:
    green: '>= 50%'
    yellow: 20% to <50%
    red: <20%
  last_value: 247
  last_date: '2026-06-30'
  last_value_raw: $2.561B
  source_url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm
- id: SPCX-KPI-02
  name: AI revenue
  unit: USD
  period: quarter
  source: SEC
  formula: AI segment revenue for quarter
  thresholds:
    green: '>= $3.0B'
    yellow: $1.0B to <$3.0B
    red: <$1.0B
  last_value: 2.561
  last_date: '2026-06-30'
  last_value_raw: $2.561B
  source_url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm
