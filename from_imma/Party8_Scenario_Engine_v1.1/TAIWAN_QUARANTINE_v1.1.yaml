schema_version: '1.1'
as_of: '2026-09-27'
supersedes: TAIWAN_QUARANTINE_v1.0.yaml
scenario_id: TAIWAN_QUARANTINE
description: 'Gray-zone Taiwan quarantine led by PRC coast-guard/law-enforcement pressure: inspections, partial port/route restrictions,
  shipping/insurance and capital-market friction without armed conflict; followed by partial normalization or a persistent frozen gray-zone
  regime.'
status: proposed_normative
mutual_exclusion_set: GEOTECH_REGIME_8Y_V1
probability: null
probability_status: pending_owner_judgment
probability_meta:
  provenance: owner_judgment
  rationale: Owner has not yet set the normative probability. Owner orientation supplied with the order is 15–20% through end-2028; calibration
    must not convert that range into a point estimate.
scope:
  event_catalog_ref: Scenario_Event_Catalog_v1.0.yaml
  outcome_mapping_ref: Scenario_Event_Catalog_v1.0.yaml#mutual_exclusion_sets/GEOTECH_REGIME_8Y_V1
  includes:
  - event_id: EV-TW-QUARANTINE
    phase_id: QUARANTINE
    role: defining
  - event_id: EV-TW-NORMALIZATION-OR-FROZEN
    phase_id: NORMALIZATION_OR_FROZEN
    role: terminal
  excludes:
  - event_id: EV-TW-FULL-BLOCKADE
    reason: Full effective blockade is classified as TAIWAN_SEIZURE under the current conservative owner mapping.
  - event_id: EV-TW-ARMED-CONFLICT
    reason: Any verified kinetic conflict exits the non-kinetic quarantine member and requires TAIWAN_SEIZURE classification/review.
  - event_id: EV-CN-PARITY-LEADING-EDGE
    reason: Prior leading-edge parity is not modeled jointly with quarantine in the current mutually exclusive set.
  base_when:
    narrative: BASE remains when patrols, exercises or limited restrictions do not reach the persistent inspection/partial-blockade threshold.
    conditions:
    - event_id: EV-TW-RESTRICTIONS
      condition: event may be confirmed while quarantine criteria remain unconfirmed
      verification_required: true
    - event_id: EV-CN-RACE-BASELINE
      condition: event may be confirmed and remains BASE-compatible
      verification_required: true
  narrative: Shared restrictions precursor -> persistent gray-zone inspections/partial blockade without combat -> partial normalization or
    frozen gray-zone new normal.
state_ref: portfolio/_scenarios/state.json
strategy_ref: null
phases:
- phase_id: RESTRICTIONS
  name: Partial shipping/airspace restrictions
  effective_from:
    kind: fixed_quarter
    anchor: t0
    quarter: 0
    meta:
      provenance: model_assumption
      rationale: Scenario is conditioned on onset of material restrictions at t0.
  ramp_quarters: 1
  duration_quarters: until_next_phase
  decay_quarters: 0
  driver_overrides:
    TAIWAN_SUPPLY:
      mean_shift_sigma: -0.75
      volatility_multiplier: 1.25
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Material access friction without assuming full physical outage.
    CHINA_REVENUE:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.2
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Cross-strait/export friction weakens China-linked revenue.
    AI_COMPUTE_DEMAND:
      mean_shift_sigma: -0.25
      volatility_multiplier: 1.15
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Near-term deployment caution offsets some substitution demand.
    HBM_MEMORY:
      mean_shift_sigma: -0.25
      volatility_multiplier: 1.25
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Packaging/memory logistics tighten.
    ADVANCED_PACKAGING:
      mean_shift_sigma: -0.25
      volatility_multiplier: 1.25
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Advanced packaging access becomes less reliable.
    SEMICONDUCTOR_WFE:
      mean_shift_sigma: -0.25
      volatility_multiplier: 1.2
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Near-term fab/equipment activity pauses before reconstruction response.
    CAPITAL_MARKETS:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.3
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Risk-off financing shock.
    GOVERNMENT_DEFENSE:
      mean_shift_sigma: 0.25
      volatility_multiplier: 1.15
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Defense demand rises modestly.
  root_correlation_overrides:
  - root_a: SEMI_SUPPLY_HEALTH
    root_b: CHINA_MARKET_ACCESS
    correlation: 0.35
    meta:
      provenance: model_assumption
      rationale: Cross-strait supply and China access become more coupled.
  - root_a: AI_CAPEX_CYCLE
    root_b: SEMI_SUPPLY_HEALTH
    correlation: 0.4
    meta:
      provenance: model_assumption
      rationale: AI capex becomes more dependent on semiconductor supply health.
  meta:
    provenance: model_assumption
    rationale: 'Shared entry state with TAIWAN_SEIZURE for comparability: material restrictions/friction are present at t0, but this scenario
      is conditioned on escalation to gray-zone quarantine rather than armed conflict.'
  entry_criteria:
  - event_id: EV-TW-RESTRICTIONS
    condition: verification_status == verified
    verification_required: true
  exit_criteria:
  - event_id: EV-TW-QUARANTINE
    condition: verification_status == verified
    verification_required: true
  strategy_ref: null
- phase_id: QUARANTINE
  name: Gray-zone coast-guard quarantine / partial route and port restriction
  effective_from:
    kind: triangular_quarter
    anchor: t0
    min: 1
    mode: 2
    max: 4
    meta:
      provenance: model_assumption
      rationale: Quarantine onset after the common restrictions phase is uncertain; q1/q2/q4 represents a one-to-four-quarter escalation
        window without armed conflict.
  ramp_quarters: 1
  duration_quarters: until_next_phase
  decay_quarters: 0
  driver_overrides:
    TAIWAN_SUPPLY:
      mean_shift_sigma: -1.25
      volatility_multiplier: 1.45
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Sustained inspections, routing frictions and partial port restrictions impair Taiwan-linked supply, but less than a full
          blockade/conflict.
    CHINA_REVENUE:
      mean_shift_sigma: -0.75
      volatility_multiplier: 1.35
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Export-control escalation and cross-strait commercial friction reduce China-linked addressability without assuming full
          sanctions separation.
    AI_COMPUTE_DEMAND:
      mean_shift_sigma: -0.4
      volatility_multiplier: 1.25
      persistence_override: 0.75
      meta:
        provenance: model_assumption
        rationale: Deployment caution and delayed hardware availability temporarily outweigh replacement demand; shock is milder than blockade/conflict.
    HBM_MEMORY:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.35
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Shipping and insurance friction delays HBM delivery without assuming physical production loss.
    ADVANCED_PACKAGING:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.35
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Packaging logistics and Taiwan concentration create persistent delay/cost friction, milder than armed-conflict disruption.
    SEMICONDUCTOR_WFE:
      mean_shift_sigma: -0.35
      volatility_multiplier: 1.25
      persistence_override: 0.75
      meta:
        provenance: model_assumption
        rationale: Near-term installation/shipment uncertainty and Taiwan project delays dominate before localization response.
    CAPITAL_MARKETS:
      mean_shift_sigma: -0.75
      volatility_multiplier: 1.45
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Persistent geopolitical risk premium, Taiwan capital outflow and shipping-risk repricing create material risk-off conditions.
    GOVERNMENT_DEFENSE:
      mean_shift_sigma: 0.5
      volatility_multiplier: 1.2
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Deterrence, munitions replenishment and regional readiness spending rise, but without war-economy intensity.
  root_correlation_overrides:
  - root_a: SEMI_SUPPLY_HEALTH
    root_b: CHINA_MARKET_ACCESS
    correlation: 0.45
    meta:
      provenance: model_assumption
      rationale: Quarantine couples Taiwan supply friction with China market/export access more strongly than BASE, but below conflict calibration.
  - root_a: AI_CAPEX_CYCLE
    root_b: SEMI_SUPPLY_HEALTH
    correlation: 0.45
    meta:
      provenance: model_assumption
      rationale: AI buildout becomes more dependent on semiconductor logistics and supply health.
  - root_a: AI_CAPEX_CYCLE
    root_b: FINANCIAL_CONDITIONS
    correlation: 0.3
    meta:
      provenance: model_assumption
      rationale: Risk premia and compute deployment become more coupled under persistent gray-zone pressure.
  meta:
    provenance: model_assumption
    rationale: 'Gray-zone quarantine is explicitly non-kinetic: coast-guard/law-enforcement pressure, inspections and partial route/port
      restrictions without armed hostilities.'
  entry_criteria:
  - event_id: EV-TW-QUARANTINE
    condition: verification_status == verified
    verification_required: true
  exit_criteria:
  - event_id: EV-TW-NORMALIZATION-OR-FROZEN
    condition: verification_status == verified
    verification_required: true
  strategy_ref: null
- phase_id: NORMALIZATION_OR_FROZEN
  name: Partial normalization or persistent gray-zone new normal
  effective_from:
    kind: triangular_quarter
    anchor: phase:QUARANTINE
    min: 4
    mode: 8
    max: 12
    meta:
      provenance: model_assumption
      rationale: Acute quarantine pressure is assumed to begin easing or freezing into a lower-intensity regime four to twelve quarters after
        quarantine onset; this is uncertainty, not a forecast.
  ramp_quarters: 4
  duration_quarters: until_end
  decay_quarters: 0
  driver_overrides:
    TAIWAN_SUPPLY:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.2
      persistence_override: 0.75
      meta:
        provenance: model_assumption
        rationale: Most traffic normalizes, but insurance, rerouting and contingency inventory keep Taiwan-linked supply below BASE.
    CHINA_REVENUE:
      mean_shift_sigma: -0.4
      volatility_multiplier: 1.2
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Export-control and market-access friction remains part of the post-quarantine new normal.
    AI_COMPUTE_DEMAND:
      mean_shift_sigma: 0.0
      volatility_multiplier: 1.1
      persistence_override: 0.65
      meta:
        provenance: model_assumption
        rationale: Acute deployment drag fades; no separate structural demand boom is assumed absent conflict/reconstruction.
    HBM_MEMORY:
      mean_shift_sigma: -0.15
      volatility_multiplier: 1.15
      persistence_override: 0.7
      meta:
        provenance: model_assumption
        rationale: HBM logistics mostly recover but retain a modest risk premium and inventory friction.
    ADVANCED_PACKAGING:
      mean_shift_sigma: -0.15
      volatility_multiplier: 1.15
      persistence_override: 0.7
      meta:
        provenance: model_assumption
        rationale: Packaging access mostly normalizes but contingency logistics remain costlier than BASE.
    SEMICONDUCTOR_WFE:
      mean_shift_sigma: 0.25
      volatility_multiplier: 1.2
      persistence_override: 0.75
      meta:
        provenance: model_assumption
        rationale: After acute delays, diversification and contingency capacity support a modest WFE/localization response.
    CAPITAL_MARKETS:
      mean_shift_sigma: -0.2
      volatility_multiplier: 1.15
      persistence_override: 0.65
      meta:
        provenance: model_assumption
        rationale: Acute risk-off fades, but Taiwan/geopolitical risk premium remains above BASE.
    GOVERNMENT_DEFENSE:
      mean_shift_sigma: 0.35
      volatility_multiplier: 1.15
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Deterrence and readiness spending remain structurally elevated after the acute quarantine phase.
  root_correlation_overrides:
  - root_a: SEMI_SUPPLY_HEALTH
    root_b: CHINA_MARKET_ACCESS
    correlation: 0.3
    meta:
      provenance: model_assumption
      rationale: Supply and market-access risks remain somewhat coupled in the frozen gray-zone regime.
  - root_a: AI_CAPEX_CYCLE
    root_b: SEMI_SUPPLY_HEALTH
    correlation: 0.4
    meta:
      provenance: model_assumption
      rationale: Compute buildout remains more supply-sensitive than BASE after firms adopt contingency sourcing.
  - root_a: AI_CAPEX_CYCLE
    root_b: FINANCIAL_CONDITIONS
    correlation: 0.25
    meta:
      provenance: model_assumption
      rationale: Residual risk premium keeps funding and AI deployment slightly more coupled than BASE.
  meta:
    provenance: model_assumption
    rationale: This is a single target state spanning partial normalization through a persistent frozen gray zone; Scenario Engine v1.0 has
      no internal branch probabilities. Escalation to armed seizure belongs to the mutually exclusive TAIWAN_SEIZURE scenario.
  entry_criteria:
  - event_id: EV-TW-NORMALIZATION-OR-FROZEN
    condition: verification_status == verified
    verification_required: true
  exit_criteria:
  - system_condition: scenario_horizon_reached
    condition: scenario horizon reached; gray-zone state remains until end of modeled horizon
    verification_required: false
  strategy_ref: null
fact_catalog:
- fact_id: TQ-F01
  signal: Number/location of PRC China Coast Guard or other official vessels around Taiwan, especially east of the island, and any transition
    from patrol to inspection/boarding of commercial traffic.
  phase_relevance:
  - RESTRICTIONS
  - QUARANTINE
  verification_status: pending_dozor
  preferred_sources:
  - Taiwan Coast Guard Administration (CGA)
  - Taiwan Ministry of National Defense daily PLA/official-ship activity
  - PRC China Coast Guard / Maritime Safety Administration notices
  fallback_sources:
  - Reuters
  - CSIS/AMTI
  note: Patrol count alone is not quarantine. Phase evidence requires inspection/boarding, compulsory routing, port/route restriction or
    equivalent coercive law-enforcement action.
  event_id: EV-TW-QUARANTINE
- fact_id: TQ-F02
  signal: Mobilization, requisition or concentrated exercise use of civilian roll-on/roll-off ferries or other dual-use sealift near the
    Taiwan theater.
  phase_relevance:
  - RESTRICTIONS
  - QUARANTINE
  verification_status: pending_dozor
  preferred_sources:
  - Taiwan MND
  - PRC transport/maritime authorities where explicit
  - official exercise notices
  fallback_sources:
  - Reuters
  - CSIS/ChinaPower
  - USNI News
  note: Track vessel count, dates and operating area; exercise appearance is a signal, not proof of an imminent kinetic operation.
  event_id: EV-TW-RESTRICTIONS
- fact_id: TQ-F03
  signal: 'Status of the delayed U.S. Taiwan arms package reported at about USD 14B after the U.S.–China summit: approval, notification,
    modification, cancellation or continued hold.'
  phase_relevance:
  - RESTRICTIONS
  - QUARANTINE
  - NORMALIZATION_OR_FROZEN
  verification_status: pending_dozor
  preferred_sources:
  - U.S. DSCA
  - U.S. Department of State / Congress notifications
  - Taiwan MND
  fallback_sources:
  - Reuters
  note: Current baseline reported by Reuters in September 2026 is that a roughly USD 14B package remained delayed; Dozor should verify only
    official disposition changes.
  event_id: EV-TW-RESTRICTIONS
- fact_id: TQ-F04
  signal: Explicit production/output cadence, contracted quantities or delivery acceleration for Patriot interceptors and LRASM / related
    anti-ship missiles relevant to Taiwan/regional deterrence.
  phase_relevance:
  - RESTRICTIONS
  - QUARANTINE
  - NORMALIZATION_OR_FROZEN
  verification_status: pending_dozor
  preferred_sources:
  - U.S. Department of Defense / service budget and contract notices
  - DSCA
  - RTX/Raytheon filings and releases
  - Lockheed Martin filings and releases
  fallback_sources:
  - Reuters
  note: Use only explicitly disclosed quantities/cadence. If a production rate is not disclosed, record not_disclosed rather than estimating.
  event_id: EV-TW-RESTRICTIONS
- fact_id: TQ-F05
  signal: War-risk / additional-premium insurance rates, exclusions or availability changes for commercial shipping serving Taiwan or transiting
    the Taiwan Strait.
  phase_relevance:
  - QUARANTINE
  - NORMALIZATION_OR_FROZEN
  verification_status: pending_dozor
  preferred_sources:
  - Lloyd's/JCC notices
  - major marine insurers/reinsurers
  - Aon/Marsh/Gallagher broker bulletins
  fallback_sources:
  - Reuters
  note: Track quoted premium change with vessel class/route/date where available; generic geopolitical commentary is insufficient.
  event_id: EV-TW-QUARANTINE
- fact_id: TQ-F06
  signal: TSMC or key Taiwan semiconductor suppliers disclose shipment delays, customer-delivery disruption, logistics rerouting, inventory
    build or production interruption attributable to cross-strait restrictions.
  phase_relevance:
  - QUARANTINE
  - NORMALIZATION_OR_FROZEN
  verification_status: pending_dozor
  preferred_sources:
  - TSMC filings/IR
  - supplier/customer filings
  - Taiwan MOEA / port authorities
  fallback_sources:
  - Reuters
  note: Differentiate logistics delay from fab-production outage; the latter would imply calibration toward TAIWAN_SEIZURE severity.
  event_id: EV-TW-QUARANTINE
- fact_id: TQ-F07
  signal: Daily PLA aircraft, PLAN ships and PRC official-ship counts around Taiwan, including eastern ADIZ / median-line activity and persistent
    coast-guard presence.
  phase_relevance:
  - RESTRICTIONS
  - QUARANTINE
  verification_status: pending_dozor
  preferred_sources:
  - Taiwan Ministry of National Defense daily PLA activities
  - Taiwan Coast Guard Administration
  fallback_sources:
  - Reuters
  - CSIS/ChinaPower
  note: ADIZ or ship activity is a pressure indicator only; it does not by itself satisfy the quarantine phase.
  event_id: EV-TW-RESTRICTIONS
- fact_id: TQ-F08
  signal: Port throughput, vessel waiting times, cancellations or compulsory rerouting at Taiwan's principal commercial ports/routes.
  phase_relevance:
  - QUARANTINE
  - NORMALIZATION_OR_FROZEN
  verification_status: pending_dozor
  preferred_sources:
  - Taiwan Ministry of Transportation and Communications
  - Taiwan International Ports Corporation
  - port/aviation authority notices
  fallback_sources:
  - Reuters
  - major shipping-line notices
  note: Preferred machine-checkable metrics are vessel calls, throughput, waiting time and formally closed/restricted routes.
  event_id: EV-TW-QUARANTINE
links:
  common_causes:
  - TAIWAN_SUPPLY_DISRUPTION
  - EXPORT_CONTROLS_CHINA
  legacy_action_scenario_refs:
  - portfolio/_scenarios/taiwan.yaml#TAIWAN-S1
  - portfolio/_scenarios/taiwan.yaml#TAIWAN-S2
notes:
- 'TAIWAN_QUARANTINE is mutually exclusive with TAIWAN_SEIZURE: this calibration never escalates into armed conflict.'
- NORMALIZATION_OR_FROZEN is a single conditional target state because Scenario Engine v1.0 has no branching; it is not a probability-weighted
  internal mixture.
- BASE contains the observed 2026 strategic technology/defense race through company-state centers and zero-centered Joint shocks around the
  current regime; scenario overrides are deviations from that regime.
- CHIP_COLD_WAR/RACE_TO_PARITY should be read as acceleration of the existing race toward parity, not as the initial existence of the race.
- Scenario does not prescribe portfolio action.
