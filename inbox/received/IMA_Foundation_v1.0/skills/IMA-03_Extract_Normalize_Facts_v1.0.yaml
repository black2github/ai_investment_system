skill: {id: IMA-03, name: Extract_Normalize_Facts, version: "1.0.0", status: proposed_normative}
purpose: "Convert evidence into typed verified/derived/pending facts with exact periods, units and formulas."
inputs: {required: [EvidencePack, NormativeContextPackage]}
preconditions: [evidence_pack_exists]
outputs: {required: [NormalizedFactSet]}
postconditions:
  - verified_fact_has_evidence_ref
  - derived_fact_has_formula
  - guidance_distinguished_from_actual
  - numeric_current_value_is_numeric_or_null
  - source_period_semantics_preserved
  - unavailable_values_are_null_not_estimated
failure_statuses: [fact_unverified, source_conflict, schema_failure, failed]
runtime:
  private_chain_of_thought_required: false
  design_decision_record_required_for_material_choice: false
  structured_output_required: true
