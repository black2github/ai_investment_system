      formula: FY2026 revenue 1.001278B + H1 FY2027 568.638M - H1 FY2026 471.212M = 1.098704B USD TTM.
    base_period.current_fcf_margin:
      provenance: model_assumption
      formula: 'Normalized current FCF margin = 4.0% model assumption: FY2026 FCF margin about 5% and H1 FY2027 YTD FCF margin
        17.5M / 568.638M = 3.08%; Q2 standalone FCF was -13.2M. The 4.0% center preserves transition risk and is not price-fitted.'
      rationale: Normalization is explicitly separated from reported quarter cash flow and is not fitted to price.
    discount_rate:
      provenance: model_assumption
      rationale: Recurring software economics offset by smaller scale, current GAAP losses and unsettled cash conversion;
        therefore a higher base rate than mature large-cap software.
    terminal_fcf_margin:
      provenance: model_assumption
      rationale: Terminal margin requires substantial conversion from GAAP loss to durable cash profitability; range remains
        wide and lower tail can revisit negative FCF.
    terminal_fcf_multiple:
      provenance: model_assumption
      rationale: Recurring cybersecurity platform can support a software FCF multiple if cash conversion matures, but current
        GAAP losses, competitive intensity and execution risk require a wide downside range.
    margin_transition:
      provenance: model_assumption
      rationale: Explicit convergence from current/normalized FCF margin to the independently selected terminal cash-margin
        center; not price-fitted.
    balance_sheet.cash:
      provenance: derived_fact
      formula: 200.951M cash + 454.297M short-term investments + 157.998M long-term investments = 813.246M USD.
      source_ref: 2026-07-31 | https://www.sec.gov/Archives/edgar/data/1583708/000158370826000055/s-20260731.htm
    balance_sheet.net_debt:
      provenance: derived_fact
      formula: 0 financial debt - 813.246M cash/investments = -813.246M USD.
