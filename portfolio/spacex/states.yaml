# Вектор состояний SpaceX (оси и состояния). Условия переходов — в triggers.yaml. Текущий вектор — state.json.
# MIG-SPCX: поля старого формата перенесены дословно в _legacy/states_legacy_notes.yaml (migrate_artifacts_v1_0_1 1.1.0)
schema_version: '1.0.5'
semantics:
  evidence_required: true
  pending_verification_blocks_transition: true
  trigger_not_decision: true
  numeric_thresholds_provenance: model_assumption
version: '1.1'
artifact: SPCX State Vector
as_of: '2026-09-20'
ticker: SPCX
source_artifact: from_imma/SPCX_states_v1.0.yaml (другая LLM, 20.09.2026)
purpose: 'Оси и состояния компании. Условия переходов НЕ здесь: нормативный дом — triggers.yaml (SPCX-E-10..E-33,
  поле transition). Текущий вектор ведётся в state.json → scenario_state; здесь — снимок на дату.'
sources:
  SPCX_EARNINGS_RELEASE:
    source_class: issuer_ir_release
    url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm
    as_of: '2026-09-20'
  SPCX_YAHOO_QUOTE:
    source_class: market_data_provider
    url: https://finance.yahoo.com/quote/SPCX/
    as_of: '2026-09-20'
  SPCX_STOCKANALYSIS:
    source_class: market_data_provider
    url: https://stockanalysis.com/stocks/spcx/market-cap/
    as_of: '2026-09-20'
axes:
  AI:
    name: AI compute
    name_ru: AI compute
    states:
      A0:
        name: AI optionality
        criteria: AI-направление существует, но коммерческий спрос и масштаб еще не подтверждены.
      A1:
        name: AI demand validation
        criteria: Есть подтвержденный спрос/контракты и растущая AI-выручка, но экономика еще не доказана.
      A2:
        name: AI monetization
        criteria: AI-инфраструктура генерирует существенную выручку и достигнута положительная скорректированная
          EBITDA.
      A3:
        name: AI scale acceleration
        criteria: Масштаб вычислений и AI-выручки одновременно ускоряются при подтвержденной экономике.
      A4:
        name: AI overbuild / deterioration
        criteria: Рост AI-бизнеса существенно замедляется или экономика ухудшается на фоне высокой капиталоемкости.
    current: A2
    current_evidence:
    - 'AI revenue Q2 2026 = $2.561B, +247% YoY.'
    - 'AI adjusted EBITDA Q2 2026 = +$1.146B.'
    - 'AI operating loss Q2 2026 = -$1.257B.'
    - 'Nameplate compute = 1.4 GW.'
    - 'Cloud Service Agreements = $14.1B contracted sales.'
    source_refs:
    - SPCX_EARNINGS_RELEASE
  Starlink:
    name: Starlink
    name_ru: Starlink
    states:
      B0:
        name: Early growth
        criteria: Раннее масштабирование абонентской базы.
      B1:
        name: Subscriber acceleration
        criteria: Быстрый рост числа абонентов.
      B2:
        name: Scale economics
        criteria: Большая база абонентов сочетается с устойчивой операционной рентабельностью Connectivity.
      B3:
        name: Mature growth
        criteria: Рост продолжается, но темп прироста абонентов заметно снижается.
      B4:
        name: Saturation / ARPU pressure
        criteria: Замедление роста сопровождается существенным снижением ARPU и/или ухудшением рентабельности.
    current: B2
    current_evidence:
    - 'Starlink subscribers = 12.0M, +100% YoY.'
    - 'Connectivity revenue = $4.291B, +66% YoY.'
    - 'Connectivity operating income = $1.656B; operating margin ~38.6%.'
    - 'ARPU = $66/month vs $85 a year earlier.'
    source_refs:
    - SPCX_EARNINGS_RELEASE
  Starship:
    name: Starship
    name_ru: Starship
    states:
      C0:
        name: Development
        criteria: Разработка без подтвержденного flight-test milestone.
      C1:
        name: Successful suborbital validation
        criteria: Есть успешная суборбитальная миссия с выполнением существенных целей.
      C2:
        name: Orbital validation
        criteria: Успешная орбитальная миссия с выполнением заявленных mission objectives.
      C3:
        name: Reusability validation
        criteria: Подтверждена повторная эксплуатация летного железа с ограниченным интервалом.
      C4:
        name: High-frequency operations
        criteria: Система демонстрирует регулярную эксплуатацию с высокой частотой.
      C5:
        name: Cost-to-orbit disruption
        criteria: Подтверждено существенное снижение стоимости вывода относительно исторической базы.
    current: C1
    current_evidence:
    - 'Flight 12: successful suborbital mission.'
    - 'Flight 13: company reported all flight objectives achieved.'
    - 'FAA operational plan dated 2026-09-18 listed Starship Flight 14 primary 2026-09-22 and backup 2026-09-23.'
    source_refs: []
  Capital_Intensity:
    name: Capital intensity
    name_ru: капиталоёмкость
    states:
      D0:
        name: Capital discipline
        criteria: Capex контролируем относительно роста бизнеса.
      D1:
        name: Investment expansion
        criteria: Capex ускоряется вместе с ростом подтвержденного спроса.
      D2:
        name: Aggressive expansion
        criteria: Высокий capex необходим для быстрого масштабирования.
      D3:
        name: Extreme expansion
        criteria: Capex становится системообразующим фактором инвестиционной истории.
      D4:
        name: Overinvestment risk
        criteria: Capex остается очень высоким при ухудшении роста/экономики.
    current: D3
    current_evidence:
    - 'Total Q2 capex = $18.369B.'
    - 'AI Q2 capex = $15.828B.'
    - 'AI capex H1 2026 = $23.551B.'
    - 'AI revenue Q2 = $2.561B.'
    source_refs:
    - SPCX_EARNINGS_RELEASE
  Valuation:
    name: Valuation
    name_ru: valuation
    states:
      V0:
        name: Not assessed
        criteria: Reverse valuation не рассчитана.
      V1:
        name: Low implied expectations
        criteria: Текущая цена требует умеренных будущих операционных показателей.
      V2:
        name: Reasonable implied expectations
        criteria: Цена совместима с центральным диапазоном операционной модели.
      V3:
        name: Demanding
        criteria: Цена требует высокой устойчивости роста/маржи.
      V4:
        name: Very demanding
        criteria: Цена требует исключительного сочетания роста, масштаба и длительности.
      V5:
        name: Speculative / thesis-dependent
        criteria: Цена преимущественно зависит от еще не подтвержденных будущих бизнес-моделей.
    current: V4
    current_evidence:
    - 'Close 2026-09-18 = $152.71.'
    - 'Market cap = ~$2.07T.'
    - 'TTM revenue = ~$23.04B.'
    - 'Price/Sales (ttm) = 70.49x; EV/Revenue = 84.74x (Yahoo Finance).'
    - 'Reverse valuation has not yet been approved as a calculation-engine version.'
    source_refs:
    - SPCX_YAHOO_QUOTE
    - SPCX_STOCKANALYSIS
    note: V4 — предварительное состояние по мультипликатору (KPI-10), не результат reverse valuation.
