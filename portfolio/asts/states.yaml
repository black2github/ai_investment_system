# Вектор состояний ASTS (оси и состояния). Переходы — triggers.yaml, текущий вектор — state.json.
schema_version: '1.0.3'
version: '1.1'
artifact: ASTS State Vector
as_of: '2026-09-21'
ticker: ASTS
source_artifact: inbox/received/ASTS_company_state_v1.0.yaml (другая LLM, 2026-09-21, share https://chatgpt.com/share/6ab0d288-5728-83eb-a10c-88faa5926595)
purpose: Оси и состояния компании. Условия переходов — в triggers.yaml (поле transition). Текущий вектор — state.json → scenario_state.
semantics:
  evidence_required: true
  primary_only: true
  numeric_thresholds_provenance: model_assumption
  pending_verification_blocks_transition: true
  trigger_not_decision: true
sources:
  ASTS_Q2_2026_10Q:
    source_class: regulatory_filing
    as_of: '2026-09-21'
    url: https://www.sec.gov/Archives/edgar/data/1780312/000119312526342550/asts-20260630.htm
    type: SEC 10-Q
  ASTS_Q2_2026_RELEASE:
    source_class: issuer_ir_release
    as_of: '2026-08-10'
    url: https://www.sec.gov/Archives/edgar/data/1780312/000119312526342540/asts-ex99_1.htm
    type: SEC earnings-release exhibit
axes:
  Constellation_Deployment:
    name: Constellation Deployment
    name_ru: развёртывание группировки (спутники на орбите, каденция запусков)
    states:
      D0:
        name: prototype
        criteria: in-orbit BlueBird spacecraft <5
      D1:
        name: initial_network
        criteria: in-orbit spacecraft >=5 and <10
      D2:
        name: deployment_acceleration
        criteria: in-orbit spacecraft >=10 and <25 AND >=3 spacecraft launched in trailing 90 days
      D3:
        name: partial_commercial_constellation
        criteria: in-orbit spacecraft >=25 and <50
      D4:
        name: scaled_constellation
        criteria: in-orbit spacecraft >=50 AND initial continuous service coverage disclosed in at least one major market
    current: D2
    current_evidence:
    - After BlueBird 8-13 launches, AST reported 13 in-orbit spacecraft.
    - Six spacecraft were launched within 50 days.
    - BlueBird 17-46 were in various stages of production/assembly.
    source_refs:
    - ASTS_Q2_2026_RELEASE
    - ASTS_Q2_2026_10Q
  Commercial_Contracting:
    name: Commercial Contracting
    name_ru: коммерческие контракты с операторами
    states:
      C0:
        name: pilot_partnerships
        criteria: contracted commercial/government backlog < $0.25B
      C1:
        name: initial_contracts
        criteria: backlog >=$0.25B and < $0.75B
      C2:
        name: validated_contracting
        criteria: backlog >=$0.75B and < $1.25B AND >=3 definitive MNO commercial agreements
      C3:
        name: scaled_contracting
        criteria: backlog >=$1.25B AND >=4 definitive major-market MNO agreements
      C4:
        name: broad_contracted_network
        criteria: backlog >=$2B AND definitive commercial agreements cover >=2B potential MNO subscribers
    current: C3
    current_evidence:
    - Revenue backlog approximately $1.30B.
    - Definitive agreements include AT&T, Verizon, Vodafone/SatCo and STC.
    - Partnerships with >60 MNOs covering >3B subscribers globally.
    source_refs:
    - ASTS_Q2_2026_RELEASE
    - ASTS_Q2_2026_10Q
  Service_Monetization:
    name: Service Monetization
    name_ru: монетизация сервиса SpaceMobile (выручка от услуг)
    states:
      M0:
        name: pre_revenue
        criteria: total company revenue = 0
      M1:
        name: pre_service_revenue
        criteria: company revenue >0 but SpaceMobile Service revenue = 0
      M2:
        name: initial_service_revenue
        criteria: SpaceMobile Service revenue >0 and < $25M/quarter
      M3:
        name: scaled_service
        criteria: SpaceMobile Service revenue >=$25M and < $100M/quarter
      M4:
        name: commercial_scale
        criteria: SpaceMobile Service revenue >=$100M/quarter for 2 consecutive quarters
    current: M1
    current_evidence:
    - Q2 revenue $31.5M from gateway deliveries and U.S. government milestones.
    - 10-Q explicitly states SpaceMobile Service has not launched and has generated no revenue to date.
    source_refs:
    - ASTS_Q2_2026_RELEASE
    - ASTS_Q2_2026_10Q
  Regulatory_Spectrum:
    name: Regulatory Spectrum
    name_ru: регуляторные разрешения и спектр (FCC)
    states:
      R0:
        name: experimental_only
        criteria: no authorization for planned commercial constellation
      R1:
        name: partial_US
        criteria: some U.S. operational/spectrum approvals but no full planned-network authorization
      R2:
        name: US_network_authorized
        criteria: FCC authorization for planned satellite network and commercial-service spectrum framework
      R3:
        name: multi_market_authorized
        criteria: commercial operating approvals in U.S. plus at least 3 additional major markets
      R4:
        name: broad_global_authorization
        criteria: commercial authorization covers markets representing >=1B partner subscribers
    current: R2
    current_evidence:
    - FCC authorization received to deploy the planned 248-satellite network, including low-band IMT frequencies and Q/V feeder
      links.
    - Company received certain regulatory approvals for SpaceMobile Service in April 2026.
    source_refs:
    - ASTS_Q2_2026_10Q
    evidence_type: qualitative_primary_source
    verification_rule: 'Machine confirmation is allowed through ASTS-KPI-11 binary authorization status; narrative remains
      source evidence, not a numeric count of globally authorized markets.

      '
  Funding_Dilution:
    name: Funding Dilution
    name_ru: финансирование и размытие капитала
    states:
      F0:
        name: stressed
        criteria: available cash <0.5x annualized H1 operating + PP&E cash use
      F1:
        name: tight
        criteria: ratio >=0.5x and <1.0x
      F2:
        name: funded_expansion
        criteria: ratio >=1.0x and <2.0x AND latest financing effective dilution <=5%
      F3:
        name: ample
        criteria: ratio >=2.0x AND effective dilution <=5%
      F4:
        name: self_funding
        criteria: operating cash flow >=0 for 2 consecutive quarters and ratio >=2x
    current: F2
    current_evidence:
    - Pro forma cash/cash equivalents/restricted cash after July financing >$3.7B.
    - H1 OCF use $145.2M and PP&E purchases $859.2M; annualized combined use ~2.009B.
    - July 2026 convertible offering $1.15B gross; company reports effective dilution <2%.
    source_refs:
    - ASTS_Q2_2026_RELEASE
    - ASTS_Q2_2026_10Q
changelog:
- date: '2026-09-21'
  change: 'Regulatory_Spectrum: evidence_type qualitative_primary_source + verification_rule через ASTS-KPI-11 (patch v1.1)'
