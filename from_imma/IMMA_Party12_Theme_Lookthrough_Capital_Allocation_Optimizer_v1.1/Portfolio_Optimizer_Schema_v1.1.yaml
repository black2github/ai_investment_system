version: '1.1'
artifact: portfolio_optimizer
as_of: '2026-10-03'
status: proposed_normative
objective:
  type: lexicographic_constrained
  primary: maximize_median_portfolio_CAGR_5Y
  objective_tolerance_pp: 0.5
  objective_tolerance_provenance: model_assumption
  secondary:
  - maximize_ES5_5Y
  - minimize_scenario_concentration
  - minimize_turnover
constraints:
  status: pending_owner_approval
  provenance: model_assumption
  concentration:
    single_name_max: 0.2
    sector_max: 0.3
    top3_aggregate_max: 0.5
    common_cause_effective_max: 0.35
    unmodeled_target_weight: 0.0
  roles:
    Core_max_per_name: 0.2
    Challenger_max_per_name: 0.08
    Challenger_aggregate_max: 0.25
    Watch_target_weight: 0.0
  dry_powder:
    Normal:
      min: 0.05
      preferred_max: 0.1
      hard_max: 0.15
    Stress:
      min: 0.05
      preferred_max: 0.15
      hard_max: 0.2
    Shock:
      min: 0.1
      preferred_max: 0.2
      hard_max: 0.3
  illiquidity:
    aggregate_max: 0.1
    single_name_max: 0.05
  risk_5y:
    p_loss_gt_30_max: 0.2
    p_loss_gt_50_max: 0.1
    es5_min: -0.55
    scenario_concentration_warning: 0.6
    scenario_concentration_max: 0.7
    scenario_concentration_provenance: owner_judgment
    scenario_concentration_source_ref: DR-2026-10-02-01/В2
  cardinality:
    positions_min:
      value: 6
      provenance: owner_judgment
      source_ref: owner decision 2026-10-03
    positions_max:
      value: 8
      provenance: owner_judgment
      source_ref: owner decision 2026-10-03
    min_position_weight:
      value: 0.03
      provenance: owner_judgment
      source_ref: owner decision 2026-10-03
    count_rule: count target equity positions with w_i>0; exclude cash and owner-excluded fixed ETFs GLD/UFO
    fixed_exclusions:
    - GLD
    - UFO
    - CASH
common_cause:
  severity_factor:
    critical: 1.0
    high: 0.75
    medium: 0.5
    low: 0.25
  formula: sum(target_weight_i * severity_factor_i for material exposure to cause)
mpc_allowed_range:
  min_weight: 0.0
  max_weight: 0.2
  grid_step: 0.01
  include_current_weight: true
  local_refinement_step: 0.005
  include_constraint_boundaries: true
  prior_weight_as_anchor: false
portfolio_engine:
  use_joint_paths: true
  standalone_medians_as_optimizer_input: false
  formula: PortfolioValue_h = sum(w_i * RelativeValue_i,h) + DryPowderValue_h + HedgeValue_h
execution:
  stages:
  - continuous_target
  - discrete_account_projection
  accounts: 2
  consolidated_optimization_first: true
  discrete_projection_objective:
  - minimize_tracking_error
  - minimize_transaction_cost
  - minimize_account_constraint_penalty
  required_instrument_fields:
  - account_eligibility
  - currency
  - lot_size
  - fractional_shares
  - option_contract_size
  - transaction_cost
  options:
    standard_contract_shares: 100
    force_underlying_to_100_share_multiple: false
    hedgeable_shares_formula: floor(position_shares / 100) * 100
inputs:
  required:
  - portfolio_state
  - joint_MC_paths
  - MPC_outputs
  - scenario_probabilities
  - correlation_structure
  - driver_exposures
  - failure_modes
  - implementation_constraints
  forbidden:
  - initial_portfolio_hypothesis_as_model_input
outputs:
- proposed_weights
- feasible_weight_bands
- dry_powder_weight
- portfolio_return_distribution
- portfolio_downside
- sector_concentration
- driver_concentration
- common_cause_concentration
- binding_constraints
- constraint_gaps_vs_current
- execution_projection_by_account
- ex_post_initial_hypothesis_comparison
- stability_test_ref
- decision_none
- contract_version
- positions_count
- cardinality_variant
- min_position_weight
- theme_lookthrough
- theme_constraint_status
- scenario_conditional_gates
- gated_at_optimum
- scenario_concentration_warning
- scenario_concentration_hard_status
- constraint_price_vs_no_cardinality_limit
- minimum_relaxations
infeasible_rule:
  auto_relax_constraints: false
  output_minimum_relaxations: true
host_engine_target: portfolio_optimizer 1.2.0
scenario_conditional:
  contract_version: '1.1'
  probability_min:
    value: 0.1
    provenance: owner_judgment
    source_ref: DR-2026-09-27-01
  eligible_scenario_rule: non-BASE AND probability_status=owner_judgment AND p_s>=0.10 AND B_s(w)>0
  base_paths_unavailable_fallback: gate all non-BASE scenarios with p_s>=0.10 and flag conservative_eligibility_fallback
  es5_5y_min:
    value: -0.4
    provenance: owner_judgment
    source_ref: DR-2026-09-27-01
  p_loss_gt_30_5y_max:
    value: 0.25
    provenance: owner_judgment
    source_ref: DR-2026-09-27-01
  path_rule: common path_id; scenario-specific conditional picture with probability=1; owner mixture unchanged
  silent_relaxation_forbidden: true
scenario_concentration_v1_1:
  formula_ref: Scenario_Engine_Specification_v1.1.md#7
  warning:
    value: 0.6
    provenance: owner_judgment
    source_ref: DR-2026-10-02-01/В2
  hard_max:
    value: 0.7
    provenance: owner_judgment
    source_ref: DR-2026-10-02-01/В2
  hard_applicability: at least 2 non-BASE scenarios have B_s(w)>0
  burdens: all non-BASE scenarios with known owner probabilities, including p_s below probability_min
  tie_break: after ES5 among otherwise-equivalent feasible portfolios
theme_policy_interface:
  policy_ref: Theme_Portfolio_Policy_v1.0.yaml
  constraint_class: owner_structural_constraint
  binding_basis: revenue
  enforce_when: baseline.status=MATERIALIZED AND ThemeExposure coverage complete for counted equities
  formula: sum_i(w_i*AI_TOTAL_revenue_share_i) <= baseline_value + tolerance
cardinality_variants:
- id: CARDINALITY_6
  positions_min: 6
  positions_max: 6
  min_position_weight: 0.03
- id: CARDINALITY_8
  positions_min: 6
  positions_max: 8
  min_position_weight: 0.03
- id: NO_CARDINALITY_LIMIT
  positions_min: null
  positions_max: null
  min_position_weight: 0.03
feasibility_order:
- portfolio_accounting_allowed_instruments_fixed_positions
- owner_structural_cardinality_min_weight_theme_single_name_sector_top3_common_cause_role_cash_liquidity_hedge
- BASE_risk_5y
- scenario_conditional_ES5_P30_for_eligible_scenarios
- ScenarioConcentration_hard_when_applicable
- lexicographic_objectives
