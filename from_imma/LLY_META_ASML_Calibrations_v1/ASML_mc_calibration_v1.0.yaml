schema_version: 1.0.2
artifact: company_mc_calibration
ticker: ASML
as_of: '2026-09-24'
archetype: mature_positive_margin
calculation_engine_version: company_mc 2.3.1
state_vector:
  Demand_Visibility: D3
  EUV_Adoption: E3
  Margin_Execution: M3
  China_Export_Exposure: X1
  Installed_Base_Resilience: I3
simulation:
  paths: 500000
  paths_meta:
    provenance: model_assumption
    rationale: Normative production path count.
  seed: 20260920
  seed_meta:
    provenance: model_assumption
    rationale: Fixed reproducibility seed.
  antithetic_variates: true
  store_summary_quantiles:
  - 0.01
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  - 0.99
  store_summary_quantiles_meta:
    provenance: model_assumption
    rationale: Standard system summary grid.
  horizons_years:
  - 3
  - 5
  - 8
  horizons_years_meta:
    provenance: model_assumption
    rationale: Current Thesis / Primary Optimization / Persistence horizons.
revenue_model:
  segments:
    EUV_Systems:
      base_revenue_quarterly: 3948700000.0
      base_revenue_quarterly_meta:
        provenance: derived_fact
        formula: H1 2026 EXE 1.1889B + NXE 6.7085B = 7.8974B; divided by 2 for H1-average quarterly base.
        source_ref: 2026-07-15 | https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm
      initial_growth:
        distribution: triangular
        min: -0.05
        mode: 0.22
        max: 0.5
        provenance: model_assumption
        rationale: H1 EUV system sales grew ~34.6% YoY; center mean-reverts current AI/leading-edge acceleration while allowing semiconductor-cycle downside.
      long_run_growth_y8:
        distribution: triangular
        min: -0.03
        mode: 0.12
        max: 0.25
        provenance: model_assumption
        rationale: Long-run EUV intensity can outgrow semiconductor units but not current AI-cycle growth indefinitely.
      growth_half_life_years: 2.25
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: EUV capacity/customer-roadmap cycles persist across several years.
      latent_loading:
        growth: 0.72
      latent_loading_meta:
        provenance: model_assumption
        rationale: EUV is strongly exposed to AI/WFE/HBM/customer-capex factors with technology-execution idiosyncrasy.
    DUV_Systems:
      base_revenue_quarterly: 2292350000.0000005
      base_revenue_quarterly_meta:
        provenance: derived_fact
        formula: H1 2026 ArF immersion 3.3317B + ArF dry 0.3673B + KrF 0.7726B + I-line 0.1131B = 4.5847B; /2.
        source_ref: 2026-07-15 | https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm
      initial_growth:
        distribution: triangular
        min: -0.25
        mode: 0.05
        max: 0.3
        provenance: model_assumption
        rationale: H1 DUV system sales declined ~11% YoY; distribution allows memory/China/WFE cyclicality and advanced-packaging/reshoring upside.
      long_run_growth_y8:
        distribution: triangular
        min: -0.08
        mode: 0.04
        max: 0.15
        provenance: model_assumption
        rationale: Mature DUV remains important but structurally slower than EUV.
      growth_half_life_years: 1.75
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: DUV is more cyclical and mean-reverts faster.
      latent_loading:
        growth: 0.65
      latent_loading_meta:
        provenance: model_assumption
        rationale: WFE/memory/China factors dominate with meaningful product-mix noise.
    Metrology_Inspection:
      base_revenue_quarterly: 181050000.0
      base_revenue_quarterly_meta:
        provenance: derived_fact
        formula: H1 2026 Metrology & Inspection sales 0.3621B /2.
        source_ref: 2026-07-15 | https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm
      initial_growth:
        distribution: triangular
        min: -0.15
        mode: 0.1
        max: 0.32
        provenance: model_assumption
        rationale: H1 metrology/inspection sales grew ~12.8% YoY; small segment with advanced-packaging/complexity upside.
      long_run_growth_y8:
        distribution: triangular
        min: -0.03
        mode: 0.08
        max: 0.2
        provenance: model_assumption
        rationale: Complexity supports structural growth but the base remains small.
      growth_half_life_years: 2.0
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Advanced-node/packaging adoption persists across node transitions.
      latent_loading:
        growth: 0.55
      latent_loading_meta:
        provenance: model_assumption
        rationale: Lower common loading due small-base/project timing.
    InstalledBaseManagement:
      base_revenue_quarterly: 2624600000.0
      base_revenue_quarterly_meta:
        provenance: derived_fact
        formula: H1 2026 Installed Base Management/service and field option sales 5.2492B /2.
        source_ref: 2026-07-15 | https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm
      initial_growth:
        distribution: triangular
        min: 0.0
        mode: 0.15
        max: 0.32
        provenance: model_assumption
        rationale: H1 IBM sales grew 28.1% YoY; center mean-reverts but preserves installed-base/upgrade resilience.
      long_run_growth_y8:
        distribution: triangular
        min: 0.02
        mode: 0.08
        max: 0.18
        provenance: model_assumption
        rationale: Installed base and upgrade intensity support resilient recurring growth.
      growth_half_life_years: 2.5
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Installed-base growth decays slowly with fleet expansion.
      latent_loading:
        growth: 0.48
      latent_loading_meta:
        provenance: model_assumption
        rationale: Service/upgrade revenue is less cyclical than system shipments.
margin_model:
  method: mean_reverting_positive_margin
  current_margin: 0.30417168691346025
  current_margin_meta:
    provenance: derived_fact
    formula: H1 normalized economic FCF 5.5035B / 18.0934B sales = 30.42%, after removing -6.7791B working-capital/tax timing and subtracting PP&E + intangible capex.
  terminal_margin_Y5:
    distribution: triangular
    min: 0.2
    mode: 0.3
    max: 0.39
    provenance: model_assumption
    rationale: High-moat economics with large R&D/capacity needs; tails include semiconductor-cycle, mix, export-control and supply-chain effects.
  terminal_margin_Y8:
    distribution: triangular
    min: 0.18
    mode: 0.28
    max: 0.36
    provenance: model_assumption
    rationale: Long-run margin allows technology transition and export/customer concentration risk.
  half_life_years: 2.0
  half_life_years_meta:
    provenance: model_assumption
    rationale: Normalized cash economics remain mature but mix/capex swings mean-revert over several quarters.
  shock_sigma: 0.045
  shock_sigma_meta:
    provenance: model_assumption
    rationale: Quarterly mix, shipment timing, service and working-capital normalization uncertainty.
  shock_persistence: 0.4
  shock_persistence_meta:
    provenance: model_assumption
    rationale: Semiconductor cycles persist but service mix stabilizes cash economics.
  lower_bound: 0.1
  lower_bound_meta:
    provenance: model_assumption
    rationale: Severe WFE/export/supply downside.
  upper_bound: 0.45
  upper_bound_meta:
    provenance: model_assumption
    rationale: Prevents peak product mix from becoming permanent cash economics.
valuation:
  Y3:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 18.0
      mode: 28.0
      max: 38.0
      provenance: model_assumption
      rationale: High-moat leading-edge equipment valuation with explicit semiconductor-cycle tails.
  Y5:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 16.0
      mode: 24.0
      max: 32.0
      provenance: model_assumption
      rationale: Aligned with ASML RV terminal range; export/Taiwan/customer cyclicality constrains duration.
  Y8:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 13.0
      mode: 20.0
      max: 28.0
      provenance: model_assumption
      rationale: Maturity/cycle compression.
  negative_fcf_fallback:
    basis: revenue_bridge
    multiple:
      distribution: triangular
      min: 3.0
      mode: 6.0
      max: 9.0
      provenance: model_assumption
      rationale: Schema>=1.0.2 revenue-bridge reference for stressed/crossover paths, not only literal negative FCF.
dependencies:
  latent_factors:
  - growth
  - margin
  - valuation
  factor_correlations:
    growth__margin: 0.42
    growth__valuation: 0.32
    margin__valuation: 0.35
  factor_correlations_meta:
    provenance: model_assumption
    rationale: Shipment growth/product mix supports margin; cycle/geopolitics and valuation retain independent components.
  default_loading: 0.65
  default_loading_meta:
    provenance: model_assumption
    rationale: Strong common WFE/AI/memory factors with technology/supply/export idiosyncrasy.
market_path_model:
  quarterly_log_price_noise:
    annualized_sigma: 0.4
    annualized_sigma_meta:
      provenance: model_assumption
      rationale: Semiconductor-equipment path noise in local-currency equity; used only for drawdown layer.
  valuation_mean_reversion_half_life_years: 1.75
  valuation_mean_reversion_half_life_years_meta:
    provenance: model_assumption
    rationale: WFE/AI-cycle valuation dislocations can persist across capex cycles.
reverse_valuation_ref:
  run_ref: PENDING_HOST_RUN:ASML_calibration_v1.0.yaml
  implied_revenue_cagr_5y: 0.2512582172
  implied_revenue_cagr_5y_meta:
    provenance: derived_fact
    formula: Local deterministic preflight of accepted Reverse Valuation equation in EUR; replace run_ref with authoritative sidecar run.
  discount_rate: 0.095
  discount_rate_meta:
    provenance: model_assumption
    rationale: Inherited from ASML RV base case.
robustness_tests:
  Scenario_Robustness:
    perturbations:
      growth_modes_pp:
      - -0.02676631
      - 0.02676631
      margin_nodes_pp:
      - -0.01031963
      - 0.01031963
      terminal_multiple_pct:
      - -0.0357927
      - 0.03712137
      correlation_rho:
      - -0.15
      - 0.15
    perturbations_meta:
      provenance: derived_fact
      formula: 'v1.1.2 local robustness: sigma_eq=(Q84-Q16)/2; growth=base-revenue-weighted RMS segment initial_growth sigma_eq; margin=Y5 terminal margin sigma_eq; multiple=Y5 log-space
        sigma_eq; perturbation=0.25*sigma with accepted absolute ceilings.'
    delta_tolerance: 0.1
    delta_tolerance_meta:
      provenance: model_assumption
      rationale: 'ASML: accepted v1.1.2 tolerance for |ΔP(2x,5Y)| and |ΔP(loss>30%,5Y)|.'
