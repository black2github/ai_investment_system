version: "1.0"
ticker: META
as_of: "2026-09-21"
artifact: "company_state_bundle"

source_policy:
  primary_only: true
  thresholds_provenance: model_assumption
  pending_verification_blocks_transition: true
  trigger_not_decision: true

sources:
  META_Q2_2026_10Q:
    url: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050705/meta-20260630.htm"
    type: "SEC 10-Q"
  META_Q2_2026_RELEASE_SEC:
    url: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm"
    type: "SEC earnings-release exhibit"
  META_Q2_2026_RELEASE_IR:
    url: "https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/"
    type: "IR earnings release"

states:
  axes:
    Ad_Monetization:
      states:
        A0: {name: stalled, criteria: "advertising revenue YoY < 5%"}
        A1: {name: moderate, criteria: "advertising revenue YoY >= 5% and < 15%"}
        A2: {name: strong, criteria: "advertising revenue YoY >= 15% and < 25%"}
        A3: {name: very_strong, criteria: "advertising revenue YoY >= 25% AND (ad impressions YoY >= 10% OR average price per ad YoY >= 10%)"}
        A4: {name: durable_dual_driver, criteria: "advertising revenue YoY >= 25% AND ad impressions YoY >= 10% AND average price per ad YoY >= 10% for 2 consecutive quarters"}
      current: A3
      current_evidence:
        - "Q2 advertising revenue $59.363B versus $46.563B, +27% YoY."
        - "Ad impressions +14% YoY and average price per ad +12% YoY."
      source_refs: [META_Q2_2026_10Q]

    User_Engagement:
      states:
        U0: {name: contracting, criteria: "Family DAP YoY < 0%"}
        U1: {name: flat, criteria: "Family DAP YoY >= 0% and < 2%"}
        U2: {name: mature_growth, criteria: "Family DAP YoY >= 2% and < 5%"}
        U3: {name: reaccelerating, criteria: "Family DAP YoY >= 5% and < 8%"}
        U4: {name: exceptional_scale_growth, criteria: "Family DAP YoY >= 8% for 2 consecutive quarters"}
      current: U2
      current_evidence:
        - "Family daily active people averaged 3.60B in June 2026, +3% YoY."
      source_refs: [META_Q2_2026_RELEASE_SEC]

    FoA_Profitability:
      states:
        P0: {name: compressed, criteria: "FoA operating margin < 20%"}
        P1: {name: moderate, criteria: "FoA operating margin >= 20% and < 30%"}
        P2: {name: healthy, criteria: "FoA operating margin >= 30% and < 40%"}
        P3: {name: high, criteria: "FoA operating margin >= 40% and < 50%"}
        P4: {name: exceptional, criteria: "FoA operating margin >= 50% for 2 consecutive quarters"}
      current: P2
      current_evidence:
        - "Q2 FoA operating income $23.394B on FoA revenue $60.370B = 38.75%."
      source_refs: [META_Q2_2026_10Q]

    AI_Capital_Intensity:
      states:
        C0: {name: normalized, criteria: "quarterly capex/revenue < 15%"}
        C1: {name: elevated, criteria: "capex/revenue >= 15% and < 25%"}
        C2: {name: aggressive, criteria: "capex/revenue >= 25% and < 40%"}
        C3: {name: extreme_but_cash_positive, criteria: "capex/revenue >= 40% AND quarterly FCF > 0"}
        C4: {name: cash_flow_stress, criteria: "capex/revenue >= 50% AND quarterly FCF <= 0 for 2 quarters OR commitments/annualized revenue >= 2x"}
      current: C3
      current_evidence:
        - "Q2 capex including finance-lease principal $31.08B on revenue $60.801B = 51.12%."
        - "Q2 FCF remained positive at $0.784B, margin 1.29%."
        - "Non-cancelable contractual commitments were $349.31B at June 30, 2026, ~1.44x annualized Q2 revenue; lease obligations not yet commenced were $278.99B."
      source_refs: [META_Q2_2026_10Q, META_Q2_2026_RELEASE_SEC]

    Reality_Labs_Drag:
      states:
        R0: {name: contained, criteria: "quarterly RL operating loss < $1B"}
        R1: {name: material, criteria: "loss >= $1B and < $3B"}
        R2: {name: high, criteria: "loss >= $3B and < $4B"}
        R3: {name: persistent_severe, criteria: "loss >= $4B and < $6B AND company expects full-year RL loss >= $15B"}
        R4: {name: escalating, criteria: "loss >= $6B for 2 consecutive quarters OR full-year RL loss guidance/expectation > $25B"}
      current: R3
      current_evidence:
        - "Q2 RL operating loss $4.619B on revenue $0.431B."
        - "Meta expects full-year 2026 RL operating losses to remain similar to 2025; 2025 RL reduced operating profit by ~$19.19B."
      source_refs: [META_Q2_2026_10Q]

kpis:
  zone_semantics:
    thresholds_provenance: model_assumption
  items:
    - id: META-KPI-01
      name: "Total revenue YoY"
      period: quarterly
      current_value: 0.28
      unit: fraction
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm"
      zones: {green: ">= 0.20", yellow: ">= 0.10 and < 0.20", red: "< 0.10"}

    - id: META-KPI-02
      name: "Advertising revenue YoY"
      period: quarterly
      current_value: 0.27
      unit: fraction
      formula: "59.363 / 46.563 - 1 = 0.2749; company reports 27%"
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050705/meta-20260630.htm"
      zones: {green: ">= 0.20", yellow: ">= 0.10 and < 0.20", red: "< 0.10"}

    - id: META-KPI-03
      name: "Ad impressions YoY"
      period: quarterly
      current_value: 0.14
      unit: fraction
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm"
      zones: {green: ">= 0.10", yellow: ">= 0.03 and < 0.10", red: "< 0.03"}

    - id: META-KPI-04
      name: "Average price per ad YoY"
      period: quarterly
      current_value: 0.12
      unit: fraction
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm"
      zones: {green: ">= 0.10", yellow: ">= 0 and < 0.10", red: "< 0"}

    - id: META-KPI-05
      name: "Family daily active people YoY"
      period: quarterly
      current_value: 0.03
      unit: fraction
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm"
      zones: {green: ">= 0.02", yellow: ">= 0 and < 0.02", red: "< 0"}

    - id: META-KPI-06
      name: "FoA operating margin"
      period: quarterly
      current_value: 0.3875
      unit: fraction
      formula: "23.394 / 60.370 = 0.3875"
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050705/meta-20260630.htm"
      zones: {green: ">= 0.40", yellow: ">= 0.30 and < 0.40", red: "< 0.30"}

    - id: META-KPI-07
      name: "Capex / revenue"
      period: quarterly
      current_value: 0.5112
      unit: fraction
      formula: "31.08 / 60.801 = 0.5112"
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm"
      zones: {green: "< 0.30", yellow: ">= 0.30 and < 0.50", red: ">= 0.50"}
      note: "Risk KPI; high capex can be value-creating if monetization and FCF subsequently improve."

    - id: META-KPI-08
      name: "Free cash flow margin"
      period: quarterly
      current_value: 0.0129
      unit: fraction
      formula: "0.784 / 60.801 = 0.0129"
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm"
      zones: {green: ">= 0.20", yellow: "> 0 and < 0.20", red: "<= 0"}

    - id: META-KPI-09
      name: "Non-cancelable commitments / annualized latest-quarter revenue"
      period: quarterly
      current_value: 1.4363
      unit: x
      formula: "349.31 / (60.801 * 4) = 1.4363"
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050705/meta-20260630.htm"
      zones: {green: "< 0.75", yellow: ">= 0.75 and < 1.50", red: ">= 1.50"}
      note: "Model-derived risk ratio; company reports the commitments, not this ratio."

    - id: META-KPI-10
      name: "Reality Labs operating loss"
      period: quarterly
      current_value: 4.619
      unit: "USD B"
      source: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050705/meta-20260630.htm"
      zones: {green: "< 3.0", yellow: ">= 3.0 and < 5.0", red: ">= 5.0"}

triggers:
  rules:
    evidence_required: true
    pending_verification_blocks_transition: true
    trigger_not_decision: true
    all_numeric_thresholds_provenance: model_assumption
  items:
    - id: META-E-01
      step: vector
      status: planned
      axis: Ad_Monetization
      transition: {from: A3, to: A4}
      kpis: [META-KPI-02, META-KPI-03, META-KPI-04]
      condition: "advertising revenue YoY >=25% AND ad impressions YoY >=10% AND average price per ad YoY >=10% for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-02
      step: vector
      status: planned
      axis: Ad_Monetization
      transition: {from: A3, to: A2}
      kpis: [META-KPI-02]
      condition: "advertising revenue YoY <20% for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-03
      step: vector
      status: planned
      axis: User_Engagement
      transition: {from: U2, to: U3}
      kpis: [META-KPI-05]
      condition: "Family DAP YoY >=5% for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-04
      step: vector
      status: planned
      axis: User_Engagement
      transition: {from: U2, to: U1}
      kpis: [META-KPI-05]
      condition: "Family DAP YoY <2% for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-05
      step: vector
      status: planned
      axis: FoA_Profitability
      transition: {from: P2, to: P3}
      kpis: [META-KPI-06]
      condition: "FoA operating margin >=40% for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-06
      step: vector
      status: planned
      axis: FoA_Profitability
      transition: {from: P2, to: P1}
      kpis: [META-KPI-06]
      condition: "FoA operating margin <30% for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-07
      step: vector
      status: planned
      axis: AI_Capital_Intensity
      transition: {from: C3, to: C2}
      kpis: [META-KPI-07, META-KPI-08]
      condition: "capex/revenue <40% AND FCF margin >=15% for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-08
      step: vector
      status: planned
      axis: AI_Capital_Intensity
      transition: {from: C3, to: C4}
      kpis: [META-KPI-07, META-KPI-08, META-KPI-09]
      condition: "(capex/revenue >=50% AND FCF margin <=0 for 2 consecutive quarters) OR commitments/annualized revenue >=2.0x"
      period: "2 quarters or one balance-sheet observation for commitments"
      level: E2

    - id: META-E-09
      step: vector
      status: planned
      axis: Reality_Labs_Drag
      transition: {from: R3, to: R2}
      kpis: [META-KPI-10]
      condition: "Reality Labs quarterly operating loss < $4B for 2 consecutive quarters"
      period: "2 quarters"
      level: E2

    - id: META-E-10
      step: vector
      status: planned
      axis: Reality_Labs_Drag
      transition: {from: R3, to: R4}
      kpis: [META-KPI-10]
      condition: "Reality Labs quarterly operating loss >= $6B for 2 consecutive quarters OR company expects full-year RL loss > $25B"
      period: "2 quarters or one verified company outlook"
      level: E2

mpc_inputs:
  driver_exposure_semantics:
    scale: {-2: strong_negative, -1: negative, 0: immaterial, 1: positive, 2: strong_positive}
    provenance: model_assumption
  driver_exposure_vector:
    AI_COMPUTE_DEMAND: 2
    HYPERSCALER_CAPEX: -2
    SEMICONDUCTOR_WFE: 0
    ADVANCED_PACKAGING: -1
    HBM_MEMORY: -1
    EDA_DESIGN_COMPLEXITY: 0
    CLOUD_SOFTWARE_DEMAND: 1
    DATA_CENTER_POWER: -2
    LAUNCH_ECONOMICS: 0
    SATELLITE_CONNECTIVITY: 0
    GOVERNMENT_DEFENSE: 0
    INTEREST_RATES: -1
    CAPITAL_MARKETS: 0
    CHINA_REVENUE: 0
    TAIWAN_SUPPLY: -1
    ACQUISITION_INTEGRATION: 0
  driver_interpretation:
    HYPERSCALER_CAPEX:
      directionality: dual
      vector_score: -2
      positive_channel: "More AI infrastructure can improve recommendation, advertising and future AI products."
      negative_channel: "META is itself a hyperscaler buyer; rising infrastructure capex is a direct cash-flow/commitment burden."
      net_rule_v1: "For portfolio common-cause exposure, encode the cash-consumer channel as negative; retain AI_COMPUTE_DEMAND +2 as the separate positive demand/monetization channel."
    TAIWAN_SUPPLY:
      directionality: negative_input_dependency
      note: "Disruption would impair availability/cost of leading-edge compute hardware; this is an input-side exposure."
  failure_modes:
    - {failure_id: META-FM-01, name: "AI infrastructure spending fails to produce proportional ad/product monetization", common_cause_id: AI_OVERBUILD, severity: high}
    - {failure_id: META-FM-02, name: "Data-center power/lease commitments constrain FCF", common_cause_id: DATA_CENTER_POWER_CONSTRAINT, severity: high}
    - {failure_id: META-FM-03, name: "Leading-edge GPU/HBM supply disruption raises cost or delays capacity", common_cause_id: TAIWAN_SUPPLY_DISRUPTION, severity: high}
    - {failure_id: META-FM-04, name: "Advertising growth decelerates despite high infrastructure spend", common_cause_id: DIGITAL_AD_DEMAND_SLOWDOWN, severity: high}
    - {failure_id: META-FM-05, name: "Reality Labs losses remain structurally large", common_cause_id: LONG_DURATION_NEW_BET_BURN, severity: medium}
    - {failure_id: META-FM-06, name: "Privacy/antitrust/legal actions impair monetization or create material charges", common_cause_id: PLATFORM_REGULATORY_PRESSURE, severity: high}
    - {failure_id: META-FM-07, name: "Debt/lease/contract commitments reduce strategic flexibility during downturn", common_cause_id: HYPERSCALER_CAPEX_SLOWDOWN, severity: medium}
