schema_version: 1.0.2
artifact: company_mc_calibration
ticker: S
as_of: '2026-10-02'
archetype: mature_positive_margin
calculation_engine_version: company_mc 2.3.1
state_vector:
  ARR_Momentum: A2
  Net_New_ARR: N2
  Platform_Adoption: P2
  Profitability_Cash: M2
  Enterprise_Scale: E2
  Retention_Quality: R1
simulation:
  paths: 500000
  paths_meta:
    provenance: model_assumption
    rationale: Normative production path count.
  seed: 20260920
  seed_meta:
    provenance: model_assumption
    rationale: Fixed reproducibility seed.
  antithetic_variates: true
  store_summary_quantiles:
  - 0.01
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  - 0.99
  store_summary_quantiles_meta:
    provenance: model_assumption
    rationale: Standard system summary grid.
  horizons_years:
  - 3
  - 5
  - 8
  horizons_years_meta:
    provenance: model_assumption
    rationale: Current Thesis / Primary Optimization / Persistence horizons.
revenue_model:
  segments:
    Platform:
      base_revenue_quarterly: 291981000.0
      base_revenue_quarterly_meta:
        provenance: verified_fact
        source_ref: 2026-07-31 | https://www.sec.gov/Archives/edgar/data/1583708/000158370826000052/sentineloneq227exhibit991.htm
      initial_growth:
        distribution: triangular
        min: 0.1
        mode: 0.21
        max: 0.34
        provenance: model_assumption
        rationale: Q2 revenue grew 21% YoY and ARR 22%; center uses the disclosed revenue growth while tails capture net-new
          ARR volatility and competitive share shifts.
      long_run_growth_y8:
        distribution: triangular
        min: 0.04
        mode: 0.12
        max: 0.22
        provenance: model_assumption
        rationale: Long-run growth mean-reverts as scale rises, retaining upside from platform consolidation and enterprise
          penetration.
      growth_half_life_years: 2.5
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Growth normalizes over a multi-year operating cycle.
      latent_loading:
        growth: 0.66
      latent_loading_meta:
        provenance: model_assumption
        rationale: Shared demand exposure remains material alongside company-specific execution.
margin_model:
  method: mean_reverting_positive_margin
  current_margin: 0.04
  current_margin_meta:
    provenance: model_assumption
    rationale: 4.0% normalized start blends FY2026 ~5% FCF margin with H1 FY2027 3.08% YTD FCF margin; Q2 standalone FCF was
      -4.5% of revenue. This is not reported actual and is not price-fitted.
  terminal_margin_Y5:
    distribution: triangular
    min: 0.06
    mode: 0.16
    max: 0.24
    provenance: model_assumption
    rationale: Wide Y5 distribution reflects unresolved conversion from GAAP operating loss to durable cash profitability.
  terminal_margin_Y8:
    distribution: triangular
    min: 0.08
    mode: 0.18
    max: 0.28
    provenance: model_assumption
    rationale: Y8 allows mature software scale economics but keeps a broad downside for competition and spending needs.
  half_life_years: 3.0
  half_life_years_meta:
    provenance: model_assumption
    rationale: Cash-margin convergence horizon.
  shock_sigma: 0.05
  shock_sigma_meta:
    provenance: model_assumption
    rationale: Quarterly company-specific cash-margin noise, separate from Joint Layer drivers.
  shock_persistence: 0.5
  shock_persistence_meta:
    provenance: model_assumption
    rationale: Operating and working-capital shocks persist across adjacent quarters but mean-revert.
  lower_bound: -0.12
  lower_bound_meta:
    provenance: model_assumption
    rationale: Severe operating downside bound; discrete thesis breaks remain failure/recalibration events.
  upper_bound: 0.32
  upper_bound_meta:
    provenance: model_assumption
    rationale: Caps extrapolation beyond economically plausible mature cash conversion.
valuation:
  Y3:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 14.0
      mode: 28.0
      max: 46.0
      provenance: model_assumption
      rationale: Near-term valuation remains highly sensitive to proof of cash conversion.
  Y5:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 12.0
      mode: 22.0
      max: 36.0
      provenance: model_assumption
      rationale: Mature-case FCF multiple chosen independently of current price.
  Y8:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 10.0
      mode: 18.0
      max: 30.0
      provenance: model_assumption
      rationale: Duration compresses as growth normalizes.
  negative_fcf_fallback:
    basis: revenue_bridge
    multiple:
      distribution: triangular
      min: 1.5
      mode: 3.0
      max: 5.5
      provenance: model_assumption
      rationale: 'Parity bridge: 3.0x revenue / 22x FCF implies 13.6% margin, inside the independently selected Y5 margin
        distribution.'
dependencies:
  latent_factors:
  - growth
  - margin
  - valuation
  factor_correlations:
    growth__margin: 0.35
    growth__valuation: 0.3
    margin__valuation: 0.35
  factor_correlations_meta:
    provenance: model_assumption
    rationale: Demand, margin conversion and valuation co-move while competitive execution remains idiosyncratic.
  default_loading: 0.64
  default_loading_meta:
    provenance: model_assumption
    rationale: Common-factor loading leaves material idiosyncratic execution risk.
market_path_model:
  quarterly_log_price_noise:
    annualized_sigma: 0.5
    annualized_sigma_meta:
      provenance: model_assumption
      rationale: Path-volatility calibration for drawdown diagnostics only; does not set terminal value.
  valuation_mean_reversion_half_life_years: 1.5
  valuation_mean_reversion_half_life_years_meta:
    provenance: model_assumption
    rationale: Liquid listed-equity valuation dislocations mean-revert over several quarters.
reverse_valuation_ref:
  run_ref: PENDING_HOST_RUN:S_calibration_v1.0.yaml
  implied_revenue_cagr_5y: 0.28577539600317475
  implied_revenue_cagr_5y_meta:
    provenance: derived_fact
    formula: Local deterministic preflight of Reverse Valuation equity-FCF equation from S_calibration_v1.0.yaml; host run_ref
      remains authoritative.
  discount_rate: 0.11
  discount_rate_meta:
    provenance: model_assumption
    rationale: Inherited from S RV base calibration.
robustness_tests:
  Scenario_Robustness:
    perturbations:
      growth_modes_pp:
      - -0.01226161580796847
      - 0.01226161580796847
      margin_nodes_pp:
      - -0.009204467514322719
      - 0.009204467514322719
      terminal_multiple_pct:
      - -0.05461520678318055
      - 0.05777034618606858
      correlation_rho:
      - -0.15
      - 0.15
    perturbations_meta:
      provenance: derived_fact
      formula: 'v1.1.2 local preflight: sigma_eq from triangular nodes; growth is base-revenue-weighted RMS of segment initial-growth
        sigma; margin is Y5 triangular sigma; multiple is Y5 log-space triangular sigma; perturbation = 0.25*sigma; correlation
        +/-0.15.'
    delta_tolerance: 0.1
    delta_tolerance_meta:
      provenance: model_assumption
      rationale: Accepted v1.1.2 tolerance for |Delta P(2x,5Y)| and |Delta P(loss>30%,5Y)|.
joint_simulation:
  layer_version: '1.0'
  active_drivers:
  - CLOUD_SOFTWARE_DEMAND
  - CAPITAL_MARKETS
  - INTEREST_RATES
  - AI_COMPUTE_DEMAND
  - ACQUISITION_INTEGRATION
  company_idiosyncratic_factors:
  - id: S_EXECUTION
    distribution: standard_normal
    persistence: 0.55
    persistence_meta:
      provenance: model_assumption
      rationale: Company-specific execution shocks persist across adjacent quarters but mean-revert.
  path_alignment:
    use_global_path_id: true
driver_parameter_mapping:
- driver_id: CLOUD_SOFTWARE_DEMAND
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Platform.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.03
    lag_quarters: 0
    decay_half_life_quarters: 6
    meta:
      provenance: model_assumption
      rationale: Enterprise cloud/security demand shifts platform growth.
  structural_support:
  - path: revenue_model.segments.Platform.initial_growth.mode
    contribution: 0.01
    meta:
      provenance: model_assumption
      rationale: A2/P2 central case assumes continued cloud-security demand.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Primary demand linkage.
- driver_id: CAPITAL_MARKETS
  material: true
  stochastic_targets:
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: 0.012
    lag_quarters: 0
    decay_half_life_quarters: 6
    meta:
      provenance: model_assumption
      rationale: Risk appetite changes valuation; no funding dependence is assumed because liquidity is substantial.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Valuation channel only.
- driver_id: INTEREST_RATES
  material: true
  stochastic_targets:
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: -0.02
    lag_quarters: 0
    decay_half_life_quarters: 6
    meta:
      provenance: model_assumption
      rationale: Higher rates compress duration valuation.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: 1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Valuation-only rate channel.
- driver_id: AI_COMPUTE_DEMAND
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Platform.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.01
    lag_quarters: 1
    decay_half_life_quarters: 8
    meta:
      provenance: model_assumption
      rationale: AI workloads modestly expand security surface, but AI is not the primary revenue driver.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Secondary linkage, deliberately small.
- driver_id: ACQUISITION_INTEGRATION
  material: true
  stochastic_targets:
  - path: margin_model.terminal_margin_Y5
    transform: additive_pp
    effect_per_plus_1sigma: 0.008
    lag_quarters: 1
    decay_half_life_quarters: 6
    meta:
      provenance: model_assumption
      rationale: Acquired-product integration can modestly affect cash conversion; mapping is kept small.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Secondary execution linkage; S-FM-04 remains intrinsic margin-conversion risk.
