driver_consistency:
  mpc_driver_taxonomy_ref: MPC_Driver_Taxonomy_v1.2.1
  canonical_mpc_inputs_ref: portfolio/spacex/mpc_inputs.yaml
  strong_driver_abs_score: 2
  minimum_materiality_share: 0.2
  share_measure: max_non_fallback_revenue_or_capex_share
  fallback_share_can_satisfy: false
  exceptions:
  - driver_id: LAUNCH_ECONOMICS
    exception_type: company_level_materiality_exception
    status: accepted_followup
    rationale: Launch economics is thesis-critical for the Space/Starship option even though Q2 Space revenue share (12.31%)
      and capex share (6.39%) are below THM-007 20%. The driver is not a claim that SPACE is >=20% of current revenue.
  - driver_id: GOVERNMENT_DEFENSE
    exception_type: company_level_materiality_exception
    status: accepted_followup
    rationale: Government/defense demand can be material to Space/Starshield contracts and option value despite the current
      Space segment share being below THM-007 20%; retain strong driver score with explicit exception rather than falsifying
      current look-through shares.
  minimum_materiality_share_meta:
    provenance: model_assumption
    status: pending_owner_judgment
notes:
- THM-007 threshold 0.20 was subsequently confirmed by owner on 2026-10-03; v1.0 schema still encodes its original metadata
  contract as model_assumption/pending_owner_judgment. The owner decision is recorded externally and should be reflected in
  the next schema revision.
- 'Q2 2026 revenue shares: Space 12.31%, Connectivity 54.91%, AI 32.77%. THM-007 exceptions are explicit and do not alter
  binding revenue shares.'
