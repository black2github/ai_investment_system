driver_interpretation:
  CLOUD_SOFTWARE_DEMAND:
    directionality: positive
    rationale: Cybersecurity platform subscriptions depend on enterprise software/security budgets; nearest systematic taxonomy driver.
  AI_COMPUTE_DEMAND:
    directionality: positive_dependency
    rationale: AI adoption expands attack surface/security demand, but CrowdStrike does not disclose AI as a separate revenue theme; keep +1.
  ACQUISITION_INTEGRATION:
    directionality: positive_if_successful
    rationale: Material acquisitions increased goodwill; successful integration expands platform, failure captured separately.
failure_modes:
