$schema: https://json-schema.org/draft/2020-12/schema
$id: https://ai-investment-system.local/schemas/company-candidate/1.0.1
title: Company Candidate Schema v1.0.1
description: Strict LLM output schema. Canonical IDs and workspace runtime fields are NOT emitted by the LLM. v1.0.1 adds qualitative-axis evidence
  metadata, observation windows, binary thresholds, source-object compatibility fields and MPC semantic/benchmark metadata.
type: object
additionalProperties: false
required:
- candidate_schema_version
- package_type
- ticker
- company
- as_of
- methodology_refs
- sources
- states
- kpis
- transitions
- mpc_inputs
properties:
  candidate_schema_version:
    const: 1.0.1
    x-classification: required
    x-owner: llm_candidate
  package_type:
    const: company_model_candidate
    x-classification: required
    x-owner: llm_candidate
  ticker:
    type: string
    pattern: ^[A-Z0-9.\-]{1,12}$
    x-classification: required
    x-owner: llm_candidate
  company:
    type: string
    minLength: 1
    x-classification: required
    x-owner: llm_candidate
  exchange:
    type:
    - string
    - 'null'
    x-classification: optional
    x-owner: llm_candidate
  as_of:
    type: string
    format: date
    x-classification: required
    x-owner: llm_candidate
  methodology_refs:
    type: object
    additionalProperties:
      type: string
    required:
    - provenance_schema
    - driver_taxonomy
    - company_candidate_schema
    x-classification: required
    x-owner: llm_candidate
  sources:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/source'
    x-classification: required
    x-owner: llm_candidate
  states:
    type: object
    additionalProperties: false
    required:
    - axes
    properties:
      axes:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/$defs/axis'
        x-classification: required
        x-owner: llm_candidate
    x-classification: required
    x-owner: llm_candidate
  kpis:
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/kpi'
    x-classification: required
    x-owner: llm_candidate
  transitions:
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/transition'
    x-classification: required
    x-owner: llm_candidate
  mpc_inputs:
    $ref: '#/$defs/mpc_inputs'
    x-classification: required
    x-owner: llm_candidate
$defs:
  provenance:
    type: string
    enum: &id001
    - verified_fact
    - derived_fact
    - model_assumption
    - owner_judgment
    - normative_rule
    - external_methodology
  source_class:
    type: string
    enum: &id002
    - regulatory_filing
    - issuer_ir_release
    - issuer_investor_presentation
    - issuer_transcript
    - first_tier_media
    - market_data_provider
    - other_primary
  local_id:
    type: string
    pattern: ^[a-z][a-z0-9_]{1,63}$
  source:
    type: object
    additionalProperties: false
    required:
    - source_ref
    - source_class
    - url
    - as_of
    properties:
      source_ref:
        $ref: '#/$defs/local_id'
      source_class:
        $ref: '#/$defs/source_class'
      url:
        type: string
        format: uri
      as_of:
        type: string
        format: date
      title:
        type:
        - string
        - 'null'
      document_type:
        type:
        - string
        - 'null'
        deprecated: true
        description: Deprecated alias retained from Candidate Schema v1.0; prefer type.
      access_note:
        type:
        - string
        - 'null'
      type:
        type:
        - string
        - 'null'
        description: Issuer/document label as published, e.g. 'SEC 10-Q'. This is not source_class.
      note:
        type:
        - string
        - 'null'
  state:
    type: object
    additionalProperties: false
    required:
    - name
    - criteria
    - criteria_provenance
    properties:
      name:
        type: string
      criteria:
        type: string
        minLength: 1
      criteria_provenance:
        const: model_assumption
  axis:
    type: object
    additionalProperties: false
    required:
    - name
    - states
    - current
    - current_provenance
    - current_evidence_refs
    properties:
      name:
        type: string
      name_ru:
        type:
        - string
        - 'null'
      states:
        type: object
        minProperties: 2
        additionalProperties:
          $ref: '#/$defs/state'
      current:
        type: string
      current_provenance:
        type: string
        enum:
        - verified_fact
        - derived_fact
        - model_assumption
      current_evidence_refs:
        type: array
        items:
          $ref: '#/$defs/local_id'
      prior_snapshot:
        type:
        - string
        - 'null'
      current_note:
        type:
        - string
        - 'null'
      note:
        type:
        - string
        - 'null'
      evidence_type:
        type:
        - string
        - 'null'
        enum:
        - quantitative
        - qualitative_primary_source
        - mixed
        - derived_binary
        - null
      verification_rule:
        type:
        - string
        - 'null'
  thresholds:
    type: object
    additionalProperties: false
    required:
    - green
    - red
    properties:
      green:
        type: string
      yellow:
        type: string
      red:
        type: string
      binary:
        type: boolean
    allOf:
    - if:
        required:
        - binary
        properties:
          binary:
            const: true
      then: {}
      else:
        required:
        - yellow
  value_range:
    type: object
    additionalProperties: false
    required:
    - min
    - max
    properties:
      min:
        type: number
      max:
        type: number
  kpi:
    type: object
    additionalProperties: false
    required:
    - local_id
    - name
    - unit
    - period
    - source_ref
    - provenance
    - last_value
    - value_type
    - observation_qualifier
    - thresholds
    - thresholds_provenance
    properties:
      local_id:
        $ref: '#/$defs/local_id'
      name:
        type: string
      unit:
        type: string
      period:
        type: string
      source_ref:
        $ref: '#/$defs/local_id'
      provenance:
        $ref: '#/$defs/provenance'
      last_value:
        type:
        - number
        - 'null'
      value_type:
        type: string
        enum:
        - actual
        - company_guidance
        - analyst_estimate
      observation_qualifier:
        type: string
        enum:
        - exact
        - approximate
        - lower_bound
        - upper_bound
        - range
        - not_separately_disclosed
        - pending_verification
      value_range:
        $ref: '#/$defs/value_range'
      formula:
        type:
        - string
        - 'null'
      target_date:
        type:
        - string
        - 'null'
        format: date
      thresholds:
        $ref: '#/$defs/thresholds'
      thresholds_provenance:
        const: model_assumption
      verification_status:
        type:
        - string
        - 'null'
        enum:
        - pending_verification
        - not_separately_disclosed
        - null
      note:
        type:
        - string
        - 'null'
      observation_window_days:
        type:
        - integer
        - 'null'
        minimum: 1
    allOf:
    - if:
        properties:
          observation_qualifier:
            const: range
        required:
        - observation_qualifier
      then:
        required:
        - value_range
        properties:
          last_value:
            type: 'null'
    - if:
        properties:
          provenance:
            const: derived_fact
        required:
        - provenance
      then:
        required:
        - formula
    - if:
        properties:
          observation_qualifier:
            enum:
            - not_separately_disclosed
            - pending_verification
        required:
        - observation_qualifier
      then:
        properties:
          last_value:
            type: 'null'
  transition:
    type: object
    additionalProperties: false
    required:
    - local_id
    - axis
    - transition
    - level
    - kpi_refs
    - condition
    - condition_provenance
    - period
    properties:
      local_id:
        $ref: '#/$defs/local_id'
      axis:
        type: string
      transition:
        type: object
        additionalProperties: false
        required:
        - from
        - to
        properties:
          from:
            type: string
          to:
            type: string
      level:
        type: string
        enum:
        - E1
        - E2
        - E3
      kpi_refs:
        type: array
        items:
          $ref: '#/$defs/local_id'
      condition:
        type: string
      condition_provenance:
        const: model_assumption
      period:
        type:
        - string
        - 'null'
      note:
        type:
        - string
        - 'null'
  failure_mode:
    type: object
    additionalProperties: false
    required:
    - local_id
    - common_cause_id
    - severity
    - name
    properties:
      local_id:
        $ref: '#/$defs/local_id'
      common_cause_id:
        type: string
        pattern: ^[A-Z0-9_]+$
      severity:
        type: string
        enum:
        - low
        - medium
        - high
        - critical
      name:
        type: string
      axis_refs:
        type: array
        items:
          type: string
      note:
        type:
        - string
        - 'null'
  mpc_inputs:
    type: object
    additionalProperties: false
    required:
    - driver_taxonomy_version
    - driver_exposure_vector
    - driver_vector_provenance
    - failure_modes_provenance
    - failure_modes
    properties:
      driver_taxonomy_version:
        type: string
      driver_exposure_vector:
        type: object
        properties:
          AI_COMPUTE_DEMAND:
            type: integer
            minimum: -2
            maximum: 2
          HYPERSCALER_CAPEX:
            type: integer
            minimum: -2
            maximum: 2
          SEMICONDUCTOR_WFE:
            type: integer
            minimum: -2
            maximum: 2
          ADVANCED_PACKAGING:
            type: integer
            minimum: -2
            maximum: 2
          HBM_MEMORY:
            type: integer
            minimum: -2
            maximum: 2
          EDA_DESIGN_COMPLEXITY:
            type: integer
            minimum: -2
            maximum: 2
          CLOUD_SOFTWARE_DEMAND:
            type: integer
            minimum: -2
            maximum: 2
          DATA_CENTER_POWER:
            type: integer
            minimum: -2
            maximum: 2
          LAUNCH_ECONOMICS:
            type: integer
            minimum: -2
            maximum: 2
          SATELLITE_CONNECTIVITY:
            type: integer
            minimum: -2
            maximum: 2
          GOVERNMENT_DEFENSE:
            type: integer
            minimum: -2
            maximum: 2
          INTEREST_RATES:
            type: integer
            minimum: -2
            maximum: 2
          CAPITAL_MARKETS:
            type: integer
            minimum: -2
            maximum: 2
          CHINA_REVENUE:
            type: integer
            minimum: -2
            maximum: 2
          TAIWAN_SUPPLY:
            type: integer
            minimum: -2
            maximum: 2
          ACQUISITION_INTEGRATION:
            type: integer
            minimum: -2
            maximum: 2
          AI_CLOUD_PRICING:
            type: integer
            minimum: -2
            maximum: 2
          HEALTHCARE_DEMAND:
            type: integer
            minimum: -2
            maximum: 2
          DRUG_PIPELINE:
            type: integer
            minimum: -2
            maximum: 2
          REIMBURSEMENT_PRICING:
            type: integer
            minimum: -2
            maximum: 2
          BIOPHARMA_MANUFACTURING_CAPACITY:
            type: integer
            minimum: -2
            maximum: 2
          PHARMA_REGULATION:
            type: integer
            minimum: -2
            maximum: 2
          PATENT_EXCLUSIVITY:
            type: integer
            minimum: -2
            maximum: 2
          ELECTRIFICATION_GRID:
            type: integer
            minimum: -2
            maximum: 2
          UTILITY_CAPEX:
            type: integer
            minimum: -2
            maximum: 2
          INDUSTRIAL_RESHORING:
            type: integer
            minimum: -2
            maximum: 2
          AEROSPACE_CYCLE:
            type: integer
            minimum: -2
            maximum: 2
          CONSUMER_CREDIT:
            type: integer
            minimum: -2
            maximum: 2
          CRYPTO_CYCLE:
            type: integer
            minimum: -2
            maximum: 2
          FINTECH_REGULATION:
            type: integer
            minimum: -2
            maximum: 2
          DIGITAL_AD_DEMAND:
            type: integer
            minimum: -2
            maximum: 2
          SPACE_REGULATION:
            type: integer
            minimum: -2
            maximum: 2
        required:
        - AI_COMPUTE_DEMAND
        - HYPERSCALER_CAPEX
        - SEMICONDUCTOR_WFE
        - ADVANCED_PACKAGING
        - HBM_MEMORY
        - EDA_DESIGN_COMPLEXITY
        - CLOUD_SOFTWARE_DEMAND
        - DATA_CENTER_POWER
        - LAUNCH_ECONOMICS
        - SATELLITE_CONNECTIVITY
        - GOVERNMENT_DEFENSE
        - INTEREST_RATES
        - CAPITAL_MARKETS
        - CHINA_REVENUE
        - TAIWAN_SUPPLY
        - ACQUISITION_INTEGRATION
        - AI_CLOUD_PRICING
        - HEALTHCARE_DEMAND
        - DRUG_PIPELINE
        - REIMBURSEMENT_PRICING
        - BIOPHARMA_MANUFACTURING_CAPACITY
        - PHARMA_REGULATION
        - PATENT_EXCLUSIVITY
        - ELECTRIFICATION_GRID
        - UTILITY_CAPEX
        - INDUSTRIAL_RESHORING
        - AEROSPACE_CYCLE
        - CONSUMER_CREDIT
        - CRYPTO_CYCLE
        - FINTECH_REGULATION
        - DIGITAL_AD_DEMAND
        - SPACE_REGULATION
        additionalProperties: false
      driver_vector_provenance:
        const: model_assumption
      driver_interpretation:
        type: object
        additionalProperties: true
      failure_modes_provenance:
        const: model_assumption
      failure_modes:
        type: array
        items:
          $ref: '#/$defs/failure_mode'
      cross_portfolio_common_causes:
        type: object
        additionalProperties: true
      taxonomy_gap:
        type: array
        items:
          type: string
      taxonomy_gap_note:
        type:
        - string
        - 'null'
      driver_exposure_semantics:
        type: object
        additionalProperties: false
        properties:
          scale:
            type: object
            additionalProperties:
              type: string
          provenance:
            type: string
            enum:
            - model_assumption
            - normative_rule
          direction_rule:
            type:
            - string
            - 'null'
      benchmark:
        type: object
        additionalProperties: false
        properties:
          sector_id:
            type:
            - string
            - 'null'
          benchmark_id:
            type:
            - string
            - 'null'
          recommendation:
            type:
            - string
            - 'null'
          reason:
            type:
            - string
            - 'null'
          methodology_ref:
            type:
            - string
            - 'null'
x-integrity-rules:
- id: CAND-REF-001
  severity: error
  rule: unique(sources[*].source_ref)
  message: source_ref must be unique
- id: CAND-REF-002
  severity: error
  rule: 'for each axis.source/evidence ref: ref in sources[*].source_ref'
  message: Axis evidence refs must resolve
- id: CAND-REF-003
  severity: error
  rule: unique(kpis.items[*].local_id)
  message: KPI local IDs must be unique
- id: CAND-REF-004
  severity: error
  rule: 'for each KPI: source_ref in sources[*].source_ref'
  message: KPI source_ref must resolve
- id: CAND-REF-005
  severity: error
  rule: unique(transitions.items[*].local_id)
  message: Transition local IDs must be unique
- id: CAND-REF-006
  severity: error
  rule: 'for each transition: axis in states.axes'
  message: Transition axis must exist
- id: CAND-REF-007
  severity: error
  rule: 'for each transition: transition.from and transition.to in states.axes[axis].states'
  message: Transition states must exist
- id: CAND-REF-008
  severity: error
  rule: 'for each transition.kpi_refs[*]: ref in kpis.items[*].local_id'
  message: Transition KPI refs must resolve
- id: CAND-REF-009
  severity: error
  rule: 'for each axis: current == pending_verification OR current in axis.states'
  message: Current state must exist or be pending_verification
- id: CAND-REF-010
  severity: error
  rule: 'for each axis with prior_snapshot != null: prior_snapshot in axis.states'
  message: prior_snapshot must exist
- id: CAND-REF-011
  severity: error
  rule: all material numeric fields have explicit or enclosing provenance
  message: Material numbers must be typed by Provenance Schema v1.0
- id: CAND-REF-012
  severity: error
  rule: kpis.items[*].last_value is number or null
  message: No numeric string/list in last_value; use qualifier/value_range
- id: CAND-REF-013
  severity: error
  rule: kpis.items[*].value_type in {actual,company_guidance,analyst_estimate}
  message: value_type must distinguish guidance from actual
- id: CAND-REF-014
  severity: error
  rule: keys(mpc_inputs.driver_exposure_vector) == taxonomy(driver_taxonomy_version).driver_ids
  message: Driver vector must be complete for declared taxonomy
- id: CAND-REF-015
  severity: error
  rule: candidate local IDs do not match canonical ticker-prefixed ID patterns
  message: LLM candidate must not assign canonical IDs
- id: CAND-REF-016
  severity: error
  rule: 'trigger_not_decision: transitions contain no trade action'
  message: Candidate transition must not prescribe trade action
- id: CAND-REF-017
  severity: error
  rule: candidate_schema_version == 1.0.1
  message: New LLM candidates must emit Candidate Schema v1.0.1 exactly.
x-full-example:
  candidate_schema_version: 1.0.1
  package_type: company_model_candidate
  ticker: NBIS
  company: Nebius Group N.V.
  exchange: NASDAQ
  as_of: '2026-09-21'
  methodology_refs:
    provenance_schema: 1.0.0
    driver_taxonomy: '1.1'
    company_candidate_schema: '1.0'
  sources:
  - source_ref: src_q2_release
    source_class: issuer_ir_release
    url: https://www.sec.gov/Archives/edgar/data/1513845/000110465926094568/tm2622968d1_ex99-1.htm
    as_of: '2026-08-12'
  - source_ref: src_q2_letter
    source_class: issuer_ir_release
    url: https://www.sec.gov/Archives/edgar/data/1513845/000110465926094568/tm2622968d1_ex99-2.htm
    as_of: '2026-08-12'
  - source_ref: src_q2_6k
    source_class: regulatory_filing
    url: https://www.sec.gov/Archives/edgar/data/1513845/000110465926094844/nbis-20260812xex99d1.htm
    as_of: '2026-08-12'
  states:
    axes:
      Demand_Monetization:
        name: Demand Monetization
        name_ru: спрос и монетизация AI-облака
        states:
          N0:
            name: optionality
            criteria: AI cloud quarterly revenue < $0.10B
            criteria_provenance: model_assumption
          N1:
            name: demand_validation
            criteria: AI cloud quarterly revenue >= $0.10B AND ARR >= $0.50B
            criteria_provenance: model_assumption
          N2:
            name: scale_validation
            criteria: AI cloud quarterly revenue >= $0.30B AND ARR >= $1.50B
            criteria_provenance: model_assumption
          N3:
            name: contracted_scale
            criteria: AI cloud quarterly revenue >= $0.50B AND ARR >= $3.0B AND disclosed customer commitments >= $20B
            criteria_provenance: model_assumption
          N4:
            name: durable_scale
            criteria: AI cloud quarterly revenue >= $1.0B AND ARR >= $5.0B for 2 consecutive quarters
            criteria_provenance: model_assumption
        current: N3
        current_provenance: derived_fact
        current_evidence_refs:
        - src_q2_letter
        - src_q2_6k
      Unit_Economics:
        name: Unit Economics
        name_ru: юнит-экономика AI-облака
        states:
          E0:
            name: negative
            criteria: AI cloud adjusted EBITDA margin < 0%
            criteria_provenance: model_assumption
          E1:
            name: breakeven
            criteria: margin >= 0% and < 20%
            criteria_provenance: model_assumption
          E2:
            name: scaled_positive
            criteria: margin >= 20% and < 35%
            criteria_provenance: model_assumption
          E3:
            name: high_margin
            criteria: margin >= 35% for at least 1 quarter
            criteria_provenance: model_assumption
          E4:
            name: durable_high_margin
            criteria: AI cloud margin >= 45% for 2 quarters AND group adjusted EBITDA margin >= 35%
            criteria_provenance: model_assumption
        current: E3
        current_provenance: derived_fact
        current_evidence_refs:
        - src_q2_letter
        - src_q2_6k
      Capacity_Secured:
        name: Capacity Secured
        name_ru: законтрактованная мощность (ГВт)
        states:
          C0:
            name: subscale
            criteria: contracted power guidance < 1 GW
            criteria_provenance: model_assumption
          C1:
            name: initial_scale
            criteria: guidance >= 1 GW and < 3 GW
            criteria_provenance: model_assumption
          C2:
            name: large_scale
            criteria: guidance >= 3 GW and < 5 GW
            criteria_provenance: model_assumption
          C3:
            name: hyperscale_secured
            criteria: guidance >= 5 GW
            criteria_provenance: model_assumption
          C4:
            name: hyperscale_execution
            criteria: contracted power >= 6 GW AND >= 1 GW capacity brought online in trailing 12 months
            criteria_provenance: model_assumption
        current: pending_verification
        current_provenance: derived_fact
        current_evidence_refs:
        - src_q2_letter
        prior_snapshot: C3
        current_note: 5 GW — guidance на конец 2026, не realized contracted power; факт по actual contracted power не раскрыт отдельно.
      Capital_Intensity:
        name: Capital Intensity
        name_ru: капиталоёмкость (capex к выручке)
        states:
          K0:
            name: normalized
            criteria: quarterly capex/revenue < 1x
            criteria_provenance: model_assumption
          K1:
            name: expansion
            criteria: capex/revenue >= 1x and < 3x
            criteria_provenance: model_assumption
          K2:
            name: aggressive_expansion
            criteria: capex/revenue >= 3x and < 6x
            criteria_provenance: model_assumption
          K3:
            name: extreme_but_prefunded
            criteria: capex/revenue >= 6x AND prepayment coverage >= 40% AND AI cloud adjusted EBITDA > 0
            criteria_provenance: model_assumption
          K4:
            name: overbuild_financing_risk
            criteria: capex/revenue >= 6x AND (prepayment coverage < 30% OR AI cloud adjusted EBITDA margin < 15%) for 2 quarters
            criteria_provenance: model_assumption
        current: K3
        current_provenance: derived_fact
        current_evidence_refs:
        - src_q2_letter
      Funding_Liquidity:
        name: Funding Liquidity
        name_ru: финансирование и ликвидность
        states:
          F0:
            name: internally_funded
            criteria: no material external financing in trailing 12m AND cash >= 2x latest quarterly capex
            criteria_provenance: model_assumption
          F1:
            name: ample_liquidity
            criteria: cash >= 2x latest quarterly capex
            criteria_provenance: model_assumption
          F2:
            name: funded_expansion
            criteria: cash >= 1x latest quarterly capex AND external funding/prepayments actively support buildout
            criteria_provenance: model_assumption
          F3:
