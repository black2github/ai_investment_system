schema_package_version: '1.0'
artifact: Company Artifact Schema
json_schema_dialect: https://json-schema.org/draft/2020-12/schema
as_of: '2026-09-22'
status: proposed_normative
source_policy_ref: Source_Policy_v1.0 (Party 2; source-class enum provisionally frozen here)
provenance_schema_ref: Provenance_Schema_v1.0
files:
  states.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: states.yaml canonical artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - version
    - artifact
    - as_of
    - ticker
    - purpose
    - semantics
    - sources
    - axes
    properties:
      schema_version:
        const: '1.0'
      version:
        type: string
      artifact:
        type: string
      as_of:
        type: string
        format: date
      ticker:
        type: string
      source_artifact:
        type:
        - string
        - 'null'
      purpose:
        type: string
      semantics:
        type: object
        additionalProperties: false
        required:
        - evidence_required
        - pending_verification_blocks_transition
        - trigger_not_decision
        - numeric_thresholds_provenance
        properties:
          evidence_required:
            type: boolean
          pending_verification_blocks_transition:
            type: boolean
          trigger_not_decision:
            const: true
          numeric_thresholds_provenance:
            const: model_assumption
      sources:
        type: object
        minProperties: 1
        additionalProperties:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - source_class
            - url
            - as_of
            properties:
              source_class:
                type: string
                enum: &id001
                - regulatory_filing
                - issuer_ir_release
                - issuer_investor_presentation
                - issuer_transcript
                - first_tier_media
                - market_data_provider
                - other_primary
              url:
                type: string
                format: uri
              as_of:
                type: string
                format: date
              title:
                type:
                - string
                - 'null'
              document_type:
                type:
                - string
                - 'null'
          - type: string
            format: uri
            deprecated: true
            description: Legacy v0.x source URL scalar; migrate to source object.
      axes:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          additionalProperties: false
          required:
          - name
          - states
          - current
          - current_evidence
          - source_refs
          properties:
            name:
              type: string
            name_ru:
              type:
              - string
              - 'null'
            states:
              type: object
              minProperties: 2
              additionalProperties:
                type: object
                additionalProperties: false
                required:
                - name
                - criteria
                properties:
                  name:
                    type: string
                  criteria:
                    type: string
            current:
              type: string
            current_evidence:
              type: array
              items:
                type:
                - string
                - object
            source_refs:
              type: array
              items:
                type: string
            prior_snapshot:
              type:
              - string
              - 'null'
            current_note:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
  kpis.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: kpis.yaml canonical artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - version
    - artifact
    - as_of
    - ticker
    - max_critical_kpis
    - zone_semantics
    - critical_kpis
    properties:
      schema_version:
        const: '1.0'
      version:
        type: string
      artifact:
        type: string
      as_of:
        type: string
        format: date
      ticker:
        type: string
      max_critical_kpis:
        type: integer
        minimum: 1
      source_artifact:
        type:
        - string
        - 'null'
      zone_semantics:
        type: object
        additionalProperties: false
        required:
        - thresholds_provenance
        properties:
          thresholds_provenance:
            const: model_assumption
      source_policy:
        type: object
        deprecated: true
        description: Legacy embedded policy. Source Policy v1.0 becomes the normative external document in Party 2.
        additionalProperties: false
        properties:
          primary:
            type: array
            items:
              type: string
          secondary:
            type: array
            items:
              type: string
          rule:
            type: string
      critical_kpis:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - unit
          - period
          - thresholds
          - last_value
          - value_type
          - source_class
          - source_url
          - verified
          - provenance
          properties:
            id:
              type: string
            name:
              type: string
            unit:
              type: string
            period:
              type: string
            source:
              type:
              - string
              - 'null'
              deprecated: true
              description: Legacy shorthand source class; use source_class.
            source_class:
              type: string
              enum: *id001
            source_ref:
              type:
              - string
              - 'null'
            thresholds:
              type: object
              additionalProperties: false
              required:
              - green
              - yellow
              - red
              properties:
                green:
                  type: string
                yellow:
                  type: string
                red:
                  type: string
            last_value:
              type:
              - number
              - 'null'
            observation_qualifier:
              type: string
              enum:
              - exact
              - approximate
              - lower_bound
              - upper_bound
              - range
              - not_separately_disclosed
              - pending_verification
            value_range:
              type: object
              additionalProperties: false
              required:
              - min
              - max
              properties:
                min:
                  type: number
                max:
                  type: number
            last_date:
              type:
              - string
              - 'null'
              format: date
            source_url:
              type:
              - string
              - 'null'
              format: uri
            verified:
              type:
              - boolean
              - 'null'
            provenance:
              type: string
              enum: &id002
              - verified_fact
              - derived_fact
              - model_assumption
              - owner_judgment
              - normative_rule
              - external_methodology
            formula:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
            value_type:
              type: string
              enum:
              - actual
              - company_guidance
              - analyst_estimate
            target_date:
              type:
              - string
              - 'null'
              format: date
            verified_note:
              type:
              - string
              - 'null'
            verification_status:
              type:
              - string
              - 'null'
              enum:
              - pending_verification
              - not_separately_disclosed
              - null
            disclosure_status:
              type:
              - string
              - 'null'
            source_channel:
              type:
              - string
              - 'null'
            sec_mirror:
              type:
              - string
              - 'null'
              format: uri
            ir_document:
              type:
              - string
              - 'null'
              format: uri
            ir_landing_page:
              type:
              - string
              - 'null'
              format: uri
          allOf:
          - if:
              properties:
                provenance:
                  const: derived_fact
              required:
              - provenance
            then:
              required:
              - formula
          - if:
              properties:
                observation_qualifier:
                  const: range
              required:
              - observation_qualifier
            then:
              required:
              - value_range
              properties:
                last_value:
                  type: 'null'
          - if:
              properties:
                observation_qualifier:
                  enum:
                  - not_separately_disclosed
                  - pending_verification
              required:
              - observation_qualifier
            then:
              properties:
                last_value:
                  type: 'null'
      changelog:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - date
          - change
          properties:
            version:
              type:
              - string
              - 'null'
            date:
              type: string
              format: date
            change:
              type: string
  triggers.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: triggers.yaml canonical registry artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - meta
    - route
    - rules
    - triggers
    properties:
      schema_version:
        const: '1.0'
      meta:
        type: object
        additionalProperties: false
        required:
        - ticker
        - company
        - exchange
        - yahoo_symbol
        - registry_updated
        - source_artifact
        - price_source
        - price_at_registry
        - position
        properties:
          ticker:
            type: string
          company:
            type: string
          exchange:
            type: string
          yahoo_symbol:
            type: string
          registry_updated:
            type: string
          source_artifact:
            type:
            - string
            - 'null'
          price_source:
            type:
            - string
            - 'null'
          price_at_registry:
            type:
            - number
            - 'null'
          position:
            type:
            - string
            - 'null'
      automations:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            covers:
              type: array
              items:
                type: string
            cadence:
              type:
              - string
              - 'null'
            note:
              type:
              - string
              - 'null'
      route:
        type: object
        additionalProperties: false
        required:
        - steps
        properties:
          steps:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - kind
              - name
              properties:
                id:
                  type: string
                kind:
                  type: string
                name:
                  type: string
      rules:
        type: object
        additionalProperties: false
        required:
        - evidence_required
        - pending_verification_blocks_transition
        - trigger_not_decision
        properties:
          evidence_required:
            type: boolean
          pending_verification_blocks_transition:
            type: boolean
          trigger_not_decision:
            const: true
      triggers:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - class
          - step
          - status
          - fired
          properties:
            id:
              type: string
            class:
              type: string
              enum:
              - event
              - price
              - calendar
              - digest
            step:
              type: string
            axis:
              type:
              - string
              - 'null'
            transition:
              type: object
              additionalProperties: false
              required:
              - from
              - to
              properties:
                from:
                  type: string
                to:
                  type: string
            level:
              type:
              - string
              - 'null'
              enum:
              - E1
              - E2
              - E3
              - null
            kpis:
              type: array
              items:
                type: string
            condition:
              type:
              - string
              - 'null'
            condition_provenance:
              type:
              - string
              - 'null'
              enum:
              - model_assumption
              - normative_rule
              - null
            period:
              type:
              - string
              - 'null'
            source:
              type:
              - string
              - 'null'
            action:
              type:
              - string
              - 'null'
            automation:
              type:
              - string
              - 'null'
            status:
              type: string
              enum:
              - active
              - planned
              - due
              - done
              - dropped
            fired:
              type: array
              items: {}
            note:
              type:
              - string
              - 'null'
            notes:
              type:
              - string
              - 'null'
          allOf:
          - if:
              required:
              - transition
            then:
              required:
              - axis
              - level
              - kpis
              - condition
              - condition_provenance
  mpc_inputs.yaml:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: mpc_inputs.yaml canonical artifact
    type: object
    additionalProperties: false
    required:
    - schema_version
    - version
    - ticker
    - artifact
    - as_of
    - driver_exposure_vector
    - driver_vector_provenance
    - failure_modes
    - driver_taxonomy_version
    properties:
      schema_version:
        const: '1.0'
      version:
        type: string
      ticker:
        type: string
      artifact:
        const: mpc_inputs
      as_of:
        type: string
        format: date
      source_artifact:
        type:
        - string
        - 'null'
      driver_exposure_vector:
        type: object
        additionalProperties:
          type: integer
          minimum: -2
          maximum: 2
        minProperties: 1
      driver_vector_provenance:
