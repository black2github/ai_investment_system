  aiinfra-price-watch:  { covers: [], note: "6506-P-01..03 подключить ТОЛЬКО после срабатывания E-01/E-02" }

route:
  # Маршрут компании (степпер). current ведёт state.json → route.current; kind: stage | scenario.
  steps:
    - { id: watch, kind: stage, name: "Наблюдение: ждём подтверждающий триггер по отчёту" }
    - { id: entry, kind: stage, name: "Вход траншами ¥4 400 / ¥4 000 / ¥3 600 (7% / 7% / 6%) после подтверждения Robotics" }
    - { id: confirm, kind: stage, name: "Подтверждение тезиса по квартальным отчётам (условия -E-) и контроль поломки (-X-)" }
    - { id: hold, kind: stage, name: "Удержание до горизонта" }
    - { id: exit, kind: stage, name: "Фиксация и выход при капитализации ¥4 трлн / ¥5 трлн; горизонт 2030" }
    - { id: taiwan, kind: scenario, name: "Сценарий «Тайвань» (portfolio/_scenarios/taiwan.yaml)", ref: portfolio/_scenarios/taiwan.yaml }

triggers:

  # ---------- price: вход (условный, после подтверждения Robotics) ----------
  - id: 6506-P-01
    class: price
    step: entry
    condition: "6506 ≤ ¥4 400 — только после срабатывания 6506-E-01 или 6506-E-02"
    action: "Купить 7% портфеля (транш 1 из 3)"
    automation: null
    status: planned
    notes: "Не подключать к сторожу до подтверждения; иначе сторож сработает сразу (цена ¥4 299 на 17.09)"
  - id: 6506-P-02
    class: price
    step: entry
    condition: "6506 ≤ ¥4 000 — после триггера"
    action: "Купить 7% (транш 2 из 3)"
    automation: null
    status: planned
  - id: 6506-P-03
    class: price
    step: entry
    condition: "6506 ≤ ¥3 600 — после триггера"
    action: "Купить 6% (транш 3 из 3)"
    automation: null
    status: planned

  - id: 6506-F-01
    class: price
    step: exit
    condition: "market cap ≥ ¥4 трлн"
    action: "Продать 20% позиции"
    automation: null
    status: planned
  - id: 6506-F-02
    class: price
    step: exit
    condition: "market cap ≥ ¥5 трлн"
    action: "Продать ещё 30% позиции"
    automation: null
    status: planned

  # ---------- event: подтверждение (снимают статус «наблюдать») ----------
  - id: 6506-E-01
    class: event
    step: watch
    condition: "Robotics segment revenue ≥ +10% г/г два квартала подряд"
    action: "Перевести в статус «покупать»: подключить 6506-P-01..03; купить 7% при цене ≤ ¥4 400"
    source: "Yaskawa quarterly report (segment data)"
    automation: aiinfra-report-check
    status: active
    notes: "Q1 FY2027 по данным обсуждения: +2% — условие не выполнено; ближайшая проверка 09.10.2026"
  - id: 6506-E-02
    class: event
    step: confirm
    condition: "Robotics orders ≥ +15% г/г два квартала подряд"
    action: "То же, что 6506-E-01 (более сильный сигнал)"
    source: "Yaskawa quarterly report"
    automation: aiinfra-report-check
    status: active
  - id: 6506-E-03
    class: event
    step: watch
    condition: "Orders компании ≥ +15% г/г два квартала подряд"
    action: "Купить 6%"
    source: "Yaskawa quarterly report"
    automation: aiinfra-report-check
    status: active
    notes: "Q1 FY2027 по данным обсуждения: orders +29% — первый квартал условия"
  - id: 6506-E-04
    class: event
    step: confirm
    condition: "Гуманоиды: официальные данные о поставках ≥ сотен тысяч в год (Tesla / Figure / Agility / Unitree / IFR)"
    action: "Сообщить владельцу; усиливает тезис"
    source: "отчёты Tesla, официальные раскрытия Figure AI / Agility / Unitree, IFR World Robotics"
    automation: aiinfra-news-watch
    status: active
    notes: "Единой статистики нет; по пресс-релизу «сотни тысяч» не засчитывать"
  - id: 6506-E-05
    class: event
    step: confirm
    condition: "Robotics orders/revenue в Китае ≥ +15% г/г два квартала подряд; отдельно China semiconductor/automation orders ≥ +20%"
