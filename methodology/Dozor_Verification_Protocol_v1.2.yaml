version: 1.2.0
artifact: dozor_verification_protocol
id: Dozor_Verification_Protocol_v1.2
as_of: '2026-09-23'
status: proposed_normative
supersedes: Dozor_Verification_Protocol_v1.1
backward_compatibility: Report schema accepts protocol_version 1.0.0, 1.1.0 and 1.2.0; v1.2-only authoring rules do not retroactively invalidate old semantics.
gate: G8_SOURCE_VERIFICATION
source_policy_ref: Source_Policy_v1.0
artifact_schema_ref: Company_Artifact_Schema_v1.0.5
storage:
  report_path: portfolio/<ticker>/_verify/<run_id>.json
  immutable: true
  report_as_of: date-time of verification run
  source_as_of: date of source publication/filing
  source_recorded_at: optional date-time when source registry record was written
status_registry:
  kpi:
    verified_match:
      label_ru: подтверждено
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
    verified_match_with_normalization:
      label_ru: подтверждено с нормализацией
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
    mismatch_value:
      label_ru: расхождение значения
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
    mismatch_period:
      label_ru: расхождение периода
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
    mismatch_semantics:
      label_ru: расхождение смысла
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
    formula_mismatch:
      label_ru: формула не сходится
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
    source_not_allowed:
      label_ru: источник не допускается
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
    source_unavailable_technical:
      label_ru: источник недоступен технически
      runtime_verified: null
      gate_effect: BLOCKED_TECHNICAL
      default_patch_required: false
    source_conflict:
      label_ru: источники противоречат
      runtime_verified: null
      gate_effect: BLOCKED_SOURCE_CONFLICT
      default_patch_required: false
    not_disclosed:
      label_ru: компания не раскрывает
      runtime_verified: true
      gate_effect: conditional_pass
      default_patch_required: false
    not_found:
      label_ru: в источнике не найдено
      runtime_verified: null
      gate_effect: conditional_pending_or_patch
      default_patch_required: false
  axis:
    state_supported:
      label_ru: текущее состояние подтверждено
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
    state_not_supported:
      label_ru: текущее состояние не подтверждается
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
    state_pending_verification:
      label_ru: состояние ожидает подтверждения
      runtime_verified: false
      gate_effect: conditional_pending_or_patch
      default_patch_required: false
    evidence_unavailable_technical:
      label_ru: свидетельство недоступно технически
      runtime_verified: null
      gate_effect: BLOCKED_TECHNICAL
      default_patch_required: false
    evidence_conflict:
      label_ru: свидетельства по состоянию противоречат
      runtime_verified: null
      gate_effect: BLOCKED_SOURCE_CONFLICT
      default_patch_required: false
  event:
    event_confirmed_primary:
      label_ru: событие подтверждено первоисточником
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
    event_confirmed_two_media:
      label_ru: событие подтверждено двумя СМИ первого ряда
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
    event_unconfirmed:
      label_ru: событие не подтверждено
      runtime_verified: false
      gate_effect: pending
      default_patch_required: false
    event_contradicted:
      label_ru: событие опровергнуто
      runtime_verified: false
      gate_effect: PATCH_REQUIRED
      default_patch_required: true
    source_unavailable_technical:
      label_ru: источник недоступен технически
      runtime_verified: null
      gate_effect: BLOCKED_TECHNICAL
      default_patch_required: false
    condition_not_met:
      label_ru: условие не выполнено
      runtime_verified: false
      gate_effect: pass
      default_patch_required: false
      semantics: Positive verified evidence shows the monitored condition is false; there is no asserted event to patch. In v1.2 new KPI-threshold transition checks should normally use
        transition_checks.result=not_met instead.
  transition_result:
    met:
      label_ru: условие выполнено
      runtime_verified: true
      gate_effect: pass
      default_patch_required: false
      semantics: Verified current evidence/history satisfies the trigger transition condition. Does not itself fire a trigger, change state or make an investment decision.
    not_met:
      label_ru: условие не выполнено
      runtime_verified: false
      gate_effect: pass
      default_patch_required: false
      semantics: Verified evidence positively shows the transition condition is false. Not pending and no patch required.
    pending_history:
      label_ru: ожидается история наблюдений
      runtime_verified: null
      gate_effect: pending
      default_patch_required: false
      semantics: Current-period evidence is insufficient only because a consecutive-period/history predicate still requires deterministic history evaluation.
  overall:
    PASS:
      label_ru: пройдено
    PASS_WITH_DECLARED_PENDING:
      label_ru: пройдено, есть заявленные ожидания
    PATCH_REQUIRED:
      label_ru: нужна правка
    BLOCKED_TECHNICAL:
      label_ru: заблокировано технически
    BLOCKED_SOURCE_CONFLICT:
      label_ru: 'заблокировано: источники противоречат'
report_sections:
  items: KPI verification.
  axis_items: Verification of current canonical axis states.
  transition_checks: Recurring KPI/history-based transition conditions; new in v1.2.
  event_items: Discrete event facts only in new v1.2 reports. Old v1.1 threshold-like event_items remain valid for backward compatibility.
transition_checks:
  authoring_rule: If a trigger condition can be evaluated from KPI items and/or deterministic observation history, represent it in transition_checks rather than event_items.
  result_rules:
    met: Condition is positively satisfied. G8 does not auto-fire trigger, auto-transition state or make investment decision.
    not_met: Positive verified evidence makes the condition false. It is a PASS condition, not pending.
    pending_history: Current observation is insufficient only because an N-period/history predicate still needs deterministic history evaluation.
  consecutive_periods:
    dozor_counts_periods: false
    owner: deterministic transition/state-history evaluator
    history_input: state.json.kpi_observations ordered by period_end
    rule: Dozor verifies observations; deterministic evaluator computes N consecutive periods. If current period alone falsifies an AND/consecutive predicate, result may be not_met without
      history.
event_verification:
  v1_2_event_scope: 'discrete_event only: launch, contract, regulatory decision, financing, acquisition, incident or other one-off fact.'
  condition_not_met:
    use: Compatibility/status option when an event-style monitored condition is positively false and there is no asserted event to patch.
    preferred_v1_2: For KPI threshold transitions use transition_checks.result=not_met instead.
  primary_rule: Allowed primary source -> event_confirmed_primary.
  two_media_rule: If no accessible primary source exists, two independent approved first-tier media identities are required for event_confirmed_two_media.
  fact_only: Event verification does not equal trigger firing, state transition or trade decision.
axis_verification:
  pending_canonical_state:
    rule: For current_state == pending_verification, v1.2 authoring uses criteria:null and non-empty pending_reason.
    criterion_checks: May be empty or may document why evidence is insufficient; do not invent a pseudo-state criterion.
    runtime: state_pending_verification with runtime_verified=false and patch_required=false when canonical state is already pending_verification.
window_entailment:
  rule: A narrower factual observation window may entail a broader criterion window only if the same metric/event population is used, the factual interval is wholly contained in the
    criterion interval, the criterion is a monotone lower-bound count/amount predicate, and the factual value already meets that threshold.
  example: 6 spacecraft within a 50-day interval entails >=3 spacecraft in a containing trailing-90-day interval.
  reverse_rule: A fact over a broader window does not prove the same count occurred within a narrower window.
  period_preservation: Never rename the fact period. Record entailment in criterion_checks.window_entailment/notes.
derived_fact_basis:
  v1_2_rule: found.value and found.unit/period must be normalized to the same basis as candidate.last_value for a derived_fact verification.
  source_components: Raw source-period components and intermediate arithmetic belong in normalization.steps/evidence excerpt.
  formula_recomputed_value: When present, it is also in candidate basis.
  backward_compatibility: Old v1.1 reports with source-basis found.value remain schema-valid but are not the preferred v1.2 authoring form.
qualifier_patch_suggested:
  scope: immutable_report_only
  runtime_rule: Do not write qualifier_patch_suggested to state.json.
  integration: Integrator may harmonize canonical/runtime observation_qualifier without changing numeric value or value_type, then append the Dozor run to verification_run_ids.
runtime_history:
  artifact_field: state.json.kpi_observations[].verification_run_ids
  latest_alias: state.json.kpi_observations[].verification_run_id
  deduplication_rule: If kpi_id, period_end and normalized value/value_range are unchanged, update existing observation and append run_id; do not duplicate the observation.
  latest_rule: verification_run_id == last(verification_run_ids) when history exists.
gate_aggregation:
  precedence:
  - BLOCKED_SOURCE_CONFLICT
  - BLOCKED_TECHNICAL
  - PATCH_REQUIRED
  - PASS_WITH_DECLARED_PENDING
  - PASS
  pending_sources:
  - KPI not_found only when candidate was already null+pending_verification
  - axis state_pending_verification without patch
  - event_unconfirmed
  - transition_checks.result=pending_history
  non_pending_pass:
  - event condition_not_met
  - transition result not_met
  - transition result met
  rule: If there are no blocked/patch/pending items, overall_status=PASS.
semantic_validation_rules:
- id: DZR-012
  applies_to: protocol_version=1.2.0
  rule: For derived_fact KPI, found.value/unit/period and formula_recomputed_value are expressed in candidate basis; raw source components are normalization steps.
- id: DZR-013
  applies_to: protocol_version=1.2.0
  rule: event_items.claim_type == discrete_event; KPI/history threshold transitions belong in transition_checks.
- id: DZR-014
  applies_to: protocol_version=1.2.0
  rule: If axis current_state == pending_verification, author criteria=null and pending_reason non-empty.
- id: DZR-015
  applies_to: all
  rule: condition_not_met and transition not_met are PASS/non-pending and patch_required=false.
- id: DZR-016
  applies_to: all
  rule: qualifier_patch_suggested is report-only and MUST NOT be written to state.json.
output_report_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://ai-investment-system.local/schemas/dozor-verification-report/1.2
  title: Dozor Verification Report v1.2
  type: object
  additionalProperties: false
  required:
  - protocol_version
  - run_id
  - ticker
  - as_of
  - inputs
  - items
  - summary
  properties:
    protocol_version:
      type: string
      enum:
      - 1.0.0
      - 1.1.0
      - 1.2.0
    run_id:
      type: string
      minLength: 1
    ticker:
      type: string
      minLength: 1
    as_of:
      type: string
      format: date-time
      description: Verification-run timestamp, not document as_of.
    inputs:
      type: object
      additionalProperties: false
      required:
      - kpis_ref
      - source_registry_ref
      - evidence_pack_ref
      properties:
        kpis_ref:
          type: string
        source_registry_ref:
          type: string
        evidence_pack_ref:
          type:
          - string
          - 'null'
        artifact_schema_version:
          type:
          - string
          - 'null'
        state_ref:
          type:
          - string
          - 'null'
        triggers_ref:
          type:
          - string
          - 'null'
    items:
      type: array
      items:
        $ref: '#/$defs/kpi_item'
    axis_items:
      type: array
      items:
        $ref: '#/$defs/axis_item'
    event_items:
      type: array
      items:
        $ref: '#/$defs/event_item'
    transition_checks:
      type: array
      items:
        $ref: '#/$defs/transition_check'
    summary:
      type: object
      additionalProperties: false
      required:
      - overall_status
      - counts
      - patch_required_kpis
      - technical_blocked_kpis
      - pending_kpis
      properties:
        overall_status:
          type: string
          enum:
          - PASS
          - PASS_WITH_DECLARED_PENDING
          - PATCH_REQUIRED
          - BLOCKED_TECHNICAL
          - BLOCKED_SOURCE_CONFLICT
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        patch_required_kpis:
          type: array
          items:
            type: string
        technical_blocked_kpis:
          type: array
          items:
            type: string
        pending_kpis:
          type: array
          items:
            type: string
        qualifier_patch_suggested_kpis:
          type: array
          items:
            type: string
        axis_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        event_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        transition_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        patch_required_axes:
          type: array
          items:
            type: string
        technical_blocked_axes:
          type: array
          items:
            type: string
        pending_axes:
          type: array
          items:
            type: string
        patch_required_events:
          type: array
          items:
            type: string
        technical_blocked_events:
          type: array
          items:
            type: string
        pending_events:
          type: array
          items:
            type: string
        patch_required_transition_checks:
          type: array
          items:
            type: string
        pending_transition_checks:
          type: array
          items:
            type: string
  $defs:
    source_evidence:
      type: object
      additionalProperties: false
      required:
      - source_ref
      - source_class
      - url
      - technical_status
      properties:
        source_ref:
          type:
          - string
          - 'null'
        source_class:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
        technical_status:
          type: string
          enum:
          - accessible
          - unavailable_technical
          - not_attempted
        evidence_locator:
          type:
          - string
          - 'null'
        evidence_excerpt:
          type:
          - string
          - 'null'
          maxLength: 1800
        independent_source_identity:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
    window_entailment:
      type: object
      additionalProperties: false
      required:
      - fact_window_days
      - criterion_window_days
      - same_metric
      - fact_interval_contained
      - criterion_is_monotone_lower_bound
      - result
      properties:
        fact_window_days:
          type: integer
          minimum: 1
        criterion_window_days:
          type: integer
          minimum: 1
        same_metric:
          type: boolean
        fact_interval_contained:
          type: boolean
        criterion_is_monotone_lower_bound:
          type: boolean
        result:
          type: string
          enum:
          - entails
          - does_not_entail
        notes:
          type:
          - string
          - 'null'
    criterion_check:
      type: object
      additionalProperties: false
      required:
      - expression
      - result
      - evidence_kpi_refs
      properties:
        expression:
          type: string
        result:
          type:
          - boolean
          - 'null'
        evidence_kpi_refs:
          type: array
          items:
            type: string
        calculation:
          type:
          - string
          - 'null'
        window_entailment:
          $ref: '#/$defs/window_entailment'
        notes:
          type:
          - string
          - 'null'
    kpi_item:
      type: object
      additionalProperties: false
      required:
      - kpi_id
      - status
      - candidate
      - source_check
      - found
      - normalization
      - runtime_verified
      - patch_required
      properties:
        kpi_id:
          type: string
        status:
          type: string
          enum:
          - verified_match
          - verified_match_with_normalization
          - mismatch_value
          - mismatch_period
          - mismatch_semantics
          - formula_mismatch
          - source_not_allowed
          - source_unavailable_technical
          - source_conflict
          - not_disclosed
          - not_found
        candidate:
          type: object
          additionalProperties: true
          required:
          - last_value
          - value_type
          - observation_qualifier
          - unit
          - period
        source_check:
          type: object
          additionalProperties: false
          required:
          - source_ref
          - source_class
          - url
          - allowed_by_policy
          - technical_status
          properties:
            source_ref:
              type:
              - string
              - 'null'
            source_class:
              type:
              - string
              - 'null'
            url:
              type:
              - string
              - 'null'
            allowed_by_policy:
              type:
              - boolean
              - 'null'
            technical_status:
              type: string
              enum:
              - accessible
              - unavailable_technical
              - not_attempted
            technical_error:
              type:
              - string
              - 'null'
            evidence_locator:
              type:
              - string
              - 'null'
            evidence_excerpt:
              type:
              - string
              - 'null'
              maxLength: 1800
        found:
          type: object
          additionalProperties: false
          required:
          - value
          - value_type
          - observation_qualifier
          - unit
          - period
          properties:
            value:
              type:
              - number
              - 'null'
            value_range:
              type:
              - object
              - 'null'
              additionalProperties: false
              properties:
                min:
                  type:
                  - number
                  - 'null'
                max:
                  type:
                  - number
                  - 'null'
            value_type:
              type:
              - string
              - 'null'
              enum:
              - actual
              - company_guidance
              - analyst_estimate
              - null
            observation_qualifier:
              type:
              - string
              - 'null'
              enum:
              - exact
              - approximate
              - lower_bound
              - upper_bound
              - range
              - not_separately_disclosed
              - pending_verification
              - null
            unit:
              type:
              - string
              - 'null'
            period:
              type:
              - string
              - 'null'
            formula_recomputed_value:
              type:
              - number
              - 'null'
        normalization:
          type: object
          additionalProperties: false
          required:
          - applied
          - steps
          properties:
            applied:
              type: boolean
            steps:
              type: array
              items:
                type: string
            numeric_difference:
              type:
              - number
              - 'null'
            relative_difference:
              type:
              - number
              - 'null'
        qualifier_patch_suggested:
          type: boolean
          default: false
        mismatch_reason:
          type:
          - string
          - 'null'
        runtime_verified:
          type:
          - boolean
          - 'null'
        patch_required:
          type: boolean
        notes:
          type:
          - string
          - 'null'
    axis_item:
      type: object
      additionalProperties: false
      required:
      - axis_id
      - current_state
      - criteria
      - criteria_provenance
      - evidence_type
      - status
      - kpi_item_refs
      - source_evidence
      - criterion_checks
      - runtime_verified
      - patch_required
      properties:
        axis_id:
          type: string
        current_state:
          type: string
        prior_snapshot:
          type:
          - string
          - 'null'
        criteria:
          type:
          - string
          - 'null'
        pending_reason:
          type:
          - string
          - 'null'
        criteria_provenance:
          type:
          - string
          - 'null'
        evidence_type:
          type:
          - string
          - 'null'
          enum:
          - quantitative
          - qualitative_primary_source
          - mixed
          - derived_binary
          - null
        status:
          type: string
          enum:
          - state_supported
          - state_not_supported
          - state_pending_verification
          - evidence_unavailable_technical
          - evidence_conflict
        kpi_item_refs:
          type: array
          items:
            type: string
        source_evidence:
          type: array
          items:
            $ref: '#/$defs/source_evidence'
        criterion_checks:
          type: array
          items:
            $ref: '#/$defs/criterion_check'
        history_evaluation_ref:
          type:
          - string
          - 'null'
        runtime_verified:
          type:
          - boolean
          - 'null'
        patch_required:
          type: boolean
        notes:
          type:
          - string
          - 'null'
    event_item:
      type: object
      additionalProperties: false
      required:
      - trigger_id
      - trigger_family
      - event_claim
      - status
      - primary_sources
      - media_sources
      - fact_only
      - runtime_verified
      - patch_required
      - runtime_targets
      properties:
        trigger_id:
          type: string
        trigger_family:
          type: string
          enum:
          - E
          - X
        claim_type:
          type: string
          enum:
          - discrete_event
          - kpi_threshold_check
        event_claim:
          type: string
        event_date:
          type:
          - string
          - 'null'
          format: date
        status:
          type: string
          enum:
          - event_confirmed_primary
          - event_confirmed_two_media
          - event_unconfirmed
          - event_contradicted
          - source_unavailable_technical
          - condition_not_met
        primary_sources:
          type: array
          items:
            $ref: '#/$defs/source_evidence'
        media_sources:
          type: array
          items:
            $ref: '#/$defs/source_evidence'
        fact_only:
          const: true
        runtime_verified:
          type:
          - boolean
          - 'null'
        patch_required:
          type: boolean
        runtime_targets:
          type: array
          items:
            type: string
            enum:
            - events_reported
            - fired
        notes:
          type:
          - string
          - 'null'
    transition_check:
      type: object
      additionalProperties: false
      required:
      - trigger_id
      - axis
      - transition
      - condition
      - kpi_item_refs
      - history_evaluation_ref
      - result
      - runtime_verified
      - patch_required
      properties:
        trigger_id:
          type: string
        axis:
          type: string
        transition:
          type: object
          additionalProperties: false
          required:
          - from
          - to
          properties:
            from:
              type: string
            to:
              type: string
        condition:
          type: string
        kpi_item_refs:
          type: array
          items:
            type: string
        event_item_refs:
          type: array
          items:
            type: string
        history_evaluation_ref:
          type:
          - string
          - 'null'
        result:
          type: string
          enum:
          - met
          - not_met
          - pending_history
        runtime_verified:
          type:
          - boolean
          - 'null'
        patch_required:
          type: boolean
        notes:
          type:
          - string
          - 'null'
  allOf:
  - if:
      properties:
        protocol_version:
          const: 1.2.0
      required:
      - protocol_version
    then:
      properties:
        event_items:
          items:
            required:
            - claim_type
            properties:
              claim_type:
                const: discrete_event
