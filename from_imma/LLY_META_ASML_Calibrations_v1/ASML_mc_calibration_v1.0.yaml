  - CHINA_REVENUE
  - TAIWAN_SUPPLY
  - INDUSTRIAL_RESHORING
  company_idiosyncratic_factors:
  - id: ASML_EXECUTION
    distribution: standard_normal
    persistence: 0.58
    persistence_meta:
      provenance: model_assumption
      rationale: WFE, AI/memory demand, export and supply conditions persist across adjacent quarters.
  path_alignment:
    use_global_path_id: true
driver_parameter_mapping:
- driver_id: AI_COMPUTE_DEMAND
  material: true
  stochastic_targets:
  - path: revenue_model.segments.EUV_Systems.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.015
    lag_quarters: 1
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: AI compute demand supports leading-edge logic lithography.
  - path: revenue_model.segments.InstalledBaseManagement.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.005
    lag_quarters: 2
    decay_half_life_quarters: 8.0
    meta:
      provenance: model_assumption
      rationale: Higher utilization/fleet growth supports service/upgrades.
  structural_support:
  - path: revenue_model.segments.EUV_Systems.initial_growth.mode
    contribution: 0.012
    meta:
      provenance: model_assumption
      rationale: Central EUV growth assumes sustained advanced-node AI demand.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1.0
      meta:
        provenance: model_assumption
        rationale: Adverse direction follows the sign of the accepted MPC driver exposure.
  note: 'common_cause_id: HYPERSCALER_CAPEX_SLOWDOWN / CUSTOMER_CAPEX_CONCENTRATION; ASML-FM-07/04.'
