drawdowns:
  equity:
    lookback: "12M rolling"
    formula: "price / rolling_12m_max_price - 1"
    benchmark: "own_security"
  portfolio:
    lookback: "since_inception"
    formula: "NAV / running_max_NAV - 1"
    benchmark: "PORTFOLIO_NAV"
  sector:
    lookback: "12M rolling"
    formula: "sector_index / rolling_12m_max_sector_index - 1"
    benchmark: "benchmark_registry.sectors[sector_id]"

  severity:
    WATCH:
      threshold: -0.15
      provenance: model_assumption
    STRESS:
      threshold: -0.25
      provenance: model_assumption
    SHOCK:
      threshold: -0.40
      provenance: model_assumption

regime_engine:
  evaluation_frequency: daily
  inputs:
    - portfolio_drawdown
    - weighted_sector_drawdown
    - breadth_of_position_drawdowns
    - cross_asset_correlation
  regimes:
    Normal:
      condition: >
        portfolio_drawdown > -0.15
        AND weighted_sector_drawdown > -0.20
        AND fraction_positions_drawdown_le_-0.25 < 0.25
      provenance: model_assumption

    Stress:
      condition: >
        (portfolio_drawdown <= -0.15 AND portfolio_drawdown > -0.30)
        OR (weighted_sector_drawdown <= -0.20 AND weighted_sector_drawdown > -0.35)
        OR fraction_positions_drawdown_le_-0.25 >= 0.25
      provenance: model_assumption

    Shock:
      condition: >
        portfolio_drawdown <= -0.30
        OR weighted_sector_drawdown <= -0.35
        OR fraction_positions_drawdown_le_-0.40 >= 0.25
      provenance: model_assumption

  precedence: [Shock, Stress, Normal]
  rule: "Если выполнены условия нескольких режимов, применяется наиболее тяжёлый."

war_economy_interface:
  enabled: true
  rule: >
    WAR-ECONOMY и иные тематические сценарии не определяются одной ценовой просадкой.
    Они передают в портфельный движок отдельный scenario_id и проверенные события;
    режим рынка Normal/Stress/Shock хранится независимо.
  scenario_id: null
  evidence_refs: []

