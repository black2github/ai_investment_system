legacy_reference_coverage:
  reference: ima-foundation-to-llm/portfolio_nbis/*
  coverage_requirement: Every structural field path in the five reference files must match a field_catalog path.
  known_value_migrations:
  - kpis.yaml NBIS-KPI-06 legacy last_value=[0.5,0.6] -> v1 last_value:null + observation_qualifier:range + value_range
  - kpis.yaml NBIS-KPI-07 legacy last_value='>40' -> v1 last_value:40 + observation_qualifier:lower_bound
  - state.json analogous kpi_observations range/lower-bound values require the same normalization
  - 'new v1 required metadata: schema_version, KPI source_class/provenance/value_type, trigger condition_provenance, runtime observation provenance'
  patch_validation_basis:
    workspace_snapshot: S0 / git commit df6029d
    models_in_patch_report: 13
    spcx_included: false
    report_ref: ima-party1.validation-report.md
title: Company Artifact Schema Package v1.0.5
supersedes: Company Artifact Schema v1.0.4
patch_scope: 'Minimal Dozor v1.2 companion patch: add kpi_observations[].verification_run_ids history list. All other v1.0.4 semantics unchanged; Candidate Schema remains v1.0.1.'
publication_note: Editorial consolidated republication of accepted v1.0.5. Embedded file schemas remain exactly v1.0.5; no portfolio migration/version bump is required. Restores omitted
  migration-history block MIG-117..120.
known_migrations_v1_0_to_v1_0_1:
- id: MIG-101-SCHEMA-VERSION
  action: set_schema_version
  from: 1.0_or_missing
  to: 1.0.1
  scope: all canonical company files
- id: MIG-102-SOURCE-SCALAR
  action: wrap_source_scalar
  scope: states.yaml.sources.*
  rule: string URL -> object{url:<same>, source_class:<resolved by Source Policy>, as_of:<document date>}; preserve source key
- id: MIG-103-SOURCE-OBJECT-ENRICH
  action: enrich_source_object
  scope: states.yaml.sources.*
  rule: existing {url,type,...} remains object; add source_class and as_of; keep type first-class
- id: MIG-104-THRESHOLD-PROVENANCE-RENAME
  action: rename_if_target_absent
  from: states.yaml.semantics.thresholds_provenance
  to: states.yaml.semantics.numeric_thresholds_provenance
- id: MIG-105-VALUE-TYPE-QUALIFIER
  action: split_value_type_and_qualifier
  scope:
  - kpis.yaml.critical_kpis[]
  - state.json.kpi_observations[]
  rule: legacy value_type in {lower_bound,upper_bound,approximate} -> observation_qualifier=<legacy>; value_type=actual
- id: MIG-106-BINARY-THRESHOLDS
  action: mark_binary_when_semantically_proven
  scope: kpis.yaml.critical_kpis[].thresholds
  rule: if accepted KPI is binary and yellow zone is absent, set thresholds.binary=true; do not infer binary from missing yellow without known KPI semantics
- id: MIG-107-AUTOMATIONS-NOTE
  action: move_field
  from: triggers.yaml.automations._note
  to: triggers.yaml.automations_note
- id: MIG-108-NOTES-LIST
  action: normalize_scalar_to_list
  scope: state.json.notes
  rule: string -> [string]; null -> [] if workspace convention requires materialized list
- id: MIG-109-TRIGGER-PROFILE
  action: add_profile
  scope: triggers.yaml.profile
  rule: full_model if canonical company states/kpis/mpc exist; registry_only otherwise
- id: MIG-110-FULL-MODEL-TRIGGER-DEFAULTS
  action: add_required_full_model_fields
  scope: triggers.yaml
  rule: for profile=full_model populate rules and canonical meta fields from workspace/integrator; each trigger gets fired:[] if absent
- id: MIG-111-DATE-NORMALIZATION
  action: pre_validation_normalization
  scope: all date/date-time fields
  rule: YAML native date/datetime objects are serialized to ISO-8601 strings before JSON Schema validation; semantic date is unchanged
known_migrations_v1_0_1_to_v1_0_2:
- id: MIG-112-SCHEMA-VERSION
  action: set_schema_version
  from: 1.0.1
  to: 1.0.2
  scope: all canonical company files
- id: MIG-113-OWNER-REGISTRY-FIELDS
  action: preserve_first_class_fields
  scope:
  - triggers.yaml.meta.target_weight
  - triggers.yaml.meta.lot
  - triggers.yaml.triggers[].priority
  rule: Preserve existing owner registry values verbatim; do not normalize, infer or overwrite.
known_migrations_v1_0_2_to_v1_0_3:
- id: MIG-114-SCHEMA-VERSION
  action: set_schema_version
  from: 1.0.2_or_pre_bump_workspace
  to: 1.0.3
  scope: all canonical company files
- id: MIG-115-PAUSED-STATUS
  action: preserve_existing_enum_value
  scope: triggers.yaml.triggers[].status
  rule: Existing status=paused is retained verbatim; no transition, ID, condition, note or previous-status text is changed. Paused trigger remains monitored/logged but does not emit
    action notification or execute action.
- id: MIG-116-VERIFICATION-LINKAGE
  action: no_backfill_required
  scope:
  - state.json.verification
  - state.json.kpi_observations[].verification_run_id
  rule: Fields are optional runtime outputs. Do not fabricate historical run_id values. Populate only for verification runs performed under Dozor Verification Protocol v1.0+.
known_migrations_v1_0_3_to_v1_0_4:
- id: MIG-117-SCHEMA-VERSION
  action: set_schema_version
  from: 1.0.3
  to: 1.0.4
  scope: all canonical company files
- id: MIG-118-SOURCE-RECORDED-AT
  action: no_fabricated_backfill
  scope: states.yaml.sources.*.recorded_at
  rule: Field is optional. For future source registry writes, set the actual workspace-record timestamp. Do not reuse source as_of. Historical backfill only if deterministically recoverable
    from repository history.
- id: MIG-119-AXIS-VERIFICATION-LINK
  action: legacy_unlinked
  scope: state.json.scenario_state.*
  rule: Existing verified flags without verification_run_id are preserved but are not considered Dozor-protocol-verified until a v1.1 axis_item is run.
- id: MIG-120-EVENT-VERIFICATION-LINK
  action: no_backfill_required
  scope:
  - state.json.events_reported[]
  - state.json.fired[]
  rule: Add verification_run_id only for events verified by Dozor v1.1+; do not invent historical run IDs.
known_migrations_v1_0_4_to_v1_0_5:
- id: MIG-121-SCHEMA-VERSION
  action: set_schema_version
  from: 1.0.4
  to: 1.0.5
  scope: all canonical company files
- id: MIG-122-KPI-VERIFICATION-RUN-HISTORY
  action: seed_and_append_history
  scope: state.json.kpi_observations[]
  rule: If verification_run_id is non-null and verification_run_ids is absent, initialize verification_run_ids=[verification_run_id]. On later re-verification of the same kpi_id+period_end+normalized
    value/value_range, do not duplicate the observation; append run_id if new and set verification_run_id to the latest. Older historical run IDs may be backfilled only when deterministically
    recoverable from immutable reports/git; never guess.
