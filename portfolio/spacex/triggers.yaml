    action: "Зафиксировать переход AI compute A2→A4 в state.json (state_transitions, scenario_state) и отправить Decision Request владельцу; инвестиционное действие не предопределено"
    automation: spacex-report-check
    status: active
    notes: "Переход состояния оси AI compute: A2→A4. Период подтверждения: два квартала подряд."

  - id: SPCX-E-14
    class: event
    step: vector
    axis: AI
    transition: { from: A3, to: A4 }
    level: E2
    kpis: [SPCX-KPI-01, SPCX-KPI-03, SPCX-KPI-09]
