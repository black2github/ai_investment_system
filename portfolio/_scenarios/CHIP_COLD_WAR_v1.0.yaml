schema_version: '1.0'
scenario_id: CHIP_COLD_WAR
description: 'US–China semiconductor technology race: Western subsidized capacity buildout, uncertain 3–5Y parity boundary,
  then persistent bifurcated production systems and accelerator price competition.'
status: proposed_normative
mutual_exclusion_set: GEOTECH_REGIME_8Y_V1
probability: 0.07
probability_status: owner_judgment
probability_meta:
  provenance: owner_judgment
  rationale: "Owner judgment 2026-09-25 (DR-2026-09-25-01): 0.07 = intersection of owner estimates (full chain 3-7%, leading-edge parity 5-10%); the semiconductor/military-AI race itself is treated as BASE (~90% already under way), so BASE 0.83 = race continues without parity and without Taiwan seizure. Review rule: CW-F01..F06 + owner watch list; each reissue; at least quarterly."
phases:
- phase_id: RACE_TO_PARITY
  name: Race before technological parity
  effective_from:
    kind: fixed_quarter
    anchor: t0
    quarter: 0
    meta:
      provenance: model_assumption
      rationale: Scenario is conditioned on an ongoing strategic race at t0.
  ramp_quarters: 2
  duration_quarters: until_next_phase
  decay_quarters: 0
  driver_overrides:
    SEMICONDUCTOR_WFE:
      mean_shift_sigma: 1.0
      volatility_multiplier: 1.2
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Western and Chinese fab buildout raises equipment cycle.
    INDUSTRIAL_RESHORING:
      mean_shift_sigma: 1.0
      volatility_multiplier: 1.15
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Sovereign localization accelerates.
    GOVERNMENT_DEFENSE:
      mean_shift_sigma: 0.75
      volatility_multiplier: 1.15
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Defense/strategic procurement rises.
    HYPERSCALER_CAPEX:
      mean_shift_sigma: 0.75
      volatility_multiplier: 1.2
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: AI infrastructure race sustains capex.
    DATA_CENTER_POWER:
      mean_shift_sigma: 0.5
      volatility_multiplier: 1.15
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Power infrastructure buildout follows compute investment.
    INTEREST_RATES:
      mean_shift_sigma: 0.25
      volatility_multiplier: 1.1
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Fiscal/industrial investment pressure modestly raises rate environment.
    CHINA_REVENUE:
      mean_shift_sigma: -0.25
      volatility_multiplier: 1.15
      persistence_override: 0.75
      meta:
        provenance: model_assumption
        rationale: Export controls mildly reduce cross-border addressability.
    TAIWAN_SUPPLY:
      mean_shift_sigma: 0.0
      volatility_multiplier: 1.1
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: No physical Taiwan supply impairment is assumed before parity.
    AI_CLOUD_PRICING:
      mean_shift_sigma: 0.0
      volatility_multiplier: 1.1
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Compute service pricing not yet structurally reset.
    ACCELERATOR_PRICE_COMPETITION:
      mean_shift_sigma: 0.25
      volatility_multiplier: 1.2
      persistence_override: 0.75
      meta:
        provenance: model_assumption
        rationale: Competition rises but parity has not yet been reached.
  root_correlation_overrides:
  - root_a: AI_CAPEX_CYCLE
    root_b: POWER_BUILDOUT
    correlation: 0.55
    meta:
      provenance: model_assumption
      rationale: Compute and power buildout become more synchronized.
  - root_a: AI_CAPEX_CYCLE
    root_b: SEMI_SUPPLY_HEALTH
    correlation: 0.4
    meta:
      provenance: model_assumption
      rationale: Capex race depends more on semiconductor supply capability.
  meta:
    provenance: model_assumption
    rationale: Phase 1 encodes the owner thesis of strategic subsidy/capacity race before parity.
- phase_id: PARITY_BOUNDARY
  name: Technology parity boundary and repricing
  effective_from:
    kind: triangular_quarter
    anchor: t0
    min: 12
    mode: 16
    max: 20
    meta:
      provenance: model_assumption
      rationale: Owner thesis explicitly states a 3–5 year lag; triangular q12/q16/q20 encodes that uncertainty without selecting
        a point estimate.
  ramp_quarters: 2
  duration_quarters: 4
  decay_quarters: 0
  driver_overrides:
    SEMICONDUCTOR_WFE:
      mean_shift_sigma: 1.5
      volatility_multiplier: 1.5
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Both systems accelerate equipment investment around parity.
    INDUSTRIAL_RESHORING:
      mean_shift_sigma: 1.5
      volatility_multiplier: 1.35
      persistence_override: 0.9
      meta:
        provenance: model_assumption
        rationale: Western localization response intensifies.
    GOVERNMENT_DEFENSE:
      mean_shift_sigma: 1.25
      volatility_multiplier: 1.3
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Strategic/defense procurement intensifies.
    HYPERSCALER_CAPEX:
      mean_shift_sigma: 1.0
      volatility_multiplier: 1.4
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: AI infrastructure spending remains elevated but more volatile.
    DATA_CENTER_POWER:
      mean_shift_sigma: 0.75
      volatility_multiplier: 1.3
      persistence_override: 0.9
      meta:
        provenance: model_assumption
        rationale: Power buildout accelerates with duplicated compute systems.
    INTEREST_RATES:
      mean_shift_sigma: 0.5
      volatility_multiplier: 1.2
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Investment/fiscal intensity raises rate pressure.
    CHINA_REVENUE:
      mean_shift_sigma: -1.0
      volatility_multiplier: 1.5
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Technology/export-control bifurcation reduces cross-border revenue.
    TAIWAN_SUPPLY:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.4
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Negative shift represents access friction/duplication risk, not loss of Taiwan strategic value.
    AI_CLOUD_PRICING:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.35
      persistence_override: 0.75
      meta:
        provenance: model_assumption
        rationale: Cheaper compute begins to pressure service pricing/economics.
    ACCELERATOR_PRICE_COMPETITION:
      mean_shift_sigma: 1.0
      volatility_multiplier: 1.6
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Parity sharply increases accelerator price/performance competition.
  root_correlation_overrides:
  - root_a: AI_CAPEX_CYCLE
    root_b: POWER_BUILDOUT
    correlation: 0.6
    meta:
      provenance: model_assumption
      rationale: Duplicated systems tightly couple compute and power investment.
  - root_a: AI_CAPEX_CYCLE
    root_b: SEMI_SUPPLY_HEALTH
    correlation: 0.5
    meta:
      provenance: model_assumption
      rationale: Parity-boundary capex is supply capability dependent.
  - root_a: SEMI_SUPPLY_HEALTH
    root_b: CHINA_MARKET_ACCESS
    correlation: 0.05
    meta:
      provenance: model_assumption
      rationale: Technology capability and cross-border market access begin decoupling.
  meta:
    provenance: model_assumption
    rationale: Phase 2 is deliberately volatile and temporary; it is the boundary the owner explicitly asked to study.
- phase_id: TWO_SYSTEMS
  name: Persistent Western and Chinese semiconductor systems
  effective_from:
    kind: triangular_quarter
    anchor: phase:PARITY_BOUNDARY
    min: 4
    mode: 4
    max: 4
    meta:
      provenance: model_assumption
      rationale: Phase 3 starts after a four-quarter parity-boundary repricing window.
  ramp_quarters: 4
  duration_quarters: until_end
  decay_quarters: 0
  driver_overrides:
    SEMICONDUCTOR_WFE:
      mean_shift_sigma: 1.0
      volatility_multiplier: 1.25
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Duplicated supply chains keep equipment demand above BASE.
    INDUSTRIAL_RESHORING:
      mean_shift_sigma: 1.25
      volatility_multiplier: 1.2
      persistence_override: 0.9
      meta:
        provenance: model_assumption
        rationale: Strategic localization persists.
    GOVERNMENT_DEFENSE:
      mean_shift_sigma: 1.0
      volatility_multiplier: 1.2
      persistence_override: 0.85
      meta:
        provenance: model_assumption
        rationale: Defense/sovereign compute demand remains elevated.
    HYPERSCALER_CAPEX:
      mean_shift_sigma: 0.75
      volatility_multiplier: 1.2
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Western AI buildout remains structurally above BASE.
    DATA_CENTER_POWER:
      mean_shift_sigma: 0.75
      volatility_multiplier: 1.2
      persistence_override: 0.9
      meta:
        provenance: model_assumption
        rationale: Power infrastructure remains structurally elevated.
    INTEREST_RATES:
      mean_shift_sigma: 0.25
      volatility_multiplier: 1.1
      persistence_override: null
      meta:
        provenance: model_assumption
        rationale: Rate pressure moderates but stays above BASE.
    CHINA_REVENUE:
      mean_shift_sigma: -1.5
      volatility_multiplier: 1.35
      persistence_override: 0.9
      meta:
        provenance: model_assumption
        rationale: Cross-border technology revenue remains structurally impaired.
    TAIWAN_SUPPLY:
      mean_shift_sigma: -0.5
      volatility_multiplier: 1.2
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Supply-access friction remains; driver is not used as a proxy for Taiwan strategic relevance.
    AI_CLOUD_PRICING:
      mean_shift_sigma: -1.0
      volatility_multiplier: 1.2
      persistence_override: 0.8
      meta:
        provenance: model_assumption
        rationale: Cheaper non-Western chips pressure global compute service economics.
    ACCELERATOR_PRICE_COMPETITION:
      mean_shift_sigma: 1.5
      volatility_multiplier: 1.35
      persistence_override: 0.9
      meta:
        provenance: model_assumption
        rationale: Sustained two-system competition compresses accelerator economics.
  root_correlation_overrides:
  - root_a: AI_CAPEX_CYCLE
    root_b: POWER_BUILDOUT
    correlation: 0.55
    meta:
      provenance: model_assumption
      rationale: Persistent synchronized sovereign compute/power buildout.
  - root_a: AI_CAPEX_CYCLE
    root_b: SEMI_SUPPLY_HEALTH
    correlation: 0.45
    meta:
      provenance: model_assumption
      rationale: Buildout remains supply-capability dependent.
  - root_a: SEMI_SUPPLY_HEALTH
    root_b: CHINA_MARKET_ACCESS
    correlation: -0.1
    meta:
      provenance: model_assumption
      rationale: Two production systems can improve local supply health while cross-border market access remains poor.
  meta:
    provenance: model_assumption
    rationale: Persistent bifurcation, not an assumption that either bloc disappears.
fact_catalog:
- fact_id: CW-F01
  signal: SMIC/Chinese foundry disclosed process capability, production scale, yield or advanced-node revenue evidence narrowing
    the leading-edge gap.
  phase_relevance:
  - RACE_TO_PARITY
  - PARITY_BOUNDARY
  verification_status: pending_dozor
  preferred_sources:
  - SMIC annual/interim reports and exchange filings
  - official Chinese industry disclosures where metric is explicit
  fallback_sources:
  - Reuters
  note: If yield/process metric is not separately disclosed, record not_disclosed; do not infer.
- fact_id: CW-F02
  signal: New or tightened U.S./allied semiconductor export controls affecting advanced compute, equipment or China market
    access.
  phase_relevance:
  - RACE_TO_PARITY
  - PARITY_BOUNDARY
  - TWO_SYSTEMS
  verification_status: pending_dozor
  preferred_sources:
  - U.S. BIS / Federal Register
  - allied government export-control notices
  fallback_sources:
  - Reuters
  note: Link to EXPORT_CONTROLS_CHINA.
- fact_id: CW-F03
  signal: Government semiconductor/AI infrastructure subsidies, awards or procurement commitments in U.S./EU/China.
  phase_relevance:
  - RACE_TO_PARITY
  - PARITY_BOUNDARY
  - TWO_SYSTEMS
  verification_status: pending_dozor
  preferred_sources:
  - U.S. Department of Commerce CHIPS office
  - EU/Member State official award notices
  - official Chinese central/provincial notices where quantified
  fallback_sources:
  - Reuters
  note: Track amount, beneficiary and effective date; announcement != disbursement.
- fact_id: CW-F04
  signal: China share of semiconductor equipment demand/revenue and evidence of domestic WFE substitution.
  phase_relevance:
  - RACE_TO_PARITY
  - PARITY_BOUNDARY
  - TWO_SYSTEMS
  verification_status: pending_dozor
  preferred_sources:
  - ASML/AMAT/LRCX/KLAC issuer filings and earnings materials
  - Chinese listed WFE vendor filings
  fallback_sources:
  - Reuters
  note: Use issuer-reported geography/segment facts; do not synthesize undisclosed market share.
- fact_id: CW-F05
  signal: Observed accelerator price/performance competition from Chinese suppliers or material price compression in comparable
    accelerator classes.
  phase_relevance:
  - PARITY_BOUNDARY
  - TWO_SYSTEMS
  verification_status: pending_dozor
  preferred_sources:
  - issuer product/pricing disclosures
  - customer procurement disclosures
  fallback_sources:
  - Reuters
  note: This is the trigger family for ACCELERATOR_PRICE_COMPETITION; comparable product class must be explicit.
- fact_id: CW-F06
  signal: Material divergence of Western vs China semiconductor supply chains, including restricted cross-sales or duplicated
    fab capacity.
  phase_relevance:
  - PARITY_BOUNDARY
  - TWO_SYSTEMS
  verification_status: pending_dozor
  preferred_sources:
  - government export-control/customs publications
  - issuer capacity/geography disclosures
  fallback_sources:
  - Reuters
  note: Used for recalibration of bifurcation persistence, not for owner probability automatically.
links:
  common_causes:
  - TAIWAN_SUPPLY_DISRUPTION
  - EXPORT_CONTROLS_CHINA
  legacy_action_scenario_refs: []
notes:
- Owner thesis preserved in accompanying rationale verbatim.
- Probability remains pending_owner_judgment.
- TAIWAN_SUPPLY retains supply-health semantics; it is not redefined as Taiwan strategic value.
