schema_version: '1.0.1'
profile: registry_only
meta:
  ticker: "6506"
  exchange: TSE Prime
  yahoo_symbol: 6506.T
  currency: JPY
  lot: 100
  company: Yaskawa Electric
  status_in_basket: наблюдать до триггера (покупка только после 6506-E-01 или E-02)
  target_weight: "20%"
  horizon: '2030'
  strategy_source: https://chatgpt.com/share/6aabd184-f904-83ed-bc0e-2ebd7172c89b
  strategy_date: 2026-09-17
  registry_updated: 2026-09-17
  price_at_strategy: 4378
  fiscal_year: "март – конец февраля (FY2026 до 28.02.2027)"
  scenario: portfolio/_scenarios/taiwan.yaml

automations:
  aiinfra-report-check: { covers: [6506-E-01, 6506-E-02, 6506-E-03, 6506-E-05, 6506-X-01, 6506-X-02, 6506-X-03], cadence: "после отчёта 09.10.2026 (6506-C-01)" }
