# SPCX — дополнение к triggers.yaml: KPI-связи переходов
# Версия: 1.1-kpis
# Дата: 2026-09-20
# Назначение: добавить поле `kpis` в нормативные SPCX-E-10…SPCX-E-33.
# Все остальные поля существующих записей triggers.yaml сохраняются без изменений.
#
# Правило:
# - kpis содержит только KPI из kpis.yaml, непосредственно используемые condition.
# - [] означает, что переход основан на событии/расчётной метрике, которой нет в kpis.yaml.
# - calculated_metrics не являются KPI и указаны отдельно там, где это нужно для однозначности.

trigger_kpi_patch:

  SPCX-E-10:
    kpis: [SPCX-KPI-02]
    notes_kpi: "Вторая ветвь OR — non-cancellable cloud contracts >= $1B — не представлена отдельным KPI в kpis.yaml."

  SPCX-E-11:
    kpis: [SPCX-KPI-02, SPCX-KPI-03]

  SPCX-E-12:
    kpis: [SPCX-KPI-02, SPCX-KPI-03, SPCX-KPI-04]

  SPCX-E-13:
