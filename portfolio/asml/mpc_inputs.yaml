driver_interpretation:
  TAIWAN_SUPPLY:
    vector_score: 2
    exposure_type: demand/customer-geography rather than primary own-supply-chain exposure
    explanation: 'Healthy Taiwan leading-edge production and foundry capex are strongly positive for ASML demand. A Taiwan
      disruption would primarily hit ASML through customer fabs, shipment/service access and global semiconductor demand/capex.
      Do not interpret this score as saying ASML itself is fabricated in Taiwan.

      '
  HYPERSCALER_CAPEX:
    vector_score: 2
    exposure_type: indirect positive demand
    explanation: Hyperscaler AI capex drives leading-edge logic/HBM demand, which drives foundry/memory WFE and lithography
      intensity.
failure_modes:
- failure_id: ASML-FM-01
  name: Global wafer-fab equipment downturn / customer capex cuts
  common_cause_id: SEMICONDUCTOR_WFE_DOWNTURN
  severity: high
- failure_id: ASML-FM-02
  name: Taiwan foundry disruption reduces shipments, service access and leading-edge customer capex
  common_cause_id: TAIWAN_SUPPLY_DISRUPTION
  severity: critical
- failure_id: ASML-FM-03
  name: Export controls further restrict China shipments/service
  common_cause_id: EXPORT_CONTROLS_CHINA
  severity: high
- failure_id: ASML-FM-04
  name: TSMC/Samsung/Intel or major-memory customer capex concentration shock
  common_cause_id: CUSTOMER_CAPEX_CONCENTRATION
  severity: high
- failure_id: ASML-FM-05
  name: Critical single-source supplier disruption
  common_cause_id: SINGLE_SOURCE_SUPPLIER_DISRUPTION
  severity: critical
- failure_id: ASML-FM-06
  name: EUV/High-NA technology or industrialization delay
  common_cause_id: LITHOGRAPHY_TECHNOLOGY_EXECUTION
  severity: high
- failure_id: ASML-FM-07
  name: AI capex slowdown reduces advanced logic/HBM fab demand
  common_cause_id: HYPERSCALER_CAPEX_SLOWDOWN
  severity: high
- failure_id: ASML-FM-08
  name: Memory-cycle downturn reduces lithography demand
  common_cause_id: MEMORY_CYCLE_DOWNTURN
  severity: medium
