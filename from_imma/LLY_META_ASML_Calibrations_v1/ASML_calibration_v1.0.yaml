    balance_sheet.net_debt:
      provenance: derived_fact
      formula: 3.7197B debt - 7.5815B cash+short-term investments = -3.8618B net debt
    base_period.revenue_ttm:
      provenance: derived_fact
      formula: 32.6673B + 18.0934B - 15.4332B = 35.3275B EUR
      source_ref: 2026-02-25 | https://www.sec.gov/Archives/edgar/data/937966/000162828026011378/asml-20251231.htm; 2026-07-15 | https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm
    base_period.current_fcf_margin:
      provenance: derived_fact
      formula: '[-0.4815B OCF - (-6.7791B working-capital/tax timing) - 0.7018B PP&E - 0.0923B intangibles] / 18.0934B = 30.42%'
      source_ref: 2026-07-15 | https://www.sec.gov/Archives/edgar/data/937966/000162828026048235/statutoryinterimreport20.htm
    discount_rate:
      provenance: model_assumption
      rationale: Near-monopoly lithography economics and net cash reduce risk, while semiconductor cyclicality, export controls, Taiwan/customer concentration and technology execution
        remain material.
    terminal_fcf_margin:
      provenance: model_assumption
      rationale: Normalized FCF is anchored below gross/operating margins and allows continued R&D/capacity investment; no FX premium is inserted because calibration is fully in EUR.
    terminal_fcf_multiple:
      provenance: model_assumption
      rationale: Mature high-moat semiconductor-equipment FCF multiple with strong installed-base resilience but material cyclicality/geopolitical exposure; not fitted to price.
    margin_transition:
      provenance: model_assumption
      rationale: Stable mature normalized FCF; raw H1 OCF working-capital swing is not treated as structural economics.
