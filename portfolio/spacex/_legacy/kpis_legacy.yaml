supporting_metrics:
- id: SPCX-METRIC-01
  name: Contracted cloud sales (Cloud Services Agreements, non-cancellable)
  unit: USD B
  period: quarter-end
  source: SEC
  formula: Сумма законтрактованных продаж по CSA на конец периода
  used_by:
  - SPCX-E-10
  last_value: 14.1
  last_date: '2026-06-30'
  source_url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm
  note: 'из derived_checks.AI_contract_sales; порог перехода E-10: >= $1B'
- id: SPCX-METRIC-02
  name: Company revenue YoY
  unit: '%'
  period: quarter
  source: SEC
  formula: (Revenue_t / Revenue_t-4 - 1) * 100
  used_by:
  - SPCX-E-25
  last_value: 91.9
  last_date: '2026-06-30'
  last_value_raw: $7.814B vs год назад
  source_url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm
  note: значение +91.9% — из сценарной сессии другой LLM со ссылкой на релиз Q2; проверить по релизу при report-check
    Q3
- id: SPCX-METRIC-03
  name: Capex / revenue
  unit: '%'
  period: quarter
  source: SEC (расчёт из KPI-08 и выручки)
  formula: Total capex_t / Revenue_t * 100
  used_by:
  - SPCX-E-26
  last_value: 235.1
  last_date: '2026-06-30'
  last_value_raw: $18.369B / $7.814B
  source_url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm
  note: производная от KPI-08 и derived_checks.revenue_q2_2026
