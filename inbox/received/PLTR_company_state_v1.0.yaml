      current_value: 0.93
      unit: fraction
      source: "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000039/a2026q2ex991pressrelease.htm"
      zones: {green: ">=0.50", yellow: ">=0.25 and <0.50", red: "<0.25"}

    - id: PLTR-KPI-02
      name: "U.S. commercial revenue YoY"
      period: quarterly
      current_value: 1.49
      unit: fraction
      source: "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000039/a2026q2ex991pressrelease.htm"
