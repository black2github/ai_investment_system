triggers:
  items:
    - {id: PLTR-E-01, step: vector, status: planned, axis: US_Commercial_AIP_Monetization, transition: {from: C3, to: C4}, kpis: [PLTR-KPI-02, PLTR-KPI-05], condition: "U.S. commercial revenue YoY >=100% AND U.S. commercial RDV YoY >=100% for 2 consecutive quarters", period: "2 quarters", level: E2}
    - {id: PLTR-E-02, step: vector, status: planned, axis: US_Commercial_AIP_Monetization, transition: {from: C3, to: C2}, kpis: [PLTR-KPI-02, PLTR-KPI-05], condition: "U.S. commercial revenue YoY <100% OR RDV YoY <50% for 2 consecutive quarters", period: "2 quarters", level: E2}
    - {id: PLTR-E-03, step: vector, status: planned, axis: US_Government_Demand, transition: {from: G3, to: G4}, kpis: [PLTR-KPI-03], condition: "U.S. government revenue YoY >=90% for 2 consecutive quarters", period: "2 quarters", level: E2}
    - {id: PLTR-E-04, step: vector, status: planned, axis: US_Government_Demand, transition: {from: G3, to: G2}, kpis: [PLTR-KPI-03], condition: "U.S. government revenue YoY <60% for 2 consecutive quarters", period: "2 quarters", level: E2}
    - {id: PLTR-E-05, step: vector, status: planned, axis: Geographic_Concentration, transition: {from: I1, to: I2}, kpis: [PLTR-KPI-09], condition: "U.S. share of H1/TTM revenue <75%", period: "one semiannual/annual observation", level: E2}
    - {id: PLTR-E-06, step: vector, status: planned, axis: Geographic_Concentration, transition: {from: I1, to: I0}, kpis: [PLTR-KPI-09], condition: "U.S. share of H1/TTM revenue >=85%", period: "one semiannual/annual observation", level: E2}
    - {id: PLTR-E-07, step: vector, status: planned, axis: Profitability_Cash, transition: {from: P3, to: P4}, kpis: [PLTR-KPI-07, PLTR-KPI-08], condition: "GAAP operating margin >=40% AND adjusted FCF margin >=50% for 2 consecutive quarters", period: "2 quarters", level: E2}
    - {id: PLTR-E-08, step: vector, status: planned, axis: Profitability_Cash, transition: {from: P3, to: P2}, kpis: [PLTR-KPI-07, PLTR-KPI-08], condition: "GAAP operating margin <40% OR adjusted FCF margin <50% for 2 consecutive quarters", period: "2 quarters", level: E2}
    - {id: PLTR-E-09, step: vector, status: planned, axis: Contracted_Demand, transition: {from: R3, to: R4}, kpis: [PLTR-KPI-04, PLTR-KPI-06], condition: "U.S. commercial RDV >=$6B AND total quarterly TCV >=$3B for 2 consecutive quarters", period: "2 quarters", level: E2}
    - {id: PLTR-E-10, step: vector, status: planned, axis: Contracted_Demand, transition: {from: R3, to: R2}, kpis: [PLTR-KPI-04, PLTR-KPI-06], condition: "U.S. commercial RDV < $6B OR quarterly TCV < $3B for 2 consecutive quarters", period: "2 quarters", level: E2}

mpc_inputs:
  driver_exposure_vector:
    AI_COMPUTE_DEMAND: 1
    HYPERSCALER_CAPEX: 0
    SEMICONDUCTOR_WFE: 0
    ADVANCED_PACKAGING: 0
    HBM_MEMORY: 0
    EDA_DESIGN_COMPLEXITY: 0
    CLOUD_SOFTWARE_DEMAND: 2
    DATA_CENTER_POWER: 0
    LAUNCH_ECONOMICS: 0
    SATELLITE_CONNECTIVITY: 0
    GOVERNMENT_DEFENSE: 2
    INTEREST_RATES: -1
    CAPITAL_MARKETS: 1
    CHINA_REVENUE: 0
    TAIWAN_SUPPLY: 0
    ACQUISITION_INTEGRATION: 0
  failure_modes:
    - {failure_id: PLTR-FM-01, name: "U.S. government procurement/budget slowdown", common_cause_id: GOVERNMENT_DEFENSE_BUDGET_SLOWDOWN, severity: high}
    - {failure_id: PLTR-FM-02, name: "Commercial AI deployment growth slows", common_cause_id: CLOUD_SOFTWARE_DEMAND_SLOWDOWN, severity: high}
    - {failure_id: PLTR-FM-03, name: "AIP commercialization fails to sustain current expansion", common_cause_id: AI_MONETIZATION_FAILURE, severity: high}
    - {failure_id: PLTR-FM-04, name: "TCV/RDV fails to convert because options are not exercised or contracts terminate", common_cause_id: CONTRACT_CONVERSION_FAILURE, severity: high}
    - {failure_id: PLTR-FM-05, name: "Government-contract compliance/security issue impairs eligibility", common_cause_id: GOVERNMENT_CONTRACT_COMPLIANCE, severity: critical}
    - {failure_id: PLTR-FM-06, name: "U.S. revenue concentration magnifies domestic demand shock", common_cause_id: GEOGRAPHIC_REVENUE_CONCENTRATION, severity: medium}
    - {failure_id: PLTR-FM-07, name: "Stock-based compensation/dilution reaccelerates", common_cause_id: EQUITY_COMPENSATION_DILUTION, severity: medium}
