  status: "pre_system_prior"
  recorded_as_historical_fact: true
  approved_target_portfolio: false
  use_as_optimizer_input: false
  use_as_target_weights: false
  owner_confirmation: {status: confirmed, date: "2026-09-20", note: "список и веса воспроизведены другой LLM по прежней переписке, владелец подтвердил"}

  purpose:
    - "Сохранить первоначальную гипотезу портфеля до полного прогона инвестиционной системы."
    - "Позволить ex-post сравнить первоначальный человеческий выбор с результатом Company Model → Conditional MC → Marginal Portfolio Contribution → Portfolio Optimizer → Stability Test."
    - "Выявлять anchoring: система не должна рационализировать прежние веса."

  candidates:
    - {ticker: AVGO, prior_weight: 0.15, role: candidate}
    - {ticker: NVDA, prior_weight: 0.15, role: candidate}
    - {ticker: KLAC, prior_weight: 0.14, role: candidate}
    - {ticker: ASML, prior_weight: 0.11, role: candidate}
