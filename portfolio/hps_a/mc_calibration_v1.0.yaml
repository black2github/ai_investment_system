schema_version: 1.0.2
artifact: company_mc_calibration
ticker: HPS.A
as_of: '2026-10-02'
archetype: mature_positive_margin
calculation_engine_version: company_mc 2.3.1
state_vector:
  Demand_Backlog: B3
  Margin_Quality: M2
  Cash_Conversion: C1
  AEG_Integration: I1
  US_DataCenter_Exposure: D3
  FX_Tariff_Execution: T2
simulation:
  paths: 500000
  paths_meta:
    provenance: model_assumption
    rationale: Normative production path count.
  seed: 20260920
  seed_meta:
    provenance: model_assumption
    rationale: Fixed reproducibility seed.
  antithetic_variates: true
  store_summary_quantiles:
  - 0.01
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  - 0.99
  store_summary_quantiles_meta:
    provenance: model_assumption
    rationale: Standard system summary grid.
  horizons_years:
  - 3
  - 5
  - 8
  horizons_years_meta:
    provenance: model_assumption
    rationale: Current Thesis / Primary Optimization / Persistence horizons.
revenue_model:
  segments:
    Legacy_HPS_pre_AEG:
      base_revenue_quarterly: 324802000.0
      base_revenue_quarterly_meta:
        provenance: verified_fact
        source_ref: 2026-06-27 | https://americas.hammondpowersolutions.com/-/media/Project/HPS/shared/Investor-Relations/2026-YEAR-ITEMS/Q2-2026/2026-HPS-Q2-Report_FINAL.pdf
          | currency CAD; fx reference 2026-10-02 Bank of Canada CADUSD 0.7020 for cross-portfolio conversion only.
      initial_growth:
        distribution: triangular
        min: 0.1
        mode: 0.3
        max: 0.45
        provenance: model_assumption
        rationale: Q2 sales grew 44.7% YoY and backlog rose 96.9%; center is deliberately below Q2 growth to recognize order
          timing, capacity and acquisition-transition noise. AEG is excluded.
      long_run_growth_y8:
        distribution: triangular
        min: 0.02
        mode: 0.09
        max: 0.16
        provenance: model_assumption
        rationale: Long-run transformer/electrification demand mean-reverts from exceptional backlog growth.
      growth_half_life_years: 2.0
      growth_half_life_years_meta:
        provenance: model_assumption
        rationale: Growth normalizes over a multi-year operating cycle.
      latent_loading:
        growth: 0.65
      latent_loading_meta:
        provenance: model_assumption
        rationale: Shared demand exposure remains material alongside company-specific execution.
margin_model:
  method: mean_reverting_positive_margin
  current_margin: 0.09885659434029462
  current_margin_meta:
    provenance: model_assumption
    rationale: Normalized pre-AEG H1 cash margin = (4.953M CFO + 68.232M working-capital outflow - 14.895M capex)/589.642M
      sales = 9.8857%; explicit normalization, not reported FCF.
  terminal_margin_Y5:
    distribution: triangular
    min: 0.06
    mode: 0.11
    max: 0.16
    provenance: model_assumption
    rationale: Y5 spans working-capital/integration downside through modest operating leverage; no AEG synergy is embedded
      before factual consolidation.
  terminal_margin_Y8:
    distribution: triangular
    min: 0.06
    mode: 0.12
    max: 0.18
    provenance: model_assumption
    rationale: Long-run margin remains industrial rather than software-like and retains integration/tariff risk.
  half_life_years: 2.5
  half_life_years_meta:
    provenance: model_assumption
    rationale: Cash-margin convergence horizon.
  shock_sigma: 0.04
  shock_sigma_meta:
    provenance: model_assumption
    rationale: Quarterly company-specific cash-margin noise, separate from Joint Layer drivers.
  shock_persistence: 0.55
  shock_persistence_meta:
    provenance: model_assumption
    rationale: Operating and working-capital shocks persist across adjacent quarters but mean-revert.
  lower_bound: -0.02
  lower_bound_meta:
    provenance: model_assumption
    rationale: Severe operating downside bound; discrete thesis breaks remain failure/recalibration events.
  upper_bound: 0.2
  upper_bound_meta:
    provenance: model_assumption
    rationale: Caps extrapolation beyond economically plausible mature cash conversion.
valuation:
  Y3:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 12.0
      mode: 24.0
      max: 38.0
      provenance: model_assumption
      rationale: Near-term multiple captures data-center/electrification duration but wide cyclical downside.
  Y5:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 10.0
      mode: 20.0
      max: 32.0
      provenance: model_assumption
      rationale: Mature industrial FCF multiple, independently chosen.
  Y8:
    basis: FCF_multiple
    multiple:
      distribution: triangular
      min: 9.0
      mode: 17.0
      max: 28.0
      provenance: model_assumption
      rationale: Long-run duration compresses as backlog and growth normalize.
  negative_fcf_fallback:
    basis: revenue_bridge
    multiple:
      distribution: triangular
      min: 1.0
      mode: 2.2
      max: 3.6
      provenance: model_assumption
      rationale: 'Parity bridge: 2.2x revenue / 20x FCF implies 11% margin, exactly the independent Y5 margin center.'
dependencies:
  latent_factors:
  - growth
  - margin
  - valuation
  factor_correlations:
    growth__margin: 0.35
    growth__valuation: 0.25
    margin__valuation: 0.35
  factor_correlations_meta:
    provenance: model_assumption
    rationale: Industrial demand/backlog, cash conversion and valuation are linked but integration/FX execution remain company-specific.
  default_loading: 0.62
  default_loading_meta:
    provenance: model_assumption
    rationale: Common-factor loading leaves material idiosyncratic execution risk.
market_path_model:
  quarterly_log_price_noise:
    annualized_sigma: 0.42
    annualized_sigma_meta:
      provenance: model_assumption
      rationale: Path-volatility calibration for drawdown diagnostics only; does not set terminal value.
  valuation_mean_reversion_half_life_years: 1.5
  valuation_mean_reversion_half_life_years_meta:
    provenance: model_assumption
    rationale: Liquid listed-equity valuation dislocations mean-revert over several quarters.
reverse_valuation_ref:
  run_ref: PENDING_HOST_RUN:HPSA_calibration_v1.0.yaml
  implied_revenue_cagr_5y: 0.15863046057843208
  implied_revenue_cagr_5y_meta:
    provenance: derived_fact
    formula: Local deterministic preflight of Reverse Valuation equity-FCF equation from HPSA_calibration_v1.0.yaml; AEG is
      excluded from operating base until factual Q3 consolidation; host run_ref remains authoritative.
  discount_rate: 0.1
  discount_rate_meta:
    provenance: model_assumption
    rationale: Inherited from HPS.A RV base calibration.
robustness_tests:
  Scenario_Robustness:
    perturbations:
      growth_modes_pp:
      - -0.017921510973005466
      - 0.017921510973005466
      margin_nodes_pp:
      - -0.005103103630798289
      - 0.005103103630798289
      terminal_multiple_pct:
      - -0.0579715255611869
      - 0.06153903744334466
      correlation_rho:
      - -0.15
      - 0.15
    perturbations_meta:
      provenance: derived_fact
      formula: 'v1.1.2 local preflight: sigma_eq from triangular nodes; growth is base-revenue-weighted RMS of segment initial-growth
        sigma; margin is Y5 triangular sigma; multiple is Y5 log-space triangular sigma; perturbation = 0.25*sigma; correlation
        +/-0.15.'
    delta_tolerance: 0.1
    delta_tolerance_meta:
      provenance: model_assumption
      rationale: Accepted v1.1.2 tolerance for |Delta P(2x,5Y)| and |Delta P(loss>30%,5Y)|.
joint_simulation:
  layer_version: '1.0'
  active_drivers:
  - DATA_CENTER_POWER
  - HYPERSCALER_CAPEX
  - ACQUISITION_INTEGRATION
  - INTEREST_RATES
  - ELECTRIFICATION_GRID
  company_idiosyncratic_factors:
  - id: HPSA_EXECUTION
    distribution: standard_normal
    persistence: 0.55
    persistence_meta:
      provenance: model_assumption
      rationale: Company-specific execution shocks persist across adjacent quarters but mean-revert.
  path_alignment:
    use_global_path_id: true
driver_parameter_mapping:
- driver_id: DATA_CENTER_POWER
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Legacy_HPS_pre_AEG.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.025
    lag_quarters: 0
    decay_half_life_quarters: 8
    meta:
      provenance: model_assumption
      rationale: Data-center power buildout shifts transformer demand and backlog conversion.
  structural_support:
  - path: revenue_model.segments.Legacy_HPS_pre_AEG.initial_growth.mode
    contribution: 0.01
    meta:
      provenance: model_assumption
      rationale: D3/B3 center assumes strong but normalizing data-center demand.
  stability:
    knockout:
      mode: remove_structural_support
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Primary demand linkage.
- driver_id: HYPERSCALER_CAPEX
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Legacy_HPS_pre_AEG.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.02
    lag_quarters: 1
    decay_half_life_quarters: 8
    meta:
      provenance: model_assumption
      rationale: Hyperscaler capex influences data-center transformer demand with lag.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Demand dependency, not a separate AEG contribution.
- driver_id: ACQUISITION_INTEGRATION
  material: true
  stochastic_targets:
  - path: margin_model.terminal_margin_Y5
    transform: additive_pp
    effect_per_plus_1sigma: 0.015
    lag_quarters: 1
    decay_half_life_quarters: 8
    meta:
      provenance: model_assumption
      rationale: AEG integration affects future cash margin after consolidation; it does not alter Q2 base revenue or reported
        pre-close facts.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: AEG first enters operating calibration from factual Q3 2026 consolidated period. No pro-forma AEG revenue is injected
    here.
- driver_id: INTEREST_RATES
  material: true
  stochastic_targets:
  - path: valuation.Y5.multiple
    transform: log_multiplier
    effect_per_plus_1sigma: -0.018
    lag_quarters: 0
    decay_half_life_quarters: 6
    meta:
      provenance: model_assumption
      rationale: Higher rates compress industrial duration valuation and acquisition financing economics.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: 1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Valuation channel; exact AEG drawn debt is not estimated.
- driver_id: ELECTRIFICATION_GRID
  material: true
  stochastic_targets:
  - path: revenue_model.segments.Legacy_HPS_pre_AEG.initial_growth
    transform: additive_pp
    effect_per_plus_1sigma: 0.012
    lag_quarters: 2
    decay_half_life_quarters: 10
    meta:
      provenance: model_assumption
      rationale: Grid electrification supports persistent transformer demand; schema v1.0.2 maps stochastic growth effects
        through initial_growth, while long-run support remains in the segment rationale.
  structural_support: []
  stability:
    knockout:
      mode: not_applicable
    adverse_driver_stress:
      driver_sigma: -1
      meta:
        provenance: model_assumption
        rationale: Adverse driver direction for this company mapping.
  note: Long-run structural demand linkage.
