# Вектор состояний MSFT (оси и состояния). Переходы — triggers.yaml, текущий вектор — state.json.
version: '1.0'
artifact: MSFT State Vector
as_of: '2026-09-21'
ticker: MSFT
source_artifact: inbox/received/MSFT_company_state_v1.0.yaml (другая LLM, 2026-09-21, share https://chatgpt.com/share/6ab0ce43-9540-83eb-8e39-ec1d3e21002c)
purpose: Оси и состояния компании. Условия переходов — в triggers.yaml (поле transition). Текущий вектор — state.json → scenario_state.
semantics:
  primary_only: true
  thresholds_provenance: model_assumption
  pending_verification_blocks_transition: true
  trigger_not_decision: true
sources:
  MSFT_FY2026_10K:
    url: https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm
    type: SEC 10-K
  MSFT_FY2026_Q4_RELEASE:
    url: https://www.microsoft.com/en-us/investor/earnings/fy-2026-q4/press-release-webcast
    type: Microsoft IR earnings release
  MSFT_FY2026_Q4_METRICS:
    url: https://www.microsoft.com/en-us/investor/earnings/fy-2026-q4/metrics
    type: Microsoft IR metrics
  MSFT_FY2026_Q4_CALL:
    url: https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q4
    type: Microsoft IR earnings call
axes:
  Cloud_AI_Demand:
    name: Cloud AI Demand
    name_ru: спрос на облако и ИИ (Azure)
    states:
      A0:
        name: mature
        criteria: Azure YoY <20%
      A1:
        name: strong
        criteria: Azure YoY >=20% and <30%
      A2:
        name: very_strong
        criteria: Azure YoY >=30% and <40%
      A3:
        name: hypergrowth
        criteria: Azure YoY >=40% AND Microsoft Cloud YoY >=20%
      A4:
        name: durable_hypergrowth
        criteria: Azure YoY >=40% for 2 quarters AND demand continues to exceed available capacity
    current: A4
    current_evidence:
    - FY2026 Q4 Azure and other cloud services grew 43% YoY.
    - Management stated demand continues to exceed available capacity.
    source_refs:
    - MSFT_FY2026_Q4_METRICS
    - MSFT_FY2026_Q4_CALL
  Software_Monetization:
    name: Software Monetization
    name_ru: монетизация ПО (Copilot, M365)
    states:
      S0:
        name: low_growth
        criteria: M365 Commercial cloud revenue YoY <10%
      S1:
        name: mature
        criteria: growth >=10% and <15%
      S2:
        name: healthy
        criteria: growth >=15% and <20%
      S3:
        name: strong
        criteria: growth >=20% and commercial RPO YoY >=20%
      S4:
        name: exceptional
        criteria: growth >=25% and commercial RPO YoY >=30% for 2 quarters
    current: S1
    current_evidence:
    - Q4 M365 Commercial cloud revenue grew 14% reported.
    - Commercial RPO reached $678B.
    source_refs:
    - MSFT_FY2026_Q4_RELEASE
    - MSFT_FY2026_Q4_METRICS
  AI_Capital_Intensity:
    name: AI Capital Intensity
    name_ru: капиталоёмкость ИИ (capex к выручке)
    states:
      C0:
        name: normalized
        criteria: cash capex/revenue <15%
      C1:
        name: elevated
        criteria: cash capex/revenue >=15% and <25%
      C2:
        name: aggressive
        criteria: cash capex/revenue >=25% and <35%
      C3:
        name: extreme_but_cash_generative
        criteria: cash capex/revenue >=35% AND quarterly FCF >0
      C4:
        name: cash_conversion_stress
        criteria: cash capex/revenue >=40% AND quarterly FCF margin <10% for 2 quarters
    current: C3
    current_evidence:
    - Q4 cash PP&E $35.8B on $90.0B revenue = 39.8%; FCF $19.6B.
    source_refs:
    - MSFT_FY2026_Q4_CALL
    - MSFT_FY2026_Q4_RELEASE
  Cloud_Margin:
    name: Cloud Margin
    name_ru: маржа облака
    states:
      M0:
        name: compressed
        criteria: Microsoft Cloud gross margin <55%
      M1:
        name: moderate
        criteria: margin >=55% and <60%
      M2:
        name: healthy
        criteria: margin >=60% and <65%
      M3:
        name: strong
        criteria: margin >=65% and <70%
      M4:
        name: exceptional
        criteria: margin >=70% for 2 quarters
    current: M3
    current_evidence:
    - Microsoft Cloud gross margin was 65%.
    source_refs:
    - MSFT_FY2026_Q4_METRICS
  Contracted_Demand:
    name: Contracted Demand
    name_ru: законтрактованный спрос (RPO)
    states:
      R0:
        name: low_visibility
        criteria: commercial RPO < $300B
      R1:
        name: strong
        criteria: RPO >=$300B and < $450B
      R2:
        name: very_strong
        criteria: RPO >=$450B and < $600B
      R3:
        name: exceptional
        criteria: RPO >=$600B
      R4:
        name: diversified_exceptional
        criteria: RPO >=$600B AND ex-OpenAI RPO YoY >=25% for 2 quarters
    current: R3
    current_evidence:
    - Commercial RPO $678B, +84% YoY; ex-OpenAI +25%.
    source_refs:
    - MSFT_FY2026_Q4_CALL
    - MSFT_FY2026_Q4_METRICS
