# Вектор состояний NVDA (оси и состояния). Переходы — triggers.yaml, текущий вектор — state.json.
schema_version: '1.0.1'
version: '1.0'
artifact: NVDA State Vector
as_of: '2026-09-21'
ticker: NVDA
source_artifact: inbox/received/NVDA_company_state_v1.0.yaml (другая LLM, партия 1, 2026-09-21, share https://chatgpt.com/share/6ab04f22-52b4-83eb-ab75-17495e90bb0f)
purpose: Оси и состояния компании. Условия переходов — в triggers.yaml (поле transition). Текущий вектор — state.json → scenario_state.
semantics:
  evidence_required: true
  pending_verification_blocks_transition: true
  trigger_not_decision: true
  numeric_thresholds_provenance: model_assumption
sources:
  NVDA_Q2_10Q:
    source_class: regulatory_filing
    url: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000075/nvda-20260726.htm
    as_of: '2026-09-21'
  NVDA_Q2_RELEASE:
    source_class: regulatory_filing
    url: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm
    as_of: '2026-09-21'
axes:
  AI_Demand:
    name: AI Demand
    name_ru: спрос на AI (выручка Data Center)
    states:
      D0:
        name: mature_growth
        criteria: Data Center revenue YoY <20%
      D1:
        name: strong_growth
        criteria: YoY >=20% and <50%
      D2:
        name: hypergrowth
        criteria: YoY >=50% and <100%
      D3:
        name: extreme_hypergrowth
        criteria: latest-quarter YoY >=100%
      D4:
        name: durable_extreme_hypergrowth
        criteria: latest-quarter YoY >=100% AND 2-quarter aggregate YoY >=100%
    current: D4
    current_evidence: []
    source_refs:
    - NVDA_Q2_10Q
  Gross_Margin:
    name: Gross Margin
    name_ru: валовая маржа
    states:
      M0:
        name: compressed
        criteria: gross margin <55%
      M1:
        name: recovering
        criteria: 55%-<65%
      M2:
        name: strong
        criteria: 65%-<72%
      M3:
        name: premium
        criteria: 72%-<78%
      M4:
        name: exceptional
        criteria: '>=78% for 2 quarters'
    current: M3
    current_evidence: []
    source_refs:
    - NVDA_Q2_10Q
  Customer_Breadth:
    name: Customer Breadth
    name_ru: широта клиентской базы (доля ACIE)
    states:
      B0:
        name: narrow
        criteria: ACIE share of Data Center revenue <20%
      B1:
        name: hyperscale_dominant
        criteria: ACIE share 20%-<30%
      B2:
        name: broadening
        criteria: ACIE share 30%-<40%
      B3:
        name: broad
        criteria: ACIE share >=40% AND latest-quarter ACIE YoY growth >=50%
      B4:
        name: durable_broad
        criteria: ACIE share >=40% AND 2-quarter aggregate ACIE YoY growth >=50%
    current: B4
    current_evidence: []
    source_refs:
    - NVDA_Q2_10Q
  Supply_Commitment:
    name: Supply Commitment
    name_ru: обязательства перед поставщиками
    states:
      S0:
        name: light
        criteria: supply commitments / annualized latest-quarter revenue <0.25x
      S1:
        name: moderate
        criteria: 0.25x-<0.50x
      S2:
        name: elevated
        criteria: 0.50x-<1.00x
      S3:
        name: extreme
        criteria: '>=1.00x'
      S4:
        name: mismatch
        criteria: inventory/excess-purchase provision >2% of quarterly revenue for 2 quarters
    current: S2
    current_evidence: []
    source_refs:
    - NVDA_Q2_10Q
  China_Access:
    name: China Access
    name_ru: доступ на рынок Китая
    states:
      X0:
        name: unrestricted
        criteria: competitive Data Center products broadly saleable in China
      X1:
        name: restricted_but_material
        criteria: China Data Center shipments >=5% of Data Center revenue
      X2:
        name: effectively_foreclosed
        criteria: China Data Center shipments <1% and company states effective foreclosure
      X3:
        name: broader_export_impairment
        criteria: new restrictions outside current China foreclosure cause >=5% quarterly revenue loss/charge
      X4:
        name: systemic_trade_impairment
        criteria: restrictions materially impair both sales and critical supply chain
    current: X2
    current_evidence: []
    source_refs:
    - NVDA_Q2_10Q
