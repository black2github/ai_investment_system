    source: https://www.sec.gov/Archives/edgar/data/1639920/000162828026052543/spot-20260630x6xk.htm
    note: cash = cash and cash equivalents + short-term investments. Exchangeable Notes matured 2026-03-15 and were settled;
      Spotify disclosed no outstanding indebtedness other than leases at 2026-06-30. Equity-FCF terminal method does not subtract
      net cash twice.
  base_period:
    revenue_ttm: 18113000000.0
    current_fcf_margin: 0.1741138560687433
    revenue_formula: FY2025 revenue 17.186B + H1 2026 9.310B - H1 2025 8.383B = 18.113B EUR TTM.
    fcf_margin_formula: H1 2026 Spotify-defined FCF 1.621B / H1 revenue 9.310B = 17.4114%.
  discount_rate:
    base: 0.1
    stress:
      min: 0.085
      max: 0.12
  terminal_fcf_margin:
    min: 0.12
    base: 0.18
    max: 0.24
  terminal_fcf_multiple:
    unit: x FCF
    min: 16
    base: 24
    max: 32
  margin_transition:
    type: mature_mean_reversion
    path:
      '1': 0.175
      '2': 0.176
      '3': 0.178
      '4': 0.179
      '5': terminal
    critical_assumption:
      linked_state: M3/C3
      description: 'H1 FCF margin is already positive at 17.4%. Base case assumes a modest convergence toward an 18% mature
        cash margin: gross margin around one-third of revenue provides operating-leverage headroom, while content royalties,
        product investment and working-capital variability prevent software-like terminal cash margins.'
      falsification: Two consecutive reporting periods with FCF margin <12%, or consolidated gross margin <29%, or sustained
        content-cost growth materially above revenue growth require recalibration.
  calculation:
    forecast_years: 5
    terminal_method: equity_fcf_multiple
  sensitivity_grid:
    discount_rate:
    - 0.085
    - 0.1
    - 0.12
    terminal_fcf_margin:
    - 0.12
    - 0.18
    - 0.24
    terminal_fcf_multiple:
    - 16
    - 24
    - 32
  base_case:
