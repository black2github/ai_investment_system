    action: "Зафиксировать переход AI compute A0→A1 в state.json (state_transitions, scenario_state) и отправить Decision Request владельцу; инвестиционное действие не предопределено"
    automation: spacex-report-check
    status: active
    notes: "Переход состояния оси AI compute: A0→A1. Период подтверждения: один квартал."

