driver_interpretation:
  HYPERSCALER_CAPEX:
    directionality: positive_dependency
    rationale: Data-centre buildout directly supports transformer/power-quality demand; taxonomy link is dependency_not_share_binding.
  DATA_CENTER_POWER:
    directionality: positive_dependency
    rationale: Power-density/infrastructure investment expands demand; not a business-share driver.
  ACQUISITION_INTEGRATION:
    directionality: positive_if_successful
    rationale: AEG integration is material to future mix and margin; integration failure remains a failure mode.
  TAIWAN_SUPPLY:
    directionality: negative
    rationale: Electronics/power-conversion components can face supply disruption; magnitude kept -1 because HPS transformer manufacturing is
      geographically diversified.
failure_modes:
