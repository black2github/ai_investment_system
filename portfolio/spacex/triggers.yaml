    supporting_metrics: [SPCX-METRIC-01]
    notes_kpi: "Вторая ветвь OR — non-cancellable cloud contracts >= $1B — не представлена отдельным\
  \ KPI в kpis.yaml."
    condition: "AI revenue >= $0.5B за квартал ИЛИ подписанные non-cancellable cloud contracts >= $1B"
    period: "один квартал"
